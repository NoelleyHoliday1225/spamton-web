<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spamton Shop</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<h1 id="mainTitle">
    HEY EVERY !!
</h1>


<a
    href="friend-destroyer.html"
    id="friendDestroyerButton"
>
    [ FRIEND DESTROYER ]
</a>


<a
    href="secret-pipis.html"
    id="secretRoomButton"
>
    [ SECRET PIPIS ]
</a>


<!-- =====================================================
     LOGROS
===================================================== -->

<div id="achievements">

    <button
        id="achievementBerdly"
        class="achievement"
        type="button"
        title="Berdly - 100 Kills"
    >
        🐦
    </button>


    <button
        id="achievementSusie"
        class="achievement"
        type="button"
        title="Susie - 1000 Kills"
    >
        🥞
    </button>


    <a
        href="noelle.html"
        id="achievementNoelle"
        class="achievement"
        title="Noelle - 10000 Kills"
    >
        ❄️
    </a>


    <button
        id="achievementBigShot"
        class="achievement"
        type="button"
        title="BIG SHOT"
    >
        🏆
    </button>


    <button
        id="achievementCat"
        class="achievement"
        type="button"
        title="Gato Sagrado de Susie"
    >
        🐱
    </button>

</div>


<!-- =====================================================
     SPAMTON
===================================================== -->

<img
    src="spamton-idle.gif"
    alt="Spamton"
    id="mainSpamton"
    class="main-spamton"
>


<button
    id="pipisButton"
    type="button"
>
    [ PIPIS ]
</button>


<audio
    id="pipisSound"
    src="pipis.mp3"
    preload="auto"
></audio>


<audio
    id="normalMusic"
    src="want-to-be-a.mp3"
    preload="auto"
    loop
></audio>


<audio
    id="bigShotMusic"
    src="big-shot.mp3"
    preload="auto"
    loop
></audio>


<audio
    id="berdlyMusic"
    src="berdly-musica.mp3"
    preload="auto"
    loop
></audio>


<audio
    id="susieMusic"
    src="susie-musica.mp3"
    preload="auto"
    loop
></audio>


<!-- =====================================================
     MUSICA NORMAL
===================================================== -->

<div id="musicBox">

    <img
        src="spamton-dancing.gif"
        id="dancingSpamton"
        alt="Spamton bailando"
    >

    <button
        id="musicButton"
        type="button"
    >
        [ TURN ON THE MUSIC ]
    </button>

</div>


<!-- =====================================================
     SUSIE
===================================================== -->

<div id="susieGlitch">

    <div class="susie-caption">
        <span class="susie-arrow">↘</span>
        SUSIE COMIENDO PANCAKES
    </div>

    <div class="glitch-scribbles">
        /// !!! ///
        <br>
        PANCAKES???
        <br>
        !! ?? ##
    </div>

    <img
        src="susie-eating-pancakes.gif"
        id="susieGif"
        alt="Susie"
    >

    <div class="susie-name">
        S U S I E
    </div>

</div>


<!-- =====================================================
     LLUVIA
===================================================== -->

<div id="pipisRain"></div>


<!-- =====================================================
     GATO
===================================================== -->

<div id="catDiscovery">

    <div class="catDiscoveryGlitch">
        [[ !! SPECIAL DEAL !! ]]
    </div>

    <div class="catDiscoveryText">

        HAS ENCONTRADO AL
        <br>
        [[ GATO ]]
        <br>
        SAGRADO DE SUSIE!!

    </div>

    <img
        src="gato.png"
        id="catDiscoveryImage"
        alt="Gato"
    >

</div>


<!-- =====================================================
     MENU DE PERSONAJES
===================================================== -->

<div
    id="characterMenu"
    class="character-menu"
>

    <div
        id="characterBackground"
        class="character-background"
    ></div>


    <div class="character-content">

        <div
            id="characterWarning"
            class="character-warning"
        >
            // SYSTEM ACCESS //
        </div>


        <h2 id="characterTitle">
            CHARACTER
        </h2>


        <img
            id="characterImage"
            src=""
            alt="Character"
        >


        <div
            id="characterName"
            class="character-name"
        >
        </div>


        <button
            id="characterMusicButton"
            type="button"
        >
            [ PLAY MUSIC ]
        </button>


        <button
            id="characterCloseButton"
            type="button"
        >
            [ CLOSE ]
        </button>

    </div>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =================================================
           ELEMENTOS
        ================================================= */

        const pipisButton =
            document.getElementById(
                "pipisButton"
            );

        const pipisSound =
            document.getElementById(
                "pipisSound"
            );

        const pipisRain =
            document.getElementById(
                "pipisRain"
            );

        const normalMusic =
            document.getElementById(
                "normalMusic"
            );

        const bigShotMusic =
            document.getElementById(
                "bigShotMusic"
            );

        const berdlyMusic =
            document.getElementById(
                "berdlyMusic"
            );

        const susieMusic =
            document.getElementById(
                "susieMusic"
            );

        const musicButton =
            document.getElementById(
                "musicButton"
            );

        const mainSpamton =
            document.getElementById(
                "mainSpamton"
            );


        const achievementBerdly =
            document.getElementById(
                "achievementBerdly"
            );

        const achievementSusie =
            document.getElementById(
                "achievementSusie"
            );

        const achievementNoelle =
            document.getElementById(
                "achievementNoelle"
            );

        const achievementBigShot =
            document.getElementById(
                "achievementBigShot"
            );

        const achievementCat =
            document.getElementById(
                "achievementCat"
            );


        const catDiscovery =
            document.getElementById(
                "catDiscovery"
            );


        /* =================================================
           MENU PERSONAJES
        ================================================= */

        const characterMenu =
            document.getElementById(
                "characterMenu"
            );

        const characterBackground =
            document.getElementById(
                "characterBackground"
            );

        const characterImage =
            document.getElementById(
                "characterImage"
            );

        const characterTitle =
            document.getElementById(
                "characterTitle"
            );

        const characterName =
            document.getElementById(
                "characterName"
            );

        const characterMusicButton =
            document.getElementById(
                "characterMusicButton"
            );

        const characterCloseButton =
            document.getElementById(
                "characterCloseButton"
            );


        /* =================================================
           VOLUMEN
        ================================================= */

        normalMusic.volume = 0.40;
        bigShotMusic.volume = 0.40;
        berdlyMusic.volume = 0.40;
        susieMusic.volume = 0.40;
        pipisSound.volume = 0.70;


        /* =================================================
           ESTADO
        ================================================= */

        let musicIsPlaying = false;

        let bigShotMode = false;

        let currentCharacterMusic = null;

        let currentCharacter = null;


        /* =================================================
           DESBLOQUEOS
        ================================================= */

        function refreshAchievements() {

            const berdlyUnlocked =
                localStorage.getItem(
                    "friendAchievement100"
                ) === "true";


            const susieUnlocked =
                localStorage.getItem(
                    "friendAchievement1000"
                ) === "true";


            const noelleUnlocked =
                localStorage.getItem(
                    "friendAchievement10000"
                ) === "true";


            const bigShotUnlocked =
                localStorage.getItem(
                    "spamtonBigShotAchievement"
                ) === "true";


            const catUnlocked =
                localStorage.getItem(
                    "spamtonSacredCatAchievement"
                ) === "true";


            achievementBerdly.style.display =
                berdlyUnlocked
                ? "flex"
                : "none";


            achievementSusie.style.display =
                susieUnlocked
                ? "flex"
                : "none";


            achievementNoelle.style.display =
                noelleUnlocked
                ? "flex"
                : "none";


            achievementBigShot.style.display =
                bigShotUnlocked
                ? "flex"
                : "none";


            achievementCat.style.display =
                catUnlocked
                ? "flex"
                : "none";

        }


        refreshAchievements();


        /* =================================================
           DETENER TODA LA MUSICA
           
           IMPORTANTE:
           NO borramos currentCharacterMusic aquí.
           Esto permite que el botón PLAY MUSIC de
           Berdly/Susie siga sabiendo qué canción usar.
        ================================================= */

        function stopAllMusic() {

            normalMusic.pause();
            bigShotMusic.pause();
            berdlyMusic.pause();
            susieMusic.pause();


            normalMusic.currentTime = 0;
            bigShotMusic.currentTime = 0;
            berdlyMusic.currentTime = 0;
            susieMusic.currentTime = 0;


            musicIsPlaying = false;


            musicButton.classList.remove(
                "music-on"
            );

        }


        /* =================================================
           MUSICA NORMAL
        ================================================= */

        function playNormalMusic() {

            stopAllMusic();


            const promise =
                normalMusic.play();


            if (promise) {

                promise.then(
                    function () {

                        musicIsPlaying = true;

                        musicButton.classList.add(
                            "music-on"
                        );

                        updateMusicButton();

                    }
                ).catch(
                    function () {

                        musicIsPlaying = false;

                        musicButton.classList.remove(
                            "music-on"
                        );

                        updateMusicButton();

                    }
                );

            }

        }


        /* =================================================
           BIG SHOT
        ================================================= */

        function playBigShotMusic() {

            stopAllMusic();


            const promise =
                bigShotMusic.play();


            if (promise) {

                promise.then(
                    function () {

                        musicIsPlaying = true;

                        musicButton.classList.add(
                            "music-on"
                        );

                        updateMusicButton();

                    }
                ).catch(
                    function () {

                        musicIsPlaying = false;

                        musicButton.classList.remove(
                            "music-on"
                        );

                        updateMusicButton();

                    }
                );

            }

        }


        /* =================================================
           BOTON MUSICA PRINCIPAL
        ================================================= */

        function updateMusicButton() {

            if (bigShotMode) {

                musicButton.textContent =
                    musicIsPlaying
                    ? "[ TURN OFF BIG SHOT ]"
                    : "[ TURN ON BIG SHOT ]";

            }

            else {

                musicButton.textContent =
                    musicIsPlaying
                    ? "[ TURN OFF THE MUSIC ]"
                    : "[ TURN ON THE MUSIC ]";

            }

        }


        musicButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                if (musicIsPlaying) {

                    stopAllMusic();

                    updateMusicButton();

                    return;

                }


                if (bigShotMode) {

                    playBigShotMusic();

                }

                else {

                    playNormalMusic();

                }

            }
        );


        /* =================================================
           BIG SHOT MODE
        ================================================= */

        achievementBigShot.addEventListener(
            "click",
            function () {

                bigShotMode =
                    !bigShotMode;


                if (bigShotMode) {

                    document.body.classList.add(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-neo.gif";


                    if (musicIsPlaying) {

                        playBigShotMusic();

                    }

                }

                else {

                    document.body.classList.remove(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-idle.gif";


                    if (musicIsPlaying) {

                        playNormalMusic();

                    }

                }


                updateMusicButton();

            }
        );


        /* =================================================
           MENU BERDLY
        ================================================= */

        achievementBerdly.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                openCharacterMenu(
                    "BERDLY",
                    "berdly-sprite-idle.gif",
                    "berdly-background.png",
                    berdlyMusic
                );

            }
        );


        /* =================================================
           MENU SUSIE
        ================================================= */

        achievementSusie.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                openCharacterMenu(
                    "SUSIE",
                    "susie-sprite-idle.gif",
                    "susie-background.png",
                    susieMusic
                );

            }
        );


        /* =================================================
           ABRIR MENU
        ================================================= */

        function openCharacterMenu(
            name,
            image,
            background,
            music
        ) {

            currentCharacter =
                name;


            /*
             * GUARDAMOS LA MUSICA ANTES DE DETENER
             * LAS DEMAS.
             */
            currentCharacterMusic =
                music;


            stopAllMusic();


            characterTitle.textContent =
                "PROCEED";


            characterName.textContent =
                name;


            characterImage.src =
                image;


            characterBackground.style.backgroundImage =
                "url('" +
                background +
                "')";


            characterMenu.classList.add(
                "active"
            );


            characterMusicButton.textContent =
                "[ PLAY MUSIC ]";

        }


        /* =================================================
           MUSICA DEL PERSONAJE
           
           ESTA ES LA PARTE PRINCIPALMENTE CORREGIDA.
        ================================================= */

        characterMusicButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                /*
                 * Si no hay personaje seleccionado,
                 * no hacemos nada.
                 */
                if (!currentCharacter) {
                    return;
                }


                /*
                 * Determinamos directamente qué música
                 * corresponde al personaje.
                 *
                 * Así no dependemos de que
                 * currentCharacterMusic haya sobrevivido
                 * a stopAllMusic().
                 */
                const selectedMusic =
                    currentCharacter === "BERDLY"
                    ? berdlyMusic
                    : susieMusic;


                /*
                 * Si esta música ya está sonando,
                 * la detenemos.
                 */
                if (
                    !selectedMusic.paused
                ) {

                    selectedMusic.pause();

                    selectedMusic.currentTime =
                        0;


                    characterMusicButton.textContent =
                        "[ PLAY MUSIC ]";


                    return;

                }


                /*
                 * Guardamos la referencia correcta.
                 */
                currentCharacterMusic =
                    selectedMusic;


                /*
                 * Detenemos cualquier otra música.
                 */
                stopAllMusic();


                /*
                 * IMPORTANTE:
                 * stopAllMusic() ya no borra
                 * currentCharacterMusic.
                 */


                currentCharacterMusic
                    .play()
                    .then(
                        function () {

                            characterMusicButton.textContent =
                                "[ STOP MUSIC ]";

                        }
                    )
                    .catch(
                        function (error) {

                            console.error(
                                "No se pudo reproducir la música:",
                                error
                            );


                            characterMusicButton.textContent =
                                "[ PLAY MUSIC ]";

                        }
                    );

            }
        );


        /* =================================================
           CLOSE
        ================================================= */

        characterCloseButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                closeCharacterMenu();

            }
        );


        function closeCharacterMenu() {

            characterMenu.classList.remove(
                "active"
            );


            /*
             * Detenemos cualquier música del personaje.
             */
            if (currentCharacterMusic) {

                currentCharacterMusic.pause();

                currentCharacterMusic.currentTime =
                    0;

            }


            /*
             * Por seguridad también detenemos
             * cualquier otra música.
             */
            berdlyMusic.pause();
            susieMusic.pause();


            berdlyMusic.currentTime = 0;
            susieMusic.currentTime = 0;


            currentCharacterMusic =
                null;


            currentCharacter =
                null;


            characterMusicButton.textContent =
                "[ PLAY MUSIC ]";


            characterImage.src =
                "";


            characterBackground.style.backgroundImage =
                "none";

        }


        /* =================================================
           CERRAR HACIENDO CLICK FUERA
        ================================================= */

        characterMenu.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    characterMenu
                ) {

                    closeCharacterMenu();

                }

            }
        );


        /* =================================================
           ESC PARA CERRAR
        ================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    characterMenu.classList.contains(
                        "active"
                    )
                ) {

                    closeCharacterMenu();

                }

            }
        );


        /* =================================================
           PIPIS
        ================================================= */

        function createPipis() {

            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const pipis =
                    document.createElement(
                        "img"
                    );


                pipis.src =
                    "pipis.gif";


                pipis.className =
                    "pipis-rain";


                const size =
                    Math.floor(
                        Math.random() * 60
                    ) + 40;


                pipis.style.left =
                    Math.random() * 100 +
                    "vw";


                pipis.style.width =
                    size + "px";


                pipis.style.animationDuration =
                    Math.random() * 2 +
                    2 +
                    "s";


                pipis.style.animationDelay =
                    Math.random() * 0.8 +
                    "s";


                pipisRain.appendChild(
                    pipis
                );


                setTimeout(
                    function () {

                        pipis.remove();

                    },
                    6000
                );

            }

        }


        pipisButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                pipisSound.currentTime =
                    0;


                pipisSound.play()
                    .catch(
                        function () {}
                    );


                createPipis();

            }
        );


        /* =================================================
           GATO
        ================================================= */

        function discoverCat() {

            localStorage.setItem(
                "spamtonSacredCatAchievement",
                "true"
            );


            achievementCat.style.display =
                "flex";


            catDiscovery.classList.add(
                "show"
            );


            setTimeout(
                function () {

                    catDiscovery.classList.remove(
                        "show"
                    );

                },
                5000
            );


            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const cat =
                    document.createElement(
                        "img"
                    );


                cat.src =
                    "gato.png";


                cat.className =
                    "cat-rain";


                cat.style.left =
                    Math.random() * 100 +
                    "vw";


                cat.style.width =
                    Math.random() * 55 +
                    45 +
                    "px";


                cat.style.animationDuration =
                    Math.random() * 2 +
                    2 +
                    "s";


                pipisRain.appendChild(
                    cat
                );


                setTimeout(
                    function () {

                        cat.remove();

                    },
                    6000
                );

            }

        }


        pipisButton.addEventListener(
            "dblclick",
            function () {

                const alreadyUnlocked =
                    localStorage.getItem(
                        "spamtonSacredCatAchievement"
                    ) === "true";


                if (!alreadyUnlocked) {

                    discoverCat();

                }

            }
        );


        /* =================================================
           CODIGO DEL CREADOR
        ================================================= */

        let creatorCode = "";


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    /^[0-9]$/.test(
                        event.key
                    )
                ) {

                    creatorCode +=
                        event.key;


                    if (
                        creatorCode.length > 4
                    ) {

                        creatorCode =
                            creatorCode.slice(
                                -4
                            );

                    }


                    if (
                        creatorCode === "1225"
                    ) {

                        localStorage.setItem(
                            "friendAchievement100",
                            "true"
                        );


                        localStorage.setItem(
                            "friendAchievement1000",
                            "true"
                        );


                        localStorage.setItem(
                            "friendAchievement10000",
                            "true"
                        );


                        refreshAchievements();


                        creatorCode = "";


                        alert(
                            "BERDLY, SUSIE Y NOELLE DESBLOQUEADOS."
                        );

                    }

                }

            }
        );


        /* =================================================
           INICIO
        ================================================= */

        updateMusicButton();

    }

);

</script>

</body>

</html>
