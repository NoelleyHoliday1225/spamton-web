<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         SALA SECRETA
    ====================================================== -->

    <a href="secret-pipis.html" id="secretRoomButton">
        [ SECRET PIPIS ]
    </a>


    <!-- =====================================================
         TROFEOS
    ====================================================== -->

    <div id="achievements">

        <!-- BIG SHOT -->
        <button
            id="achievementBigShot"
            class="achievement"
            type="button"
            title="Big Shot!"
        >
            🏆
        </button>


        <!-- GATO -->
        <button
            id="achievementCat"
            class="achievement"
            type="button"
            title="Gato Sagrado de Susie"
        >
            🐱
        </button>

    </div>


    <!-- =====================================================
         TITULO
    ====================================================== -->

    <h1>
        HEY EVERY !!
    </h1>


    <!-- =====================================================
         SPAMTON PRINCIPAL
    ====================================================== -->

    <img
        src="spamton-idle.gif"
        alt="Spamton"
        id="mainSpamton"
        class="main-spamton"
    >


    <!-- =====================================================
         BOTON PIPIS
    ====================================================== -->

    <button
        id="pipisButton"
        type="button"
    >
        [ PIPIS ]
    </button>


    <!-- =====================================================
         SONIDO PIPIS
    ====================================================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         MUSICA NORMAL
    ====================================================== -->

    <audio
        id="normalMusic"
        src="want-to-be-a.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         MUSICA BIG SHOT
    ====================================================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         CAJA DE MUSICA
    ====================================================== -->

    <div id="musicBox">

        <img
            src="spamton-dancing.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button
            id="musicButton"
            type="button"
        >
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =====================================================
         SUSIE
    ====================================================== -->

    <div id="susieGlitch">

        <div class="susie-caption">
            <span class="susie-arrow">↘</span>
            SUSIE COMIENDO PANCAKES
        </div>

        <div class="glitch-scribbles">
            /// !!! ///
            <br>
            PANCAKES???
            <br>
            !! ?? ##
        </div>

        <img
            src="susie-eating-pancakes.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >

        <div class="susie-name">
            S U S I E
        </div>

    </div>


    <!-- =====================================================
         LLUVIA DE PIPIS / GATOS
    ====================================================== -->

    <div id="pipisRain"></div>


    <!-- =====================================================
         MENSAJE DEL GATO
    ====================================================== -->

    <div id="catDiscovery">

        <div class="catDiscoveryGlitch">
            [[ !! SPECIAL DEAL !! ]]
        </div>

        <div class="catDiscoveryText">
            HAS ENCONTRADO AL
            <br>
            [[ GATO ]]
            <br>
            SAGRADO DE SUSIE!!
        </div>

        <img
            src="gato.png"
            alt="Gato Sagrado de Susie"
            id="catDiscoveryImage"
        >

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

    document.addEventListener("DOMContentLoaded", function () {

        /* =================================================
           ELEMENTOS
        ================================================= */

        const pipisButton =
            document.getElementById("pipisButton");

        const pipisSound =
            document.getElementById("pipisSound");

        const pipisRain =
            document.getElementById("pipisRain");

        const normalMusic =
            document.getElementById("normalMusic");

        const bigShotMusic =
            document.getElementById("bigShotMusic");

        const musicButton =
            document.getElementById("musicButton");

        const mainSpamton =
            document.getElementById("mainSpamton");

        const achievementBigShot =
            document.getElementById("achievementBigShot");

        const achievementCat =
            document.getElementById("achievementCat");

        const secretRoomButton =
            document.getElementById("secretRoomButton");

        const catDiscovery =
            document.getElementById("catDiscovery");


        /* =================================================
           VOLUMEN
        ================================================= */

        normalMusic.volume = 0.40;
        bigShotMusic.volume = 0.40;
        pipisSound.volume = 0.70;


        /* =================================================
           ESTADO
        ================================================= */

        let musicIsPlaying = false;
        let bigShotMode = false;


        /* =================================================
           LOGROS GUARDADOS
        ================================================= */

        let bigShotUnlocked =
            localStorage.getItem(
                "spamtonBigShotAchievement"
            ) === "true";


        let catUnlocked =
            localStorage.getItem(
                "spamtonSacredCatAchievement"
            ) === "true";


        /* =================================================
           MOSTRAR TROFEOS
        ================================================= */

        if (bigShotUnlocked) {

            achievementBigShot.style.display =
                "flex";

            secretRoomButton.style.display =
                "none";

        }


        if (catUnlocked) {

            achievementCat.style.display =
                "flex";

        }


        /* =================================================
           BOTON DE MUSICA
        ================================================= */

        function updateMusicButton() {

            if (bigShotMode) {

                if (musicIsPlaying) {

                    musicButton.textContent =
                        "[ TURN OFF THE BIG SHOT ]";

                } else {

                    musicButton.textContent =
                        "[ TURN ON THE BIG SHOT! ]";

                }

            } else {

                if (musicIsPlaying) {

                    musicButton.textContent =
                        "[ TURN OFF THE MUSIC ]";

                } else {

                    musicButton.textContent =
                        "[ TURN ON THE MUSIC ]";

                }

            }

        }


        /* =================================================
           DETENER TODAS LAS MUSICAS
        ================================================= */

        function stopAllMusic() {

            normalMusic.pause();
            bigShotMusic.pause();

            musicIsPlaying = false;

            updateMusicButton();

        }


        /* =================================================
           MUSICA NORMAL
        ================================================= */

        function playNormalMusic() {

            bigShotMusic.pause();

            normalMusic.volume = 0.40;

            const promise =
                normalMusic.play();

            if (promise !== undefined) {

                promise
                    .then(function () {

                        musicIsPlaying = true;

                        updateMusicButton();

                    })
                    .catch(function (error) {

                        console.log(
                            "Error música normal:",
                            error
                        );

                        musicIsPlaying = false;

                        updateMusicButton();

                    });

            }

        }


        /* =================================================
           MUSICA BIG SHOT
        ================================================= */

        function playBigShotMusic() {

            normalMusic.pause();

            bigShotMusic.volume = 0.40;

            const promise =
                bigShotMusic.play();

            if (promise !== undefined) {

                promise
                    .then(function () {

                        musicIsPlaying = true;

                        updateMusicButton();

                    })
                    .catch(function (error) {

                        console.log(
                            "Error Big Shot:",
                            error
                        );

                        musicIsPlaying = false;

                        updateMusicButton();

                    });

            }

        }


        /* =================================================
           BOTON DE MUSICA

           ESTE ES EL UNICO BOTON QUE CONTROLA
           LA MUSICA DE FONDO.
        ================================================= */

        musicButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                if (musicIsPlaying) {

                    stopAllMusic();

                } else {

                    if (bigShotMode) {

                        playBigShotMusic();

                    } else {

                        playNormalMusic();

                    }

                }

            }
        );


        /* =================================================
           CREAR PIPIS
        ================================================= */

        function createPipis() {

            for (let i = 0; i < 25; i++) {

                const pipis =
                    document.createElement("img");

                pipis.src =
                    "pipis.gif";

                pipis.className =
                    "pipis-rain";


                const size =
                    Math.floor(
                        Math.random() * 60
                    ) + 40;


                const left =
                    Math.random() * 100;


                const speed =
                    Math.random() * 2 + 2;


                const delay =
                    Math.random() * 0.8;


                pipis.style.left =
                    left + "vw";

                pipis.style.width =
                    size + "px";

                pipis.style.animationDuration =
                    speed + "s";

                pipis.style.animationDelay =
                    delay + "s";


                pipisRain.appendChild(
                    pipis
                );


                setTimeout(function () {

                    if (pipis.parentNode) {

                        pipis.remove();

                    }

                }, 6000);

            }

        }


        /* =================================================
           CREAR LLUVIA DE GATOS
        ================================================= */

        function createCatRain() {

            for (let i = 0; i < 25; i++) {

                const cat =
                    document.createElement("img");


                cat.src =
                    "gato.png";


                cat.className =
                    "cat-rain";


                const size =
                    Math.floor(
                        Math.random() * 55
                    ) + 45;


                const left =
                    Math.random() * 100;


                const speed =
                    Math.random() * 2 + 2;


                const delay =
                    Math.random() * 0.8;


                cat.style.left =
                    left + "vw";

                cat.style.width =
                    size + "px";

                cat.style.animationDuration =
                    speed + "s";

                cat.style.animationDelay =
                    delay + "s";


                pipisRain.appendChild(
                    cat
                );


                setTimeout(function () {

                    if (cat.parentNode) {

                        cat.remove();

                    }

                }, 6000);

            }

        }


        /* =================================================
           DESCUBRIR GATO POR PRIMERA VEZ
        ================================================= */

        function discoverCat() {

            catUnlocked = true;


            localStorage.setItem(
                "spamtonSacredCatAchievement",
                "true"
            );


            achievementCat.style.display =
                "flex";


            catDiscovery.classList.add(
                "show"
            );


            /* =============================================
               MENSAJE SOLO LA PRIMERA VEZ
            ============================================= */

            setTimeout(function () {

                catDiscovery.classList.remove(
                    "show"
                );

            }, 5000);


            /* =============================================
               LLUVIA DE GATOS
            ============================================= */

            createCatRain();

        }


        /* =================================================
           BOTON PIPIS

           1% DE PROBABILIDAD DE GATO
        ================================================= */

        pipisButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                /* =========================================
                   SONIDO PIPIS
                ========================================= */

                pipisSound.currentTime = 0;

                const soundPromise =
                    pipisSound.play();

                if (
                    soundPromise !== undefined
                ) {

                    soundPromise.catch(
                        function (error) {

                            console.log(
                                "Error sonido Pipis:",
                                error
                            );

                        }
                    );

                }


                /* =========================================
                   PROBABILIDAD

                   Math.random() devuelve entre 0 y 1.

                   Menor a 0.01 = 1%
                ========================================= */

                const catEvent =
                    Math.random() < 0.01;


                if (catEvent) {

                    /* =====================================
                       SI NUNCA LO HABIA CONSEGUIDO
                    ===================================== */

                    if (!catUnlocked) {

                        discoverCat();

                    } else {

                        /* ================================
                           YA TIENE EL LOGRO

                           NO MOSTRAR MENSAJE
                        ================================= */

                        createCatRain();

                    }

                } else {

                    /* =====================================
                       PIPIS NORMALES
                    ===================================== */

                    createPipis();

                }

            }
        );


        /* =================================================
           TROFEO BIG SHOT
        ================================================= */

        achievementBigShot.addEventListener(
            "click",
            function () {

                bigShotMode =
                    !bigShotMode;


                if (bigShotMode) {

                    document.body.classList.add(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-neo.gif";


                    if (musicIsPlaying) {

                        normalMusic.pause();

                        musicIsPlaying = false;

                        playBigShotMusic();

                    } else {

                        updateMusicButton();

                    }

                } else {

                    document.body.classList.remove(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-idle.gif";


                    if (musicIsPlaying) {

                        bigShotMusic.pause();

                        musicIsPlaying = false;

                        playNormalMusic();

                    } else {

                        updateMusicButton();

                    }

                }

            }
        );


        /* =================================================
           TROFEO DEL GATO
        ================================================= */

        achievementCat.addEventListener(
            "click",
            function () {

                catDiscovery.classList.add(
                    "show"
                );


                setTimeout(function () {

                    catDiscovery.classList.remove(
                        "show"
                    );

                }, 5000);

            }
        );


        /* =================================================
           ESTADO INICIAL
        ================================================= */

        updateMusicButton();


    });

    </script>

</body>

</html>
