<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>HEY EVERY !!</h1>


    <!-- SPAMTON PRINCIPAL -->

    <img
        src="spamton.gif"
        alt="Spamton"
        class="gif-spamton"
    >


    <!-- BOTÓN PIPIS -->

    <button id="pipisButton">
        [ PIPIS ]
    </button>


    <!-- SONIDO DE PIPIS -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
    ></audio>


    <!-- MÚSICA DE FONDO -->

    <audio
        id="backgroundMusic"
        src="want-to-be-a.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- SPAMTON BAILANDO + BOTÓN DE MÚSICA -->

    <div id="musicBox">

        <img
            src="spamton-bailando.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button id="musicButton">
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- CONTENEDOR DE LA LLUVIA -->

    <div id="pipisRain"></div>


    <script>


        /* =========================
           ELEMENTOS
        ========================= */

        const pipisButton =
            document.getElementById("pipisButton");

        const pipisSound =
            document.getElementById("pipisSound");

        const pipisRain =
            document.getElementById("pipisRain");

        const backgroundMusic =
            document.getElementById("backgroundMusic");

        const musicButton =
            document.getElementById("musicButton");

        const musicBox =
            document.getElementById("musicBox");


        /* =========================
           VOLUMEN
        ========================= */

        backgroundMusic.volume = 0.4;


        /* =========================
           INTENTAR AUTOPLAY
        ========================= */

        window.addEventListener("load", () => {

            backgroundMusic.play()
                .catch(() => {

                    console.log(
                        "El navegador bloqueó el autoplay"
                    );

                });

        });


        /* =========================
           BOTÓN MUSIC
        ========================= */

        musicButton.addEventListener(
            "click",
            () => {

                backgroundMusic.volume = 0.4;

                backgroundMusic.play();

                musicBox.classList.add(
                    "musicStarted"
                );

            }
        );


        /* =========================
           BOTÓN PIPIS
        ========================= */

        pipisButton.addEventListener(
            "click",
            () => {


                /* Asegurar música */

                if (backgroundMusic.paused) {

                    backgroundMusic.play();

                }


                /* Sonido Pipis */

                pipisSound.currentTime = 0;

                pipisSound.play();


                /* Crear 25 Pipis */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {


                    const pipis =
                        document.createElement("img");


                    pipis.src =
                        "pipis.gif";


                    pipis.className =
                        "pipis-rain";


                    /* Posición aleatoria */

                    pipis.style.left =
                        Math.random() * 100 + "vw";


                    /* Tamaño aleatorio */

                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;


                    pipis.style.width =
                        size + "px";


                    /* Velocidad */

                    const speed =
                        Math.random() * 2 + 2;


                    pipis.style.animationDuration =
                        speed + "s";


                    /* Retraso */

                    pipis.style.animationDelay =
                        Math.random() * 0.5 + "s";


                    /* Agregar Pipis */

                    pipisRain.appendChild(
                        pipis
                    );


                    /* Eliminar después */

                    setTimeout(
                        () => {

                            pipis.remove();

                        },
                        5000
                    );

                }

            }
        );


    </script>


</body>

</html>
