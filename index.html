<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =====================================================
         BOTÓN SALA SECRETA
    ====================================================== -->

    <a
        href="secret-pipis.html"
        id="secretRoomButton"
    >
        [ SECRET PIPIS ]
    </a>


    <!-- =====================================================
         TROFEO BIG SHOT
    ====================================================== -->

    <button
        id="achievementButton"
        type="button"
        title="Big Shot!"
        style="display:none;"
    >
        🏆
    </button>


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <h1>
        HEY EVERY !!
    </h1>


    <!-- =====================================================
         SPAMTON PRINCIPAL
    ====================================================== -->

    <img
        src="spamton-idle.gif"
        alt="Spamton"
        id="mainSpamton"
        class="main-spamton"
    >


    <!-- =====================================================
         BOTÓN PIPIS
    ====================================================== -->

    <button
        id="pipisButton"
        type="button"
    >
        [ PIPIS ]
    </button>


    <!-- =====================================================
         SONIDO PIPIS
    ====================================================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         MÚSICA NORMAL
    ====================================================== -->

    <audio
        id="normalMusic"
        src="want-to-be-a.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         MÚSICA BIG SHOT
    ====================================================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         CAJA DE MÚSICA
    ====================================================== -->

    <div id="musicBox">

        <img
            src="spamton-dancing.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button
            id="musicButton"
            type="button"
        >
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =====================================================
         SUSIE
    ====================================================== -->

    <div id="susieGlitch">

        <div class="susie-caption">

            <span class="susie-arrow">↘</span>

            SUSIE COMIENDO PANCAKES

        </div>


        <div class="glitch-scribbles">

            /// !!! ///

            <br>

            PANCAKES???

            <br>

            !! ?? ##

        </div>


        <img
            src="susie-eating-pancakes.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >


        <div class="susie-name">

            S U S I E

        </div>

    </div>


    <!-- =====================================================
         LLUVIA DE PIPIS
    ====================================================== -->

    <div id="pipisRain"></div>


    <!-- =====================================================
         GATO SAGRADO DE SUSIE
         
         OCULTO HASTA QUE SE ACTIVE EL 3%
    ====================================================== -->

    <div id="sacredCatEvent">

        <div id="sacredCatGlitch">

            /// [[ SPECIAL DEAL ]] ///

            <br>

            ! ! ! ! ! !

        </div>


        <div id="sacredCatText">

            HAZ ENCONTRADO AL

            <br>

            [[ GATO ]]

            <br>

            SAGRADO DE SUSIE!!

        </div>


        <img
            src="gato-sagrado.jpg"
            alt="Gato Sagrado de Susie"
            id="sacredCat"
        >

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const pipisButton =
            document.getElementById("pipisButton");


        const pipisSound =
            document.getElementById("pipisSound");


        const pipisRain =
            document.getElementById("pipisRain");


        const normalMusic =
            document.getElementById("normalMusic");


        const bigShotMusic =
            document.getElementById("bigShotMusic");


        const musicButton =
            document.getElementById("musicButton");


        const mainSpamton =
            document.getElementById("mainSpamton");


        const achievementButton =
            document.getElementById("achievementButton");


        const secretRoomButton =
            document.getElementById("secretRoomButton");


        const sacredCatEvent =
            document.getElementById("sacredCatEvent");


        /* =====================================================
           VOLUMEN
        ====================================================== */

        normalMusic.volume = 0.40;

        bigShotMusic.volume = 0.40;

        pipisSound.volume = 0.70;


        /* =====================================================
           ESTADO DE MÚSICA
        ====================================================== */

        let currentMusic = null;

        let bigShotMode = false;


        /* =====================================================
           COMPROBAR LOGRO
        ====================================================== */

        if (
            localStorage.getItem(
                "spamtonBigShotAchievement"
            ) === "true"
        ) {

            achievementButton.style.display =
                "block";

            secretRoomButton.style.display =
                "none";

        }


        /* =====================================================
           ACTUALIZAR BOTÓN DE MÚSICA
        ====================================================== */

        function updateMusicButton() {


            if (bigShotMode) {


                if (
                    currentMusic ===
                    bigShotMusic
                ) {

                    musicButton.textContent =
                        "[ TURN OFF THE BIG SHOT ]";

                }
                else {

                    musicButton.textContent =
                        "[ TURN ON THE BIG SHOT! ]";

                }

            }
            else {


                if (
                    currentMusic ===
                    normalMusic
                ) {

                    musicButton.textContent =
                        "[ TURN OFF THE MUSIC ]";

                }
                else {

                    musicButton.textContent =
                        "[ TURN ON THE MUSIC ]";

                }

            }

        }


        /* =====================================================
           DETENER MÚSICA
        ====================================================== */

        function stopMusic() {


            normalMusic.pause();

            bigShotMusic.pause();

            currentMusic = null;

            updateMusicButton();

        }


        /* =====================================================
           MÚSICA NORMAL
        ====================================================== */

        function startNormalMusic() {


            bigShotMusic.pause();

            normalMusic.volume = 0.40;


            normalMusic.play()
                .then(function () {


                    currentMusic =
                        normalMusic;


                    updateMusicButton();


                    console.log(
                        "Música normal reproduciéndose."
                    );


                })
                .catch(function (error) {


                    console.error(
                        "Error música normal:",
                        error
                    );


                    alert(
                        "No se pudo reproducir want-to-be-a.mp3"
                    );

                });

        }


        /* =====================================================
           BIG SHOT
        ====================================================== */

        function startBigShotMusic() {


            normalMusic.pause();


            bigShotMusic.pause();

            bigShotMusic.currentTime = 0;

            bigShotMusic.volume = 0.40;


            bigShotMusic.play()
                .then(function () {


                    currentMusic =
                        bigShotMusic;


                    updateMusicButton();


                    console.log(
                        "BIG SHOT reproduciéndose."
                    );


                })
                .catch(function (error) {


                    console.error(
                        "Error Big Shot:",
                        error
                    );


                    alert(
                        "No se pudo reproducir big-shot.mp3"
                    );

                });

        }


        /* =====================================================
           BOTÓN DE MÚSICA
        ====================================================== */

        musicButton.addEventListener(
            "click",
            function (event) {


                event.preventDefault();

                event.stopPropagation();


                /* ===============================
                   APAGAR
                =============================== */

                if (
                    currentMusic !== null
                ) {

                    stopMusic();

                    return;

                }


                /* ===============================
                   BIG SHOT
                =============================== */

                if (bigShotMode) {

                    startBigShotMusic();

                }


                /* ===============================
                   MÚSICA NORMAL
                =============================== */

                else {

                    startNormalMusic();

                }

            }
        );


        /* =====================================================
           FUNCIÓN GATO SAGRADO
        ====================================================== */

        function showSacredCat() {


            /*
             * Mostrar el gato
             */

            sacredCatEvent.classList.add(
                "sacred-cat-visible"
            );


            /*
             * Efecto especial en el cuerpo
             */

            document.body.classList.add(
                "sacred-cat-glitch"
            );


            /*
             * Después de 5 segundos
             */

            setTimeout(
                function () {


                    sacredCatEvent.classList.remove(
                        "sacred-cat-visible"
                    );


                    document.body.classList.remove(
                        "sacred-cat-glitch"
                    );


                },
                5000
            );

        }


        /* =====================================================
           BOTÓN PIPIS
        ====================================================== */

        pipisButton.addEventListener(
            "click",
            function (event) {


                event.preventDefault();

                event.stopPropagation();


                /* =================================================
                   SONIDO PIPIS
                ================================================= */

                pipisSound.currentTime = 0;


                pipisSound.play()
                    .catch(function (error) {


                        console.error(
                            "Error Pipis:",
                            error
                        );


                    });


                /* =================================================
                   CREAR PIPIS
                ================================================= */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {


                    const pipis =
                        document.createElement(
                            "img"
                        );


                    pipis.src =
                        "pipis.gif";


                    pipis.className =
                        "pipis-rain";


                    /* POSICIÓN */

                    pipis.style.left =
                        Math.random() *
                        100 +
                        "vw";


                    /* TAMAÑO */

                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;


                    pipis.style.width =
                        size +
                        "px";


                    /* VELOCIDAD */

                    const speed =
                        Math.random() * 2 +
                        2;


                    pipis.style.animationDuration =
                        speed +
                        "s";


                    /* RETRASO */

                    pipis.style.animationDelay =
                        Math.random() *
                        0.5 +
                        "s";


                    pipisRain.appendChild(
                        pipis
                    );


                    /* ELIMINAR */

                    setTimeout(
                        function () {


                            if (
                                pipis.parentNode
                            ) {

                                pipis.remove();

                            }


                        },
                        5500
                    );

                }


                /* =================================================
                   GATO SAGRADO

                   3% DE PROBABILIDAD
                ================================================= */

                const randomChance =
                    Math.random();


                if (
                    randomChance < 0.03
                ) {


                    console.log(
                        "¡¡¡ GATO SAGRADO ENCONTRADO !!!"
                    );


                    showSacredCat();

                }

            }
        );


        /* =====================================================
           TROFEO BIG SHOT
        ====================================================== */

        achievementButton.addEventListener(
            "click",
            function (event) {


                event.preventDefault();

                event.stopPropagation();


                /* CAMBIAR ESTADO */

                bigShotMode =
                    !bigShotMode;


                /* =================================================
                   ACTIVAR
                ================================================= */

                if (bigShotMode) {


                    document.body.classList.add(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-neo.gif";


                    /*
                     * Si estaba sonando música normal
                     */

                    if (
                        currentMusic ===
                        normalMusic
                    ) {


                        stopMusic();

                        startBigShotMusic();

                    }
                    else {


                        updateMusicButton();

                    }

                }


                /* =================================================
                   DESACTIVAR
                ================================================= */

                else {


                    document.body.classList.remove(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-idle.gif";


                    /*
                     * Si estaba sonando Big Shot
                     */

                    if (
                        currentMusic ===
                        bigShotMusic
                    ) {


                        stopMusic();

                        startNormalMusic();

                    }
                    else {


                        updateMusicButton();

                    }

                }

            }
        );


        /* =====================================================
           ESTADO INICIAL
        ====================================================== */

        updateMusicButton();


    </script>


</body>

</html>
