<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         BOTON SECRET PIPIS
    ====================================================== -->

    <a
        href="secret-pipis.html"
        id="secretRoomButton"
    >
        [ SECRET PIPIS ]
    </a>


    <!-- =====================================================
         TROFEOS
    ====================================================== -->

    <div id="achievements">


        <!-- BIG SHOT -->

        <button
            id="achievementButton"
            class="achievement"
            title="Big Shot!"
        >
            🏆
        </button>


        <!-- GATO SAGRADO -->

        <button
            id="catAchievementButton"
            class="achievement"
            title="Gato Sagrado"
        >
            🐱
        </button>


    </div>


    <!-- =====================================================
         TITULO
    ====================================================== -->

    <h1 id="mainTitle">
        HEY EVERY !!
    </h1>


    <!-- =====================================================
         SPAMTON PRINCIPAL
    ====================================================== -->

    <img
        src="spamton-idle.gif"
        alt="Spamton"
        id="mainSpamton"
        class="main-spamton"
    >


    <!-- =====================================================
         BOTON PIPIS
    ====================================================== -->

    <button
        id="pipisButton"
        type="button"
    >
        [ PIPIS ]
    </button>


    <!-- =====================================================
         SONIDO PIPIS
    ====================================================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         MUSICA NORMAL
    ====================================================== -->

    <audio
        id="normalMusic"
        src="want-to-be-a.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         MUSICA BIG SHOT
    ====================================================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         CAJA DE MUSICA
    ====================================================== -->

    <div id="musicBox">

        <img
            src="spamton-dancing.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button
            id="musicButton"
            type="button"
        >
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =====================================================
         SUSIE
    ====================================================== -->

    <div id="susieGlitch">

        <div class="susie-caption">

            <span class="susie-arrow">
                ↘
            </span>

            SUSIE COMIENDO PANCAKES

        </div>


        <div class="glitch-scribbles">

            /// !!! ///

            <br>

            PANCAKES???

            <br>

            !! ?? ##

        </div>


        <img
            src="susie-eating-pancakes.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >


        <div class="susie-name">
            S U S I E
        </div>

    </div>


    <!-- =====================================================
         LLUVIA DE PIPIS
    ====================================================== -->

    <div id="pipisRain"></div>


    <!-- =====================================================
         GATO SAGRADO
    ====================================================== -->

    <div
        id="sacredCatEvent"
        aria-hidden="true"
    >

        <div id="sacredCatGlitch">

            /// [[ SPECIAL DEAL ]] ///

            <br>

            !!! [[ GATO ]] !!!

        </div>


        <div id="sacredCatText">

            HAZ ENCONTRADO AL

            <br>

            [[ GATO ]]

            <br>

            SAGRADO DE SUSIE!!

        </div>


        <img
            src="gato-sagrado.jpg"
            alt="Gato Sagrado de Susie"
            id="sacredCat"
        >

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const pipisButton =
            document.getElementById(
                "pipisButton"
            );


        const pipisSound =
            document.getElementById(
                "pipisSound"
            );


        const pipisRain =
            document.getElementById(
                "pipisRain"
            );


        const normalMusic =
            document.getElementById(
                "normalMusic"
            );


        const bigShotMusic =
            document.getElementById(
                "bigShotMusic"
            );


        const musicButton =
            document.getElementById(
                "musicButton"
            );


        const mainSpamton =
            document.getElementById(
                "mainSpamton"
            );


        const achievementButton =
            document.getElementById(
                "achievementButton"
            );


        const catAchievementButton =
            document.getElementById(
                "catAchievementButton"
            );


        const sacredCatEvent =
            document.getElementById(
                "sacredCatEvent"
            );


        const secretRoomButton =
            document.getElementById(
                "secretRoomButton"
            );


        /* =====================================================
           VOLUMEN
        ===================================================== */

        normalMusic.volume = 0.40;

        bigShotMusic.volume = 0.40;

        pipisSound.volume = 0.70;


        /* =====================================================
           ESTADO
        ===================================================== */

        let currentMusic = null;

        let bigShotMode = false;


        /* =====================================================
           LOGROS GUARDADOS
        ===================================================== */

        const bigShotUnlocked =
            localStorage.getItem(
                "spamtonBigShotAchievement"
            ) === "true";


        const catUnlocked =
            localStorage.getItem(
                "spamtonSacredCatAchievement"
            ) === "true";


        /* =====================================================
           MOSTRAR TROFEOS
        ===================================================== */

        if (bigShotUnlocked) {

            achievementButton.style.display =
                "block";

            secretRoomButton.style.display =
                "none";

        }


        if (catUnlocked) {

            catAchievementButton.style.display =
                "block";

        }


        /* =====================================================
           ACTUALIZAR BOTON MUSICA
        ===================================================== */

        function updateMusicButton() {

            if (bigShotMode) {

                if (
                    currentMusic ===
                    bigShotMusic
                ) {

                    musicButton.textContent =
                        "[ TURN OFF THE BIG SHOT ]";

                }
                else {

                    musicButton.textContent =
                        "[ TURN ON THE BIG SHOT! ]";

                }

            }
            else {

                if (
                    currentMusic ===
                    normalMusic
                ) {

                    musicButton.textContent =
                        "[ TURN OFF THE MUSIC ]";

                }
                else {

                    musicButton.textContent =
                        "[ TURN ON THE MUSIC ]";

                }

            }

        }


        /* =====================================================
           DETENER TODA LA MUSICA
        ====================================================== */

        function stopAllMusic() {

            normalMusic.pause();

            bigShotMusic.pause();

            currentMusic = null;

            updateMusicButton();

        }


        /* =====================================================
           MUSICA NORMAL
        ====================================================== */

        function playNormalMusic() {

            bigShotMusic.pause();

            normalMusic.volume = 0.40;

            normalMusic
                .play()
                .then(function () {

                    currentMusic =
                        normalMusic;

                    updateMusicButton();

                })
                .catch(function (error) {

                    console.error(
                        "No se pudo reproducir la música normal:",
                        error
                    );

                    currentMusic = null;

                    updateMusicButton();

                });

        }


        /* =====================================================
           MUSICA BIG SHOT
        ====================================================== */

        function playBigShotMusic() {

            normalMusic.pause();

            bigShotMusic.volume = 0.40;

            bigShotMusic
                .play()
                .then(function () {

                    currentMusic =
                        bigShotMusic;

                    updateMusicButton();

                })
                .catch(function (error) {

                    console.error(
                        "No se pudo reproducir BIG SHOT:",
                        error
                    );

                    currentMusic = null;

                    updateMusicButton();

                });

        }


        /* =====================================================
           BOTON MUSICA
        ====================================================== */

        musicButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                /* =============================================
                   SI ESTA SONANDO
                ============================================= */

                if (
                    currentMusic !== null
                ) {

                    stopAllMusic();

                    return;

                }


                /* =============================================
                   SI ESTA APAGADA
                ============================================= */

                if (bigShotMode) {

                    playBigShotMusic();

                }
                else {

                    playNormalMusic();

                }

            }
        );


        /* =====================================================
           BOTON PIPIS
        ====================================================== */

        pipisButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                /* =============================================
                   SONIDO PIPIS
                ============================================= */

                pipisSound.currentTime = 0;

                pipisSound
                    .play()
                    .catch(function (error) {

                        console.error(
                            "Error al reproducir Pipis:",
                            error
                        );

                    });


                /* =============================================
                   CREAR PIPIS
                ============================================= */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {

                    const pipis =
                        document.createElement(
                            "img"
                        );


                    pipis.src =
                        "pipis.gif";


                    pipis.className =
                        "pipis-rain";


                    pipis.style.left =
                        (
                            Math.random() *
                            100
                        ) + "vw";


                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;


                    pipis.style.width =
                        size + "px";


                    const speed =
                        Math.random() * 2 + 2;


                    pipis.style.animationDuration =
                        speed + "s";


                    pipis.style.animationDelay =
                        (
                            Math.random() * 0.5
                        ) + "s";


                    pipisRain.appendChild(
                        pipis
                    );


                    setTimeout(
                        function () {

                            if (
                                pipis.parentNode
                            ) {

                                pipis.remove();

                            }

                        },
                        5500
                    );

                }


                /* =============================================
                   PROBABILIDAD GATO

                   3%
                ============================================= */

                const randomNumber =
                    Math.random();


                if (
                    randomNumber < 0.03
                ) {

                    unlockSacredCat();

                }

            }
        );


        /* =====================================================
           GATO SAGRADO
        ====================================================== */

        function unlockSacredCat() {


            /* =============================================
               GUARDAR LOGRO
            ============================================= */

            localStorage.setItem(
                "spamtonSacredCatAchievement",
                "true"
            );


            /* =============================================
               MOSTRAR TROFEO
            ============================================= */

            catAchievementButton.style.display =
                "block";


            /* =============================================
               MOSTRAR EVENTO
            ============================================= */

            sacredCatEvent.classList.add(
                "show"
            );


            sacredCatEvent.setAttribute(
                "aria-hidden",
                "false"
            );


            document.body.classList.add(
                "cat-glitch"
            );


            /* =============================================
               OCULTAR DESPUES DE 5 SEGUNDOS
            ============================================= */

            setTimeout(
                function () {

                    sacredCatEvent.classList.remove(
                        "show"
                    );


                    document.body.classList.remove(
                        "cat-glitch"
                    );


                    sacredCatEvent.setAttribute(
                        "aria-hidden",
                        "true"
                    );

                },
                5000
            );

        }


        /* =====================================================
           BIG SHOT
        ====================================================== */

        achievementButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                bigShotMode =
                    !bigShotMode;


                /* =============================================
                   ACTIVAR BIG SHOT
                ============================================= */

                if (bigShotMode) {

                    document.body.classList.add(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-neo.gif";


                    /*
                     * Si estaba sonando música normal,
                     * cambiar inmediatamente a Big Shot.
                     */

                    if (
                        currentMusic ===
                        normalMusic
                    ) {

                        normalMusic.pause();

                        currentMusic =
                            null;

                        playBigShotMusic();

                    }
                    else {

                        updateMusicButton();

                    }

                }


                /* =============================================
                   VOLVER A NORMAL
                ============================================= */

                else {

                    document.body.classList.remove(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-idle.gif";


                    /*
                     * Si estaba sonando Big Shot,
                     * volver a la música normal.
                     */

                    if (
                        currentMusic ===
                        bigShotMusic
                    ) {

                        bigShotMusic.pause();

                        currentMusic =
                            null;

                        playNormalMusic();

                    }
                    else {

                        updateMusicButton();

                    }

                }

            }
        );


        /* =====================================================
           TROFEO GATO
        ====================================================== */

        catAchievementButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                /*
                 * Al tocar el trofeo mostramos
                 * nuevamente el mensaje del gato.
                 */

                unlockSacredCat();

            }
        );


        /* =====================================================
           ESTADO INICIAL
        ====================================================== */

        updateMusicButton();


    </script>


</body>

</html>
