<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spamton Shop</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =====================================================
         TITULO
    ====================================================== -->

    <h1 id="mainTitle">
        HEY EVERY !!
    </h1>


    <!-- =====================================================
         BOTON FRIEND DESTROYER
    ====================================================== -->

    <a
        href="friend-destroyer.html"
        id="friendDestroyerButton"
    >
        [ FRIEND DESTROYER ]
    </a>


    <!-- =====================================================
         SALA SECRETA
         NO SE MODIFICA
    ====================================================== -->

    <a
        href="secret-pipis.html"
        id="secretRoomButton"
    >
        [ SECRET PIPIS ]
    </a>


    <!-- =====================================================
         LOGROS
    ====================================================== -->

    <div id="achievements">

        <button
            id="achievementBerdly"
            class="achievement"
            type="button"
            title="Berdly - 100 Kills"
        >
            🐦
        </button>


        <button
            id="achievementSusie"
            class="achievement"
            type="button"
            title="Susie - 1000 Kills"
        >
            🥞
        </button>


        <a
            href="noelle.html"
            id="achievementNoelle"
            class="achievement"
            title="Noelle - 10000 Kills"
        >
            ❄️
        </a>


        <button
            id="achievementBigShot"
            class="achievement"
            type="button"
            title="BIG SHOT"
        >
            🏆
        </button>


        <button
            id="achievementCat"
            class="achievement"
            type="button"
            title="Gato Sagrado de Susie"
        >
            🐱
        </button>

    </div>


    <!-- =====================================================
         SPAMTON
    ====================================================== -->

    <img
        src="spamton-idle.gif"
        alt="Spamton"
        id="mainSpamton"
        class="main-spamton"
    >


    <!-- =====================================================
         PIPIS
    ====================================================== -->

    <button
        id="pipisButton"
        type="button"
    >
        [ PIPIS ]
    </button>


    <audio
        id="pipisSound"
        src="pipis.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         MUSICA NORMAL
    ====================================================== -->

    <audio
        id="normalMusic"
        src="want-to-be-a.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         BIG SHOT
    ====================================================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         CONTROL DE MUSICA
    ====================================================== -->

    <div id="musicBox">

        <img
            src="spamton-dancing.gif"
            id="dancingSpamton"
            alt="Spamton bailando"
        >

        <button
            id="musicButton"
            type="button"
        >
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =====================================================
         SUSIE
    ====================================================== -->

    <div id="susieGlitch">

        <div class="susie-caption">
            <span class="susie-arrow">↘</span>
            SUSIE COMIENDO PANCAKES
        </div>

        <div class="glitch-scribbles">
            /// !!! ///
            <br>
            PANCAKES???
            <br>
            !! ?? ##
        </div>

        <img
            src="susie-eating-pancakes.gif"
            id="susieGif"
            alt="Susie"
        >

        <div class="susie-name">
            S U S I E
        </div>

    </div>


    <!-- =====================================================
         LLUVIA
    ====================================================== -->

    <div id="pipisRain"></div>


    <!-- =====================================================
         MENSAJE GATO
    ====================================================== -->

    <div id="catDiscovery">

        <div class="catDiscoveryGlitch">
            [[ !! SPECIAL DEAL !! ]]
        </div>

        <div class="catDiscoveryText">

            HAS ENCONTRADO AL
            <br>
            [[ GATO ]]
            <br>
            SAGRADO DE SUSIE!!

        </div>

        <img
            src="gato.png"
            id="catDiscoveryImage"
            alt="Gato"
        >

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const pipisButton =
                document.getElementById(
                    "pipisButton"
                );

            const pipisSound =
                document.getElementById(
                    "pipisSound"
                );

            const pipisRain =
                document.getElementById(
                    "pipisRain"
                );

            const normalMusic =
                document.getElementById(
                    "normalMusic"
                );

            const bigShotMusic =
                document.getElementById(
                    "bigShotMusic"
                );

            const musicButton =
                document.getElementById(
                    "musicButton"
                );

            const mainSpamton =
                document.getElementById(
                    "mainSpamton"
                );

            const achievementBerdly =
                document.getElementById(
                    "achievementBerdly"
                );

            const achievementSusie =
                document.getElementById(
                    "achievementSusie"
                );

            const achievementNoelle =
                document.getElementById(
                    "achievementNoelle"
                );

            const achievementBigShot =
                document.getElementById(
                    "achievementBigShot"
                );

            const achievementCat =
                document.getElementById(
                    "achievementCat"
                );

            const catDiscovery =
                document.getElementById(
                    "catDiscovery"
                );


            /* =================================================
               VOLUMEN
            ================================================= */

            normalMusic.volume = 0.40;
            bigShotMusic.volume = 0.40;
            pipisSound.volume = 0.70;


            /* =================================================
               ESTADO MUSICA
            ================================================= */

            let musicIsPlaying = false;
            let bigShotMode = false;


            /* =================================================
               LOGROS
            ================================================= */

            const berdlyUnlocked =
                localStorage.getItem(
                    "friendAchievement100"
                ) === "true";


            const susieUnlocked =
                localStorage.getItem(
                    "friendAchievement1000"
                ) === "true";


            const noelleUnlocked =
                localStorage.getItem(
                    "friendAchievement10000"
                ) === "true";


            const bigShotUnlocked =
                localStorage.getItem(
                    "spamtonBigShotAchievement"
                ) === "true";


            const catUnlocked =
                localStorage.getItem(
                    "spamtonSacredCatAchievement"
                ) === "true";


            /* =================================================
               MOSTRAR LOGROS
            ================================================= */

            if (berdlyUnlocked) {

                achievementBerdly.style.display =
                    "flex";

            }


            if (susieUnlocked) {

                achievementSusie.style.display =
                    "flex";

            }


            if (noelleUnlocked) {

                achievementNoelle.style.display =
                    "flex";

            }


            if (bigShotUnlocked) {

                achievementBigShot.style.display =
                    "flex";

            }


            if (catUnlocked) {

                achievementCat.style.display =
                    "flex";

            }


            /* =================================================
               MUSICA
            ================================================= */

            function updateMusicButton() {

                if (bigShotMode) {

                    musicButton.textContent =
                        musicIsPlaying
                        ? "[ TURN OFF BIG SHOT ]"
                        : "[ TURN ON BIG SHOT ]";

                }

                else {

                    musicButton.textContent =
                        musicIsPlaying
                        ? "[ TURN OFF THE MUSIC ]"
                        : "[ TURN ON THE MUSIC ]";

                }

            }


            function stopAllMusic() {

                normalMusic.pause();
                bigShotMusic.pause();

                normalMusic.currentTime = 0;
                bigShotMusic.currentTime = 0;

                musicIsPlaying = false;

                musicButton.classList.remove(
                    "music-on"
                );

                updateMusicButton();

            }


            function playNormalMusic() {

                bigShotMusic.pause();
                bigShotMusic.currentTime = 0;

                normalMusic.volume = 0.40;

                const promise =
                    normalMusic.play();

                if (promise) {

                    promise.then(
                        function () {

                            musicIsPlaying =
                                true;

                            musicButton.classList.add(
                                "music-on"
                            );

                            updateMusicButton();

                        }
                    ).catch(
                        function () {

                            musicIsPlaying =
                                false;

                            updateMusicButton();

                        }
                    );

                }

            }


            function playBigShotMusic() {

                normalMusic.pause();
                normalMusic.currentTime = 0;

                bigShotMusic.volume = 0.40;

                const promise =
                    bigShotMusic.play();

                if (promise) {

                    promise.then(
                        function () {

                            musicIsPlaying =
                                true;

                            musicButton.classList.add(
                                "music-on"
                            );

                            updateMusicButton();

                        }
                    ).catch(
                        function () {

                            musicIsPlaying =
                                false;

                            updateMusicButton();

                        }
                    );

                }

            }


            /* =================================================
               BOTON MUSICA
            ================================================= */

            musicButton.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    if (musicIsPlaying) {

                        stopAllMusic();

                    }

                    else {

                        if (bigShotMode) {

                            playBigShotMusic();

                        }

                        else {

                            playNormalMusic();

                        }

                    }

                }
            );


            /* =================================================
               BIG SHOT
            ================================================= */

            achievementBigShot.addEventListener(
                "click",
                function () {

                    bigShotMode =
                        !bigShotMode;


                    if (bigShotMode) {

                        document.body.classList.add(
                            "big-shot-mode"
                        );


                        mainSpamton.src =
                            "spamton-neo.gif";


                        if (musicIsPlaying) {

                            stopAllMusic();

                            playBigShotMusic();

                        }

                    }

                    else {

                        document.body.classList.remove(
                            "big-shot-mode"
                        );


                        mainSpamton.src =
                            "spamton-idle.gif";


                        if (musicIsPlaying) {

                            stopAllMusic();

                            playNormalMusic();

                        }

                    }


                    updateMusicButton();

                }
            );


            /* =================================================
               PIPIS
            ================================================= */

            function createPipis() {

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {

                    const pipis =
                        document.createElement(
                            "img"
                        );

                    pipis.src =
                        "pipis.gif";

                    pipis.className =
                        "pipis-rain";

                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;

                    pipis.style.left =
                        Math.random() * 100 +
                        "vw";

                    pipis.style.width =
                        size + "px";

                    pipis.style.animationDuration =
                        Math.random() * 2 +
                        2 +
                        "s";

                    pipis.style.animationDelay =
                        Math.random() * 0.8 +
                        "s";

                    pipisRain.appendChild(
                        pipis
                    );


                    setTimeout(
                        function () {

                            pipis.remove();

                        },
                        6000
                    );

                }

            }


            pipisButton.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    pipisSound.currentTime = 0;

                    pipisSound.play()
                        .catch(
                            function () {}
                        );

                    createPipis();

                }
            );


            /* =================================================
               GATO
            ================================================= */

            function discoverCat() {

                localStorage.setItem(
                    "spamtonSacredCatAchievement",
                    "true"
                );

                achievementCat.style.display =
                    "flex";

                catDiscovery.classList.add(
                    "show"
                );


                setTimeout(
                    function () {

                        catDiscovery.classList.remove(
                            "show"
                        );

                    },
                    5000
                );


                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {

                    const cat =
                        document.createElement(
                            "img"
                        );

                    cat.src =
                        "gato.png";

                    cat.className =
                        "cat-rain";

                    cat.style.left =
                        Math.random() * 100 +
                        "vw";

                    cat.style.width =
                        Math.random() * 55 +
                        45 +
                        "px";

                    cat.style.animationDuration =
                        Math.random() * 2 +
                        2 +
                        "s";

                    pipisRain.appendChild(
                        cat
                    );


                    setTimeout(
                        function () {

                            cat.remove();

                        },
                        6000
                    );

                }

            }


            pipisButton.addEventListener(
                "dblclick",
                function () {

                    if (!catUnlocked) {

                        discoverCat();

                    }

                }
            );


            /* =================================================
               CODIGO DEL CREADOR
               
               1 2 2 5
            ================================================= */

            let creatorCode = "";


            document.addEventListener(
                "keydown",
                function (event) {

                    if (
                        /^[0-9]$/.test(
                            event.key
                        )
                    ) {

                        creatorCode +=
                            event.key;

                        if (
                            creatorCode.length > 4
                        ) {

                            creatorCode =
                                creatorCode.slice(
                                    -4
                                );

                        }


                        if (
                            creatorCode === "1225"
                        ) {

                            localStorage.setItem(
                                "friendAchievement100",
                                "true"
                            );

                            localStorage.setItem(
                                "friendAchievement1000",
                                "true"
                            );

                            localStorage.setItem(
                                "friendAchievement10000",
                                "true"
                            );

                            achievementBerdly.style.display =
                                "flex";

                            achievementSusie.style.display =
                                "flex";

                            achievementNoelle.style.display =
                                "flex";

                            creatorCode = "";

                            alert(
                                "NOELLE HOLIDAY DESBLOQUEADA."
                            );

                        }

                    }

                }
            );


            /* =================================================
               ESTADO INICIAL
            ================================================= */

            updateMusicButton();

        }

    );

    </script>

</body>

</html>
