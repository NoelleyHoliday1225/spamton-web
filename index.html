<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         SALA SECRETA
    ====================================================== -->

    <a
        href="secret-pipis.html"
        id="secretRoomButton"
    >
        [ SECRET PIPIS ]
    </a>


    <!-- =====================================================
         TROFEO BIG SHOT
    ====================================================== -->

    <button
        id="achievementButton"
        type="button"
        title="Big Shot!"
        style="display: none;"
    >
        🏆
    </button>


    <!-- =====================================================
         TITULO
    ====================================================== -->

    <h1>
        HEY EVERY !!
    </h1>


    <!-- =====================================================
         SPAMTON PRINCIPAL
    ====================================================== -->

    <img
        src="spamton-idle.gif"
        alt="Spamton"
        id="mainSpamton"
        class="main-spamton"
    >


    <!-- =====================================================
         BOTON PIPIS
    ====================================================== -->

    <button
        id="pipisButton"
        type="button"
    >
        [ PIPIS ]
    </button>


    <!-- =====================================================
         SONIDO PIPIS
    ====================================================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         MUSICA NORMAL
    ====================================================== -->

    <audio
        id="normalMusic"
        src="want-to-be-a.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         MUSICA BIG SHOT
    ====================================================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         CAJA DE MUSICA
    ====================================================== -->

    <div id="musicBox">

        <img
            src="spamton-dancing.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button
            id="musicButton"
            type="button"
        >
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =====================================================
         SUSIE
    ====================================================== -->

    <div id="susieGlitch">

        <div class="susie-caption">

            <span class="susie-arrow">
                ↘
            </span>

            SUSIE COMIENDO PANCAKES

        </div>


        <div class="glitch-scribbles">

            /// !!! ///

            <br>

            PANCAKES???

            <br>

            !! ?? ##

        </div>


        <img
            src="susie-eating-pancakes.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >


        <div class="susie-name">

            S U S I E

        </div>

    </div>


    <!-- =====================================================
         LLUVIA DE PIPIS
    ====================================================== -->

    <div id="pipisRain"></div>


    <!-- =====================================================
         GATO SAGRADO
         
         IMPORTANTE:
         ESTÁ OCULTO DESDE HTML.
         NO APARECERÁ AL CARGAR LA PÁGINA.
    ====================================================== -->

    <div
        id="sacredCatEvent"
        style="display: none;"
    >

        <div id="sacredCatGlitch">

            /// [[ SPECIAL DEAL ]] ///

            <br>

            !!! !!! !!!

        </div>


        <div id="sacredCatText">

            HAZ ENCONTRADO AL

            <br>

            [[ GATO ]]

            <br>

            SAGRADO DE SUSIE!!

        </div>


        <img
            src="gato-sagrado.jpg"
            alt="Gato Sagrado de Susie"
            id="sacredCat"
        >

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const pipisButton =
            document.getElementById("pipisButton");


        const pipisSound =
            document.getElementById("pipisSound");


        const pipisRain =
            document.getElementById("pipisRain");


        const normalMusic =
            document.getElementById("normalMusic");


        const bigShotMusic =
            document.getElementById("bigShotMusic");


        const musicButton =
            document.getElementById("musicButton");


        const mainSpamton =
            document.getElementById("mainSpamton");


        const achievementButton =
            document.getElementById("achievementButton");


        const secretRoomButton =
            document.getElementById("secretRoomButton");


        const sacredCatEvent =
            document.getElementById("sacredCatEvent");


        /* =====================================================
           VOLUMEN
        ===================================================== */

        normalMusic.volume = 0.40;

        bigShotMusic.volume = 0.40;

        pipisSound.volume = 0.70;


        /* =====================================================
           ESTADO DE MUSICA
        ===================================================== */

        let currentMusic = null;

        let bigShotMode = false;


        /* =====================================================
           COMPROBAR LOGRO
        ===================================================== */

        if (
            localStorage.getItem(
                "spamtonBigShotAchievement"
            ) === "true"
        ) {

            achievementButton.style.display =
                "block";

            secretRoomButton.style.display =
                "none";

        }


        /* =====================================================
           BOTON DE MUSICA
        ===================================================== */

        function updateMusicButton() {

            if (bigShotMode) {

                if (
                    currentMusic ===
                    bigShotMusic
                ) {

                    musicButton.textContent =
                        "[ TURN OFF THE BIG SHOT ]";

                }
                else {

                    musicButton.textContent =
                        "[ TURN ON THE BIG SHOT! ]";

                }

            }
            else {

                if (
                    currentMusic ===
                    normalMusic
                ) {

                    musicButton.textContent =
                        "[ TURN OFF THE MUSIC ]";

                }
                else {

                    musicButton.textContent =
                        "[ TURN ON THE MUSIC ]";

                }

            }

        }


        /* =====================================================
           DETENER MUSICA
        ===================================================== */

        function stopMusic() {

            normalMusic.pause();

            bigShotMusic.pause();

            currentMusic = null;

            updateMusicButton();

        }


        /* =====================================================
           MUSICA NORMAL
        ===================================================== */

        function startNormalMusic() {

            bigShotMusic.pause();

            normalMusic.volume = 0.40;

            normalMusic.play()
                .then(function () {

                    currentMusic =
                        normalMusic;

                    updateMusicButton();

                })
                .catch(function (error) {

                    console.error(
                        "Error música normal:",
                        error
                    );

                });

        }


        /* =====================================================
           BIG SHOT
        ===================================================== */

        function startBigShotMusic() {

            normalMusic.pause();

            bigShotMusic.pause();

            bigShotMusic.currentTime = 0;

            bigShotMusic.volume = 0.40;

            bigShotMusic.play()
                .then(function () {

                    currentMusic =
                        bigShotMusic;

                    updateMusicButton();

                })
                .catch(function (error) {

                    console.error(
                        "Error Big Shot:",
                        error
                    );

                });

        }


        /* =====================================================
           BOTON DE MUSICA
        ===================================================== */

        musicButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                if (
                    currentMusic !== null
                ) {

                    stopMusic();

                    return;

                }


                if (bigShotMode) {

                    startBigShotMusic();

                }
                else {

                    startNormalMusic();

                }

            }
        );


        /* =====================================================
           MOSTRAR GATO SAGRADO
        ===================================================== */

        function showSacredCat() {

            /*
             * Mostrar
             */

            sacredCatEvent.style.display =
                "flex";


            /*
             * Activar animación
             */

            setTimeout(
                function () {

                    sacredCatEvent.classList.add(
                        "sacred-cat-visible"
                    );

                },
                20
            );


            /*
             * Glitch de pantalla
             */

            document.body.classList.add(
                "sacred-cat-glitch"
            );


            /*
             * Ocultar después de 5 segundos
             */

            setTimeout(
                function () {

                    sacredCatEvent.classList.remove(
                        "sacred-cat-visible"
                    );

                    document.body.classList.remove(
                        "sacred-cat-glitch"
                    );


                    setTimeout(
                        function () {

                            sacredCatEvent.style.display =
                                "none";

                        },
                        200
                    );


                },
                5000
            );

        }


        /* =====================================================
           BOTON PIPIS
        ===================================================== */

        pipisButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                /* =========================================
                   SONIDO
                ========================================= */

                pipisSound.currentTime = 0;

                pipisSound.play()
                    .catch(function (error) {

                        console.error(
                            "Error Pipis:",
                            error
                        );

                    });


                /* =========================================
                   CREAR PIPIS
                ========================================= */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {

                    const pipis =
                        document.createElement(
                            "img"
                        );


                    pipis.src =
                        "pipis.gif";


                    pipis.className =
                        "pipis-rain";


                    pipis.style.left =
                        Math.random() *
                        100 +
                        "vw";


                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;


                    pipis.style.width =
                        size +
                        "px";


                    const speed =
                        Math.random() * 2 +
                        2;


                    pipis.style.animationDuration =
                        speed +
                        "s";


                    pipis.style.animationDelay =
                        Math.random() *
                        0.5 +
                        "s";


                    pipisRain.appendChild(
                        pipis
                    );


                    setTimeout(
                        function () {

                            if (
                                pipis.parentNode
                            ) {

                                pipis.remove();

                            }

                        },
                        5500
                    );

                }


                /* =========================================
                   GATO SAGRADO
                   
                   3% DE PROBABILIDAD
                ========================================= */

                const chance =
                    Math.random();


                if (
                    chance < 0.03
                ) {

                    showSacredCat();

                }

            }
        );


        /* =====================================================
           TROFEO BIG SHOT
        ===================================================== */

        achievementButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                bigShotMode =
                    !bigShotMode;


                /* =========================================
                   ACTIVAR
                ========================================= */

                if (bigShotMode) {

                    document.body.classList.add(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-neo.gif";


                    if (
                        currentMusic ===
                        normalMusic
                    ) {

                        stopMusic();

                        startBigShotMusic();

                    }
                    else {

                        updateMusicButton();

                    }

                }


                /* =========================================
                   DESACTIVAR
                ========================================= */

                else {

                    document.body.classList.remove(
                        "big-shot-mode"
                    );


                    mainSpamton.src =
                        "spamton-idle.gif";


                    if (
                        currentMusic ===
                        bigShotMusic
                    ) {

                        stopMusic();

                        startNormalMusic();

                    }
                    else {

                        updateMusicButton();

                    }

                }

            }
        );


        /* =====================================================
           INICIO
        ===================================================== */

        updateMusicButton();


    </script>


</body>

</html>
