<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>HEY EVERY !!</h1>


    <!-- SPAMTON PRINCIPAL -->

    <img
        src="spamton.gif"
        alt="Spamton"
        class="gif-spamton"
    >


    <!-- BOTÓN PIPIS -->

    <button id="pipisButton">
        [ PIPIS ]
    </button>


    <!-- SONIDO DE PIPIS -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
    ></audio>


    <!-- MÚSICA DE FONDO -->

    <audio
        id="backgroundMusic"
        src="want-to-be-a.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- SPAMTON BAILANDO + BOTÓN DE MÚSICA -->

    <div id="musicBox">

        <img
            src="spamton-bailando.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button id="musicButton">
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- CONTENEDOR DE LA LLUVIA -->

    <div id="pipisRain"></div>


    <script>

    /* =========================
       ELEMENTOS
    ========================= */

    const pipisButton =
        document.getElementById("pipisButton");

    const pipisSound =
        document.getElementById("pipisSound");

    const pipisRain =
        document.getElementById("pipisRain");

    const backgroundMusic =
        document.getElementById("backgroundMusic");

    const musicButton =
        document.getElementById("musicButton");

    const musicBox =
        document.getElementById("musicBox");


    /* =========================
       VOLUMEN DE LA MÚSICA
       40%
    ========================= */

    backgroundMusic.volume = 0.4;


    /* =========================
       BOTÓN TURN ON THE MUSIC
    ========================= */

    musicButton.addEventListener(
        "click",
        function () {

            backgroundMusic.play()
                .then(function () {

                    musicBox.classList.add(
                        "musicStarted"
                    );

                })
                .catch(function (error) {

                    console.log(
                        "No se pudo reproducir la música:",
                        error
                    );

                });

        }
    );


    /* =========================
       BOTÓN PIPIS
       
       IMPORTANTE:
       Este botón NO toca
       la música de fondo.
    ========================= */

    pipisButton.addEventListener(
        "click",
        function () {


            /* =========================
               SONIDO DE PIPIS
            ========================= */

            pipisSound.currentTime = 0;

            pipisSound.play();


            /* =========================
               CREAR 25 PIPIS
            ========================= */

            for (
                let i = 0;
                i < 25;
                i++
            ) {


                const pipis =
                    document.createElement("img");


                pipis.src =
                    "pipis.gif";


                pipis.className =
                    "pipis-rain";


                /* =========================
                   POSICIÓN ALEATORIA
                ========================= */

                pipis.style.left =
                    Math.random() * 100 + "vw";


                /* =========================
                   TAMAÑO ALEATORIO
                ========================= */

                const size =
                    Math.floor(
                        Math.random() * 60
                    ) + 40;


                pipis.style.width =
                    size + "px";


                /* =========================
                   VELOCIDAD ALEATORIA
                ========================= */

                const speed =
                    Math.random() * 2 + 2;


                pipis.style.animationDuration =
                    speed + "s";


                /* =========================
                   RETRASO ALEATORIO
                ========================= */

                pipis.style.animationDelay =
                    Math.random() * 0.5 + "s";


                /* =========================
                   AGREGAR PIPIS
                ========================= */

                pipisRain.appendChild(
                    pipis
                );


                /* =========================
                   ELIMINAR DESPUÉS DE CAER
                ========================= */

                setTimeout(
                    function () {

                        pipis.remove();

                    },
                    5000
                );

            }

        }
    );

</script>


</body>

</html>
