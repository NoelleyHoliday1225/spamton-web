<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>HEY EVERY !!</h1>

    <!-- SPAMTON -->
    <img src="spamton.gif" alt="Spamton" class="gif-spamton">

    <!-- BOTÓN PIPIS -->
    <button id="pipisButton">[ PIPIS ]</button>

    <!-- SONIDO -->
    <audio id="pipisSound" src="pipis.mp3"></audio>
    <audio id="backgroundMusic" src="want-to-be-a.mp3" loop></audio>

    <!-- CONTENEDOR DE LA LLUVIA -->
    <div id="pipisRain"></div>


    <script>

    const pipisButton = document.getElementById("pipisButton");
    const pipisSound = document.getElementById("pipisSound");
    const pipisRain = document.getElementById("pipisRain");

    // MÚSICA DE FONDO
    const backgroundMusic = document.getElementById("backgroundMusic");

    // Volumen al 40%
    backgroundMusic.volume = 0.4;


    pipisButton.addEventListener("click", function () {

        // Reproducir música de fondo
        backgroundMusic.play();

        // Reproducir sonido de Pipis
        pipisSound.currentTime = 0;
        pipisSound.play();


        // Crear 25 Pipis
        for (let i = 0; i < 25; i++) {

            const pipis = document.createElement("img");

            pipis.src = "pipis.gif";

            pipis.className = "pipis-rain";


            // Posición horizontal aleatoria
            pipis.style.left = Math.random() * 100 + "vw";


            // Tamaño aleatorio
            const size = Math.floor(Math.random() * 60) + 40;

            pipis.style.width = size + "px";


            // Velocidad aleatoria
            const speed = Math.random() * 2 + 2;

            pipis.style.animationDuration = speed + "s";


            // Rotación aleatoria
            pipis.style.animationDelay =
                Math.random() * 0.5 + "s";


            pipisRain.appendChild(pipis);


            // Eliminar después de caer
            setTimeout(function () {

                pipis.remove();

            }, 5000);

        }

    });

</script>
