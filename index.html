<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =====================================================
         BOTÓN SALA SECRETA
    ====================================================== -->

    <a
        href="secret-pipis.html"
        id="secretRoomButton"
    >
        [ SECRET PIPIS ]
    </a>


    <!-- =====================================================
         TROFEO BIG SHOT
    ====================================================== -->

    <button
        id="achievementButton"
        type="button"
        title="Big Shot!"
        style="display: none;"
    >
        🏆
    </button>


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <h1>
        HEY EVERY !!
    </h1>


    <!-- =====================================================
         SPAMTON PRINCIPAL
    ====================================================== -->

    <img
        src="spamton-idle.gif"
        alt="Spamton"
        id="mainSpamton"
        class="main-spamton"
    >


    <!-- =====================================================
         BOTÓN PIPIS
    ====================================================== -->

    <button
        id="pipisButton"
        type="button"
    >
        [ PIPIS ]
    </button>


    <!-- =====================================================
         SONIDO PIPIS
    ====================================================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         MÚSICA NORMAL
    ====================================================== -->

    <audio
        id="normalMusic"
        src="want-to-be-a.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         MÚSICA BIG SHOT
    ====================================================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         CAJA DE MÚSICA
    ====================================================== -->

    <div id="musicBox">

        <img
            src="spamton-dancing.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button
            id="musicButton"
            type="button"
        >
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =====================================================
         SUSIE
    ====================================================== -->

    <div id="susieGlitch">

        <div class="susie-caption">

            <span class="susie-arrow">↘</span>

            SUSIE COMIENDO PANCAKES

        </div>


        <div class="glitch-scribbles">

            /// !!! ///

            <br>

            PANCAKES???

            <br>

            !! ?? ##

        </div>


        <img
            src="susie-eating-pancakes.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >


        <div class="susie-name">

            S U S I E

        </div>

    </div>


    <!-- =====================================================
         LLUVIA DE PIPIS
    ====================================================== -->

    <div id="pipisRain"></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            /* =================================================
               ELEMENTOS
            ================================================= */

            const pipisButton =
                document.getElementById("pipisButton");

            const pipisSound =
                document.getElementById("pipisSound");

            const pipisRain =
                document.getElementById("pipisRain");

            const normalMusic =
                document.getElementById("normalMusic");

            const bigShotMusic =
                document.getElementById("bigShotMusic");

            const musicButton =
                document.getElementById("musicButton");

            const mainSpamton =
                document.getElementById("mainSpamton");

            const achievementButton =
                document.getElementById(
                    "achievementButton"
                );

            const secretRoomButton =
                document.getElementById(
                    "secretRoomButton"
                );


            /* =================================================
               VOLUMEN
            ================================================= */

            normalMusic.volume = 0.40;

            bigShotMusic.volume = 0.40;

            pipisSound.volume = 0.70;


            /* =================================================
               ESTADO
            ================================================= */

            let musicIsPlaying = false;

            let bigShotMode = false;


            /* =================================================
               COMPROBAR LOGRO
            ================================================= */

            const achievementUnlocked =
                localStorage.getItem(
                    "spamtonBigShotAchievement"
                ) === "true";


            if (achievementUnlocked) {

                achievementButton.style.display =
                    "block";

                secretRoomButton.style.display =
                    "none";

            }


            /* =================================================
               ACTUALIZAR BOTÓN
            ================================================= */

            function updateMusicButton() {

                if (bigShotMode) {

                    if (musicIsPlaying) {

                        musicButton.textContent =
                            "[ TURN OFF THE BIG SHOT ]";

                    }
                    else {

                        musicButton.textContent =
                            "[ TURN ON THE BIG SHOT! ]";

                    }

                }
                else {

                    if (musicIsPlaying) {

                        musicButton.textContent =
                            "[ TURN OFF THE MUSIC ]";

                    }
                    else {

                        musicButton.textContent =
                            "[ TURN ON THE MUSIC ]";

                    }

                }

            }


            /* =================================================
               DETENER TODAS LAS MÚSICAS
            ================================================= */

            function stopAllMusic() {

                normalMusic.pause();

                bigShotMusic.pause();

                musicIsPlaying = false;

            }


            /* =================================================
               MÚSICA NORMAL
            ================================================= */

            function playNormalMusic() {

                /*
                 * Detener Big Shot completamente
                 */

                bigShotMusic.pause();

                bigShotMusic.currentTime = 0;


                /*
                 * Configurar volumen
                 */

                normalMusic.volume = 0.40;


                /*
                 * Reproducir
                 */

                const promise =
                    normalMusic.play();


                if (promise !== undefined) {

                    promise.then(
                        function () {

                            musicIsPlaying = true;

                            musicButton.classList.add(
                                "music-on"
                            );

                            updateMusicButton();

                        }
                    )
                    .catch(
                        function (error) {

                            console.error(
                                "Error música normal:",
                                error
                            );

                            musicIsPlaying = false;

                            updateMusicButton();

                        }
                    );

                }

            }


            /* =================================================
               BIG SHOT
            ================================================= */

            function playBigShotMusic() {

                /*
                 * Detener música normal
                 */

                normalMusic.pause();

                normalMusic.currentTime = 0;


                /*
                 * Detener Big Shot
                 * antes de reiniciarlo
                 */

                bigShotMusic.pause();

                bigShotMusic.currentTime = 0;


                /*
                 * Volumen
                 */

                bigShotMusic.volume = 0.40;


                /*
                 * Cargar nuevamente el audio
                 */

                bigShotMusic.load();


                /*
                 * Reproducir
                 */

                const promise =
                    bigShotMusic.play();


                if (promise !== undefined) {

                    promise.then(
                        function () {

                            console.log(
                                "BIG SHOT reproduciéndose"
                            );

                            musicIsPlaying = true;

                            musicButton.classList.add(
                                "music-on"
                            );

                            updateMusicButton();

                        }
                    )
                    .catch(
                        function (error) {

                            console.error(
                                "ERROR BIG SHOT:",
                                error
                            );

                            musicIsPlaying = false;

                            updateMusicButton();

                        }
                    );

                }

            }


            /* =================================================
               BOTÓN DE MÚSICA
            ================================================= */

            musicButton.addEventListener(
                "click",
                function (event) {

                    /*
                     * Evita que el clic
                     * afecte otras cosas
                     */

                    event.stopPropagation();


                    /* ===============================
                       APAGAR MÚSICA
                    =============================== */

                    if (musicIsPlaying) {

                        stopAllMusic();

                        musicButton.classList.remove(
                            "music-on"
                        );

                        updateMusicButton();

                        return;

                    }


                    /* ===============================
                       ENCENDER MÚSICA
                    =============================== */

                    if (bigShotMode) {

                        playBigShotMusic();

                    }
                    else {

                        playNormalMusic();

                    }

                }
            );


            /* =================================================
               BOTÓN PIPIS

               IMPORTANTE:
               NO MODIFICA LA MÚSICA.
            ================================================= */

            pipisButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();


                    /* ===============================
                       SONIDO PIPIS
                    =============================== */

                    pipisSound.currentTime = 0;

                    const sound =
                        pipisSound.play();


                    if (sound !== undefined) {

                        sound.catch(
                            function (error) {

                                console.error(
                                    "Error Pipis:",
                                    error
                                );

                            }
                        );

                    }


                    /* ===============================
                       CREAR PIPIS
                    =============================== */

                    for (
                        let i = 0;
                        i < 25;
                        i++
                    ) {


                        const pipis =
                            document.createElement(
                                "img"
                            );


                        pipis.src =
                            "pipis.gif";


                        pipis.className =
                            "pipis-rain";


                        /*
                         * Posición horizontal
                         */

                        pipis.style.left =
                            Math.random() *
                            100 +
                            "vw";


                        /*
                         * Tamaño
                         */

                        const size =
                            Math.floor(
                                Math.random() * 60
                            ) + 40;


                        pipis.style.width =
                            size +
                            "px";


                        /*
                         * Velocidad
                         */

                        const speed =
                            Math.random() * 2 +
                            2;


                        pipis.style.animationDuration =
                            speed +
                            "s";


                        /*
                         * Retraso
                         */

                        pipis.style.animationDelay =
                            Math.random() *
                            0.5 +
                            "s";


                        /*
                         * Agregar
                         */

                        pipisRain.appendChild(
                            pipis
                        );


                        /*
                         * Eliminar
                         */

                        setTimeout(
                            function () {

                                if (
                                    pipis.parentNode
                                ) {

                                    pipis.remove();

                                }

                            },
                            5500
                        );

                    }

                }
            );


            /* =================================================
               TROFEO BIG SHOT
            ================================================= */

            achievementButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();


                    /*
                     * Cambiar modo
                     */

                    bigShotMode =
                        !bigShotMode;


                    /* =================================
                       ACTIVAR BIG SHOT
                    ================================= */

                    if (bigShotMode) {


                        document.body.classList.add(
                            "big-shot-mode"
                        );


                        /*
                         * Cambiar Spamton
                         */

                        mainSpamton.src =
                            "spamton-neo.gif";


                        /*
                         * Si estaba sonando música
                         * cambiar automáticamente
                         */

                        if (musicIsPlaying) {

                            stopAllMusic();

                            playBigShotMusic();

                        }
                        else {

                            updateMusicButton();

                        }

                    }


                    /* =================================
                       DESACTIVAR BIG SHOT
                    ================================= */

                    else {


                        document.body.classList.remove(
                            "big-shot-mode"
                        );


                        /*
                         * Volver a Spamton normal
                         */

                        mainSpamton.src =
                            "spamton-idle.gif";


                        /*
                         * Si estaba sonando Big Shot,
                         * volver a la música normal
                         */

                        if (musicIsPlaying) {

                            stopAllMusic();

                            playNormalMusic();

                        }
                        else {

                            updateMusicButton();

                        }

                    }

                }
            );


            /* =================================================
               ESTADO INICIAL
            ================================================= */

            updateMusicButton();


    });

    </script>

</body>

</html>
