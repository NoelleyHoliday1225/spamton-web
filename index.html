<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>HEY EVERY !!</h1>

    <!-- GIF DE SPAMTON -->
    <img src="spamton.gif" alt="Spamton" class="gif-spamton">

    <!-- GIF DE PIPIS -->
    <img src="pipis.gif" alt="Pipis" class="gif-pipis">

    <!-- BOTÓN PIPIS -->
    <button id="pipisButton">[ PIPIS ]</button>

    <!-- SONIDO -->
    <audio id="pipisSound" src="pipis.mp3"></audio>

    <script>
        const pipisButton = document.getElementById("pipisButton");
        const pipisSound = document.getElementById("pipisSound");

        pipisButton.addEventListener("click", () => {
            pipisSound.currentTime = 0;
            pipisSound.play();
        });
    </script>

</body>
</html>
