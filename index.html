<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =========================
         BOTÓN SECRETO
    ========================== -->

    <a href="bigshot.html"
       id="secretButton">

        [ SECRET PIPIS ]

    </a>


    <!-- =========================
         TROFEO BIG SHOT
    ========================== -->

    <button id="achievementButton">

        🏆

    </button>


    <!-- =========================
         SPAMTON PRINCIPAL
    ========================== -->

    <h1>HEY EVERY !!</h1>


    <img
        id="mainSpamton"
        src="spamton.gif"
        alt="Spamton"
        class="gif-spamton"
    >


    <!-- =========================
         BOTÓN PIPIS
    ========================== -->

    <button id="pipisButton">

        [ PIPIS ]

    </button>


    <!-- =========================
         SONIDO PIPIS
    ========================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3">
    </audio>


    <!-- =========================
         MÚSICA NORMAL
    ========================== -->

    <audio
        id="backgroundMusic"
        src="want-to-be-a.mp3"
        loop
        preload="auto">
    </audio>


    <!-- =========================
         MÚSICA BIG SHOT
    ========================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        loop
        preload="auto">
    </audio>


    <!-- =========================
         SPAMTON BAILANDO
    ========================== -->

    <div id="musicBox">

        <img
            src="spamton-bailando.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button id="musicButton">

            [ TURN ON THE MUSIC ]

        </button>

    </div>


    <!-- =========================
         SUSIE
    ========================== -->

    <div id="susieGlitch">

        <div class="susieCaption">

            <span class="arrow">↘</span>

            SUSIE COMIENDO PANCAKES

        </div>


        <div class="glitch-scribbles">

            /// !!! ///
            <br>

            PANCAKES???
            <br>

            !! ?? ##

        </div>


        <img
            src="susie.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >


        <div class="glitch-text">

            S U S I E

        </div>

    </div>


    <!-- =========================
         LLUVIA DE PIPIS
    ========================== -->

    <div id="pipisRain"></div>


    <script>

        /* =================================
           ELEMENTOS
        ================================= */

        const pipisButton =
            document.getElementById("pipisButton");

        const pipisSound =
            document.getElementById("pipisSound");

        const pipisRain =
            document.getElementById("pipisRain");

        const backgroundMusic =
            document.getElementById("backgroundMusic");

        const bigShotMusic =
            document.getElementById("bigShotMusic");

        const musicButton =
            document.getElementById("musicButton");

        const musicBox =
            document.getElementById("musicBox");

        const mainSpamton =
            document.getElementById("mainSpamton");

        const achievementButton =
            document.getElementById(
                "achievementButton"
            );


        /* =================================
           ESTADO
        ================================= */

        let bigShotMode = false;

        let musicPlaying = false;


        /* =================================
           VOLUMEN
        ================================= */

        backgroundMusic.volume = 0.4;

        bigShotMusic.volume = 0.4;


        /* =================================
           COMPROBAR LOGRO
        ================================= */

        if (
            localStorage.getItem(
                "bigShotAchievement"
            ) === "true"
        ) {

            achievementButton.style.display =
                "block";

        }
        else {

            achievementButton.style.display =
                "none";

        }


        /* =================================
           ACTIVAR / DESACTIVAR BIG SHOT
        ================================= */

        function toggleBigShot() {

            bigShotMode =
                !bigShotMode;


            if (bigShotMode) {

                /* =========================
                   ACTIVAR BIG SHOT
                ========================== */

                document.body.classList.add(
                    "big-shot-mode"
                );


                mainSpamton.src =
                    "spamton.neo.gif";


                musicButton.textContent =
                    "[ TURN ON THE BIG SHOT! ]";


                /* Apagar música normal */

                backgroundMusic.pause();

                backgroundMusic.currentTime = 0;


                /* Si la música estaba activa,
                   iniciar Big Shot */

                if (musicPlaying) {

                    bigShotMusic.play();

                }

            }
            else {

                /* =========================
                   DESACTIVAR BIG SHOT
                ========================== */

                document.body.classList.remove(
                    "big-shot-mode"
                );


                mainSpamton.src =
                    "spamton.gif";


                musicButton.textContent =
                    "[ TURN ON THE MUSIC ]";


                /* Apagar Big Shot */

                bigShotMusic.pause();

                bigShotMusic.currentTime = 0;


                /* Si estaba encendida,
                   volver a música normal */

                if (musicPlaying) {

                    backgroundMusic.play();

                }

            }

        }


        /* =================================
           BOTÓN DEL TROFEO
        ================================= */

        achievementButton.addEventListener(
            "click",
            function () {

                toggleBigShot();

            }
        );


        /* =================================
           BOTÓN DE MÚSICA
        ================================= */

        musicButton.addEventListener(
            "click",
            function () {

                if (!musicPlaying) {

                    /* =========================
                       ENCENDER
                    ========================== */

                    musicPlaying = true;


                    if (bigShotMode) {

                        bigShotMusic.play();

                    }
                    else {

                        backgroundMusic.play();

                    }


                    musicBox.classList.add(
                        "musicStarted"
                    );

                }
                else {

                    /* =========================
                       APAGAR
                    ========================== */

                    musicPlaying = false;


                    backgroundMusic.pause();

                    bigShotMusic.pause();


                    musicBox.classList.remove(
                        "musicStarted"
                    );

                }

            }
        );


        /* =================================
           BOTÓN PIPIS
           
           NO TOCA LA MÚSICA
        ================================= */

        pipisButton.addEventListener(
            "click",
            function () {


                pipisSound.currentTime = 0;

                pipisSound.play();


                /* =========================
                   CREAR 25 PIPIS
                ========================== */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {

                    const pipis =
                        document.createElement(
                            "img"
                        );


                    pipis.src =
                        "pipis.gif";


                    pipis.className =
                        "pipis-rain";


                    pipis.style.left =
                        Math.random() * 100 +
                        "vw";


                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;


                    pipis.style.width =
                        size + "px";


                    const speed =
                        Math.random() * 2 + 2;


                    pipis.style.animationDuration =
                        speed + "s";


                    pipis.style.animationDelay =
                        Math.random() * 0.5 +
                        "s";


                    pipisRain.appendChild(
                        pipis
                    );


                    setTimeout(
                        function () {

                            pipis.remove();

                        },
                        5000
                    );

                }

            }
        );


    </script>


</body>

</html>
