<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =====================================================
         BOTÓN PARA ENTRAR A LA SALA SECRETA
    ====================================================== -->

    <a
        href="secret-pipis.html"
        id="secretRoomButton"
    >
        [ SECRET PIPIS ]
    </a>


    <!-- =====================================================
         TROFEO
         SOLO APARECE DESPUÉS DE CONSEGUIR EL LOGRO
    ====================================================== -->

    <button
        id="achievementButton"
        type="button"
        title="Big Shot!"
    >
        🏆
    </button>


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <h1>
        HEY EVERY !!
    </h1>


    <!-- =====================================================
         SPAMTON PRINCIPAL
    ====================================================== -->

    <img
        src="spamton-idle.gif"
        alt="Spamton"
        id="mainSpamton"
        class="main-spamton"
    >


    <!-- =====================================================
         BOTÓN PIPIS
    ====================================================== -->

    <button
        id="pipisButton"
        type="button"
    >
        [ PIPIS ]
    </button>


    <!-- =====================================================
         SONIDO PIPIS
    ====================================================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         MÚSICA NORMAL
    ====================================================== -->

    <audio
        id="normalMusic"
        src="want-to-be-a.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         MÚSICA BIG SHOT
    ====================================================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- =====================================================
         CAJA DE MÚSICA
    ====================================================== -->

    <div id="musicBox">

        <img
            src="spamton-dancing.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button
            id="musicButton"
            type="button"
        >
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =====================================================
         SUSIE
    ====================================================== -->

    <div id="susieGlitch">

        <div class="susie-caption">

            <span class="susie-arrow">↘</span>

            SUSIE COMIENDO PANCAKES

        </div>


        <div class="glitch-scribbles">

            /// !!! ///

            <br>

            PANCAKES???

            <br>

            !! ?? ##

        </div>


        <img
            src="susie-eating-pancakes.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >


        <div class="susie-name">

            S U S I E

        </div>

    </div>


    <!-- =====================================================
         CONTENEDOR DE LA LLUVIA DE PIPIS
    ====================================================== -->

    <div id="pipisRain"></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   ELEMENTOS
                ================================================= */

                const pipisButton =
                    document.getElementById("pipisButton");

                const pipisSound =
                    document.getElementById("pipisSound");

                const pipisRain =
                    document.getElementById("pipisRain");

                const normalMusic =
                    document.getElementById("normalMusic");

                const bigShotMusic =
                    document.getElementById("bigShotMusic");

                const musicButton =
                    document.getElementById("musicButton");

                const mainSpamton =
                    document.getElementById("mainSpamton");

                const achievementButton =
                    document.getElementById(
                        "achievementButton"
                    );

                const secretRoomButton =
                    document.getElementById(
                        "secretRoomButton"
                    );


                /* =================================================
                   CONFIGURACIÓN DE VOLUMEN
                ================================================= */

                normalMusic.volume = 0.40;

                bigShotMusic.volume = 0.40;

                pipisSound.volume = 0.70;


                /* =================================================
                   ESTADO
                ================================================= */

                let musicIsPlaying = false;

                let bigShotMode = false;


                /* =================================================
                   COMPROBAR SI EL LOGRO YA FUE CONSEGUIDO
                ================================================= */

                const achievementUnlocked =
                    localStorage.getItem(
                        "spamtonBigShotAchievement"
                    ) === "true";


                if (achievementUnlocked) {

                    achievementButton.style.display =
                        "block";

                    secretRoomButton.style.display =
                        "none";

                }


                /* =================================================
                   FUNCIÓN PARA ACTUALIZAR EL BOTÓN
                ================================================= */

                function updateMusicButton() {

                    if (bigShotMode) {

                        if (musicIsPlaying) {

                            musicButton.textContent =
                                "[ TURN OFF THE BIG SHOT ]";

                        }
                        else {

                            musicButton.textContent =
                                "[ TURN ON THE BIG SHOT! ]";

                        }

                    }
                    else {

                        if (musicIsPlaying) {

                            musicButton.textContent =
                                "[ TURN OFF THE MUSIC ]";

                        }
                        else {

                            musicButton.textContent =
                                "[ TURN ON THE MUSIC ]";

                        }

                    }

                }


                /* =================================================
                   DETENER TODAS LAS MÚSICAS
                ================================================= */

                function stopAllMusic() {

                    normalMusic.pause();

                    bigShotMusic.pause();

                    musicIsPlaying = false;

                }


                /* =================================================
                   REPRODUCIR MÚSICA NORMAL
                ================================================= */

                function playNormalMusic() {

                    bigShotMusic.pause();

                    normalMusic.volume = 0.40;

                    const playPromise =
                        normalMusic.play();


                    if (
                        playPromise !== undefined
                    ) {

                        playPromise
                            .then(function () {

                                musicIsPlaying = true;

                                updateMusicButton();

                            })
                            .catch(function (error) {

                                console.log(
                                    "No se pudo reproducir la música normal:",
                                    error
                                );

                                musicIsPlaying = false;

                                updateMusicButton();

                            });

                    }

                }


                /* =================================================
                   REPRODUCIR BIG SHOT
                ================================================= */

                function playBigShotMusic() {

                    normalMusic.pause();

                    bigShotMusic.volume = 0.40;

                    const playPromise =
                        bigShotMusic.play();


                    if (
                        playPromise !== undefined
                    ) {

                        playPromise
                            .then(function () {

                                musicIsPlaying = true;

                                updateMusicButton();

                            })
                            .catch(function (error) {

                                console.log(
                                    "No se pudo reproducir Big Shot:",
                                    error
                                );

                                musicIsPlaying = false;

                                updateMusicButton();

                            });

                    }

                }


                /* =================================================
                   BOTÓN DE MÚSICA
                   
                   IMPORTANTE:
                   PIPIS NO LLAMA ESTA FUNCIÓN.
                ================================================= */

                musicButton.addEventListener(
                    "click",
                    function () {


                        /* =============================
                           SI LA MÚSICA ESTÁ SONANDO
                        ============================== */

                        if (musicIsPlaying) {

                            stopAllMusic();

                            updateMusicButton();

                            musicButton.classList.remove(
                                "music-on"
                            );

                            return;

                        }


                        /* =============================
                           SI NO ESTÁ SONANDO
                        ============================== */

                        if (bigShotMode) {

                            playBigShotMusic();

                        }
                        else {

                            playNormalMusic();

                        }


                        musicButton.classList.add(
                            "music-on"
                        );

                    }
                );


                /* =================================================
                   BOTÓN PIPIS

                   ESTE BOTÓN SOLO REPRODUCE PIPIS.
                   NO TOCA NINGUNA MÚSICA.
                ================================================= */

                pipisButton.addEventListener(
                    "click",
                    function () {


                        /* =============================
                           SONIDO
                        ============================== */

                        pipisSound.currentTime = 0;

                        const pipisPromise =
                            pipisSound.play();


                        if (
                            pipisPromise !== undefined
                        ) {

                            pipisPromise.catch(
                                function (error) {

                                    console.log(
                                        "No se pudo reproducir Pipis:",
                                        error
                                    );

                                }
                            );

                        }


                        /* =============================
                           CREAR PIPIS
                        ============================== */

                        const amount = 25;


                        for (
                            let i = 0;
                            i < amount;
                            i++
                        ) {


                            const pipis =
                                document.createElement(
                                    "img"
                                );


                            pipis.src =
                                "pipis.gif";


                            pipis.className =
                                "pipis-rain";


                            /* POSICIÓN */

                            pipis.style.left =
                                (
                                    Math.random() *
                                    100
                                ) + "vw";


                            /* TAMAÑO */

                            const size =
                                Math.floor(
                                    Math.random() * 60
                                ) + 40;


                            pipis.style.width =
                                size + "px";


                            /* VELOCIDAD */

                            const speed =
                                Math.random() * 2 + 2;


                            pipis.style.animationDuration =
                                speed + "s";


                            /* RETRASO */

                            pipis.style.animationDelay =
                                (
                                    Math.random() * 0.5
                                ) + "s";


                            pipisRain.appendChild(
                                pipis
                            );


                            /* ELIMINAR */

                            setTimeout(
                                function () {

                                    if (
                                        pipis.parentNode
                                    ) {

                                        pipis.remove();

                                    }

                                },
                                5500
                            );

                        }

                    }
                );


                /* =================================================
                   ACTIVAR / DESACTIVAR BIG SHOT
                ================================================= */

                achievementButton.addEventListener(
                    "click",
                    function () {


                        bigShotMode =
                            !bigShotMode;


                        if (bigShotMode) {


                            /* =============================
                               ACTIVAR MODO BIG SHOT
                            ============================== */

                            document.body.classList.add(
                                "big-shot-mode"
                            );


                            mainSpamton.src =
                                "spamton-neo.gif";


                            /* Cambiar botón */

                            if (musicIsPlaying) {

                                musicButton.textContent =
                                    "[ TURN OFF THE BIG SHOT ]";

                            }
                            else {

                                musicButton.textContent =
                                    "[ TURN ON THE BIG SHOT! ]";

                            }


                            /* =============================
                               CAMBIAR MÚSICA
                            ============================== */

                            if (musicIsPlaying) {

                                normalMusic.pause();

                                playBigShotMusic();

                            }

                        }
                        else {


                            /* =============================
                               SALIR DE BIG SHOT
                            ============================== */

                            document.body.classList.remove(
                                "big-shot-mode"
                            );


                            mainSpamton.src =
                                "spamton-idle.gif";


                            /* =============================
                               CAMBIAR MÚSICA
                            ============================== */

                            if (musicIsPlaying) {

                                bigShotMusic.pause();

                                playNormalMusic();

                            }
                            else {

                                musicButton.textContent =
                                    "[ TURN ON THE MUSIC ]";

                            }

                        }

                    }
                );


                /* =================================================
                   ESTADO INICIAL
                ================================================= */

                updateMusicButton();


            }
        );

    </script>


</body>

</html>
