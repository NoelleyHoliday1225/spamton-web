<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>HEY EVERY !!</h1>

    <!-- GIF DE SPAMTON -->
    <img src="spamton.gif" alt="Spamton" class="gif-spamton">

    <!-- GIF DE PIPIS -->
    <img src="pipis.gif" alt="Pipis" class="gif-pipis">

    <button id="pipisButton">[ PIPIS ]</button>

<audio id="pipisSound" src="pipis.mp3"></audio>

<div id="pipisRain"></div>

<script>
    const pipisButton = document.getElementById("pipisButton");
    const pipisSound = document.getElementById("pipisSound");
    const pipisRain = document.getElementById("pipisRain");

    pipisButton.addEventListener("click", () => {

        // Reproducir sonido
        pipisSound.currentTime = 0;
        pipisSound.play();

        // Crear 20 Pipis
        for (let i = 0; i < 20; i++) {

            const pipis = document.createElement("img");

            pipis.src = "pipis.gif";
            pipis.classList.add("pipis-rain");

            // Posición aleatoria
            pipis.style.left = Math.random() * 100 + "vw";

            // Tamaño aleatorio
            const size = 40 + Math.random() * 80;
            pipis.style.width = size + "px";

            // Duración aleatoria
            pipis.style.animationDuration =
                (2 + Math.random() * 3) + "s";

            // Retraso aleatorio
            pipis.style.animationDelay =
                Math.random() * 0.5 + "s";

            pipisRain.appendChild(pipis);

            // Eliminar después de caer
            setTimeout(() => {
                pipis.remove();
            }, 5500);
        }
    });
</script>
