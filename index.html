<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>HEY EVERY !!</h1>


    <!-- SPAMTON -->

    <img
        src="spamton.gif"
        alt="Spamton"
        class="gif-spamton"
    >


    <!-- BOTÓN PIPIS -->

    <button id="pipisButton">
        [ PIPIS ]
    </button>


    <!-- SONIDO PIPIS -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
    ></audio>


    <!-- MÚSICA DE FONDO -->

    <audio
        id="backgroundMusic"
        src="want-to-be-a.mp3"
        loop
        autoplay
    ></audio>


    <!-- CONTENEDOR DE LA LLUVIA -->

    <div id="pipisRain"></div>


    <script>


        /* =========================
           ELEMENTOS
        ========================= */

        const pipisButton =
            document.getElementById("pipisButton");

        const pipisSound =
            document.getElementById("pipisSound");

        const pipisRain =
            document.getElementById("pipisRain");

        const backgroundMusic =
            document.getElementById("backgroundMusic");


        /* =========================
           VOLUMEN DE LA MÚSICA
        ========================= */

        backgroundMusic.volume = 0.4;


        /* =========================
           INTENTAR REPRODUCIR
           AL ENTRAR
        ========================= */

        window.addEventListener("load", function () {

            backgroundMusic.play().catch(function () {

                console.log(
                    "El navegador bloqueó el autoplay. Esperando interacción..."
                );

            });

        });


        /* =========================
           SI CHROME BLOQUEA
           EL AUTOPLAY
        ========================= */

        function iniciarMusica() {

            backgroundMusic.play();

        }


        document.addEventListener(
            "click",
            iniciarMusica,
            { once: true }
        );


        /* =========================
           BOTÓN PIPIS
        ========================= */

        pipisButton.addEventListener(
            "click",
            function () {


                /* SONIDO PIPIS */

                pipisSound.currentTime = 0;

                pipisSound.play();


                /* =========================
                   CREAR 25 PIPIS
                ========================= */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {


                    const pipis =
                        document.createElement("img");


                    pipis.src =
                        "pipis.gif";


                    pipis.className =
                        "pipis-rain";


                    /* POSICIÓN ALEATORIA */

                    pipis.style.left =
                        Math.random() * 100 + "vw";


                    /* TAMAÑO ALEATORIO */

                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;


                    pipis.style.width =
                        size + "px";


                    /* VELOCIDAD ALEATORIA */

                    const speed =
                        Math.random() * 2 + 2;


                    pipis.style.animationDuration =
                        speed + "s";


                    /* RETRASO ALEATORIO */

                    pipis.style.animationDelay =
                        Math.random() * 0.5 + "s";


                    /* AGREGAR PIPIS */

                    pipisRain.appendChild(
                        pipis
                    );


                    /* ELIMINAR DESPUÉS DE CAER */

                    setTimeout(
                        function () {

                            pipis.remove();

                        },
                        5000
                    );

                }

            }
        );


    </script>


</body>

</html>
