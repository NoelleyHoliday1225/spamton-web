<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <h1>HEY EVERY !!</h1>


    <!-- =========================
         SPAMTON PRINCIPAL
    ========================== -->

    <img
        src="spamton.gif"
        alt="Spamton"
        class="gif-spamton"
    >


    <!-- =========================
         BOTÓN PIPIS
    ========================== -->

    <button id="pipisButton">
        [ PIPIS ]
    </button>


    <!-- =========================
         SONIDO DE PIPIS
    ========================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
    ></audio>


    <!-- =========================
         MÚSICA DE FONDO
    ========================== -->

    <audio
        id="backgroundMusic"
        src="want-to-be-a.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =========================
         SPAMTON BAILANDO
         + MÚSICA
    ========================== -->

    <div id="musicBox">

        <img
            src="spamton-bailando.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button id="musicButton">
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =========================
         SUSIE GLITCH
    ========================== -->

    <div id="susieGlitch">

        <!-- TEXTO ARRIBA -->

        <div class="susieCaption">

            <span class="arrow">↘</span>

            SUSIE COMIENDO PANCAKES

        </div>


        <!-- GARBATOS -->

        <div class="glitch-scribbles">

            /// !!! ///
            <br>

            PANCAKES???
            <br>

            !! ?? ##

        </div>


        <!-- GIF DE SUSIE -->

        <img
            src="susie.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >


        <!-- TEXTO INFERIOR -->

        <div class="glitch-text">

            S U S I E

        </div>

    </div>


    <!-- =========================
         CONTENEDOR DE LA LLUVIA
    ========================== -->

    <div id="pipisRain"></div>


    <script>


        /* =========================
           ELEMENTOS
        ========================= */

        const pipisButton =
            document.getElementById("pipisButton");

        const pipisSound =
            document.getElementById("pipisSound");

        const pipisRain =
            document.getElementById("pipisRain");

        const backgroundMusic =
            document.getElementById("backgroundMusic");

        const musicButton =
            document.getElementById("musicButton");

        const musicBox =
            document.getElementById("musicBox");


        /* =========================
           VOLUMEN DE LA MÚSICA
           40%
        ========================== */

        backgroundMusic.volume = 0.4;


        /* =========================
           BOTÓN TURN ON THE MUSIC
        ========================== */

        musicButton.addEventListener(
            "click",
            function () {

                backgroundMusic.play()
                    .then(function () {

                        musicBox.classList.add(
                            "musicStarted"
                        );

                    })
                    .catch(function (error) {

                        console.log(
                            "No se pudo reproducir la música:",
                            error
                        );

                    });

            }
        );


        /* =========================
           BOTÓN PIPIS
           
           ESTE BOTÓN NO ENCIENDE
           LA MÚSICA DE FONDO.
        ========================== */

        pipisButton.addEventListener(
            "click",
            function () {


                /* =========================
                   SONIDO PIPIS
                ========================== */

                pipisSound.currentTime = 0;

                pipisSound.play();


                /* =========================
                   CREAR 25 PIPIS
                ========================== */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {


                    const pipis =
                        document.createElement("img");


                    pipis.src =
                        "pipis.gif";


                    pipis.className =
                        "pipis-rain";


                    /* =========================
                       POSICIÓN ALEATORIA
                    ========================== */

                    pipis.style.left =
                        Math.random() * 100 + "vw";


                    /* =========================
                       TAMAÑO ALEATORIO
                    ========================== */

                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;


                    pipis.style.width =
                        size + "px";


                    /* =========================
                       VELOCIDAD ALEATORIA
                    ========================== */

                    const speed =
                        Math.random() * 2 + 2;


                    pipis.style.animationDuration =
                        speed + "s";


                    /* =========================
                       RETRASO ALEATORIO
                    ========================== */

                    pipis.style.animationDelay =
                        Math.random() * 0.5 + "s";


                    /* =========================
                       AGREGAR PIPIS
                    ========================== */

                    pipisRain.appendChild(
                        pipis
                    );


                    /* =========================
                       ELIMINAR DESPUÉS DE CAER
                    ========================== */

                    setTimeout(
                        function () {

                            pipis.remove();

                        },
                        5000
                    );

                }

            }
        );


    </script>


</body>

</html>
