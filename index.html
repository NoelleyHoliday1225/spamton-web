<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spamton Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         SALA SECRETA
    ====================================================== -->

    <a href="secret-pipis.html" id="secretRoomButton">
        [ SECRET PIPIS ]
    </a>


    <!-- =====================================================
         TROFEO BIG SHOT
    ====================================================== -->

    <button
        id="achievementButton"
        type="button"
        title="Big Shot!"
        style="display:none;"
    >
        🏆
    </button>


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <h1>HEY EVERY !!</h1>


    <!-- =====================================================
         SPAMTON
    ====================================================== -->

    <img
        src="spamton-idle.gif"
        alt="Spamton"
        id="mainSpamton"
        class="main-spamton"
    >


    <!-- =====================================================
         BOTÓN PIPIS
    ====================================================== -->

    <button
        id="pipisButton"
        type="button"
    >
        [ PIPIS ]
    </button>


    <!-- =====================================================
         SONIDO PIPIS
    ====================================================== -->

    <audio
        id="pipisSound"
        src="pipis.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         MÚSICA NORMAL
    ====================================================== -->

    <audio
        id="normalMusic"
        src="want-to-be-a.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         BIG SHOT
    ====================================================== -->

    <audio
        id="bigShotMusic"
        src="big-shot.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- =====================================================
         CAJA DE MÚSICA
    ====================================================== -->

    <div id="musicBox">

        <img
            src="spamton-dancing.gif"
            alt="Spamton bailando"
            id="dancingSpamton"
        >

        <button
            id="musicButton"
            type="button"
        >
            [ TURN ON THE MUSIC ]
        </button>

    </div>


    <!-- =====================================================
         SUSIE
    ====================================================== -->

    <div id="susieGlitch">

        <div class="susie-caption">
            <span class="susie-arrow">↘</span>
            SUSIE COMIENDO PANCAKES
        </div>

        <div class="glitch-scribbles">
            /// !!! ///
            <br>
            PANCAKES???
            <br>
            !! ?? ##
        </div>

        <img
            src="susie-eating-pancakes.gif"
            alt="Susie comiendo pancakes"
            id="susieGif"
        >

        <div class="susie-name">
            S U S I E
        </div>

    </div>


    <!-- =====================================================
         LLUVIA DE PIPIS
    ====================================================== -->

    <div id="pipisRain"></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const pipisButton =
            document.getElementById("pipisButton");

        const pipisSound =
            document.getElementById("pipisSound");

        const pipisRain =
            document.getElementById("pipisRain");

        const normalMusic =
            document.getElementById("normalMusic");

        const bigShotMusic =
            document.getElementById("bigShotMusic");

        const musicButton =
            document.getElementById("musicButton");

        const mainSpamton =
            document.getElementById("mainSpamton");

        const achievementButton =
            document.getElementById("achievementButton");

        const secretRoomButton =
            document.getElementById("secretRoomButton");


        /* =====================================================
           VOLUMEN
        ====================================================== */

        normalMusic.volume = 0.40;

        bigShotMusic.volume = 0.40;

        pipisSound.volume = 0.70;


        /* =====================================================
           ESTADO
        ====================================================== */

        let currentMusic = null;

        let bigShotMode = false;


        /* =====================================================
           COMPROBAR LOGRO
        ====================================================== */

        if (
            localStorage.getItem(
                "spamtonBigShotAchievement"
            ) === "true"
        ) {

            achievementButton.style.display = "block";

            secretRoomButton.style.display = "none";

        }


        /* =====================================================
           ACTUALIZAR BOTÓN
        ====================================================== */

        function updateMusicButton() {

            if (bigShotMode) {

                if (currentMusic === bigShotMusic) {

                    musicButton.textContent =
                        "[ TURN OFF THE BIG SHOT ]";

                } else {

                    musicButton.textContent =
                        "[ TURN ON THE BIG SHOT! ]";

                }

            } else {

                if (currentMusic === normalMusic) {

                    musicButton.textContent =
                        "[ TURN OFF THE MUSIC ]";

                } else {

                    musicButton.textContent =
                        "[ TURN ON THE MUSIC ]";

                }

            }

        }


        /* =====================================================
           DETENER MÚSICA
        ====================================================== */

        function stopMusic() {

            normalMusic.pause();
            bigShotMusic.pause();

            currentMusic = null;

            updateMusicButton();

        }


        /* =====================================================
           REPRODUCIR MÚSICA NORMAL
        ====================================================== */

        function startNormalMusic() {

            /* Detener Big Shot */

            bigShotMusic.pause();

            /* Volumen */

            normalMusic.volume = 0.40;

            /*
             * IMPORTANTE:
             * play() ocurre directamente desde el botón.
             */

            normalMusic.play()
                .then(function () {

                    currentMusic = normalMusic;

                    updateMusicButton();

                    console.log(
                        "Música normal reproduciéndose."
                    );

                })
                .catch(function (error) {

                    console.error(
                        "ERROR MÚSICA NORMAL:",
                        error
                    );

                    alert(
                        "No se pudo reproducir want-to-be-a.mp3. Revisa que el archivo esté en GitHub y que el nombre sea exactamente igual."
                    );

                });

        }


        /* =====================================================
           REPRODUCIR BIG SHOT
        ====================================================== */

        function startBigShotMusic() {

            /* Detener música normal */

            normalMusic.pause();

            /* Reiniciar Big Shot */

            bigShotMusic.pause();

            bigShotMusic.currentTime = 0;

            bigShotMusic.volume = 0.40;

            /*
             * Reproducir directamente.
             */

            bigShotMusic.play()
                .then(function () {

                    currentMusic = bigShotMusic;

                    updateMusicButton();

                    console.log(
                        "BIG SHOT reproduciéndose."
                    );

                })
                .catch(function (error) {

                    console.error(
                        "ERROR BIG SHOT:",
                        error
                    );

                    alert(
                        "No se pudo reproducir big-shot.mp3. Revisa que el archivo exista y que el nombre sea exactamente big-shot.mp3"
                    );

                });

        }


        /* =====================================================
           BOTÓN DE MÚSICA
        ====================================================== */

        musicButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                /* =========================================
                   SI ESTÁ SONANDO → APAGAR
                ========================================= */

                if (currentMusic !== null) {

                    stopMusic();

                    return;

                }


                /* =========================================
                   SI BIG SHOT ESTÁ ACTIVADO
                ========================================= */

                if (bigShotMode) {

                    startBigShotMusic();

                }


                /* =========================================
                   MÚSICA NORMAL
                ========================================= */

                else {

                    startNormalMusic();

                }

            }
        );


        /* =====================================================
           BOTÓN PIPIS

           NO TOCA LA MÚSICA.
        ====================================================== */

        pipisButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                /* =========================================
                   SONIDO PIPIS
                ========================================= */

                pipisSound.currentTime = 0;

                pipisSound.play()
                    .catch(function (error) {

                        console.error(
                            "Error con pipis.mp3:",
                            error
                        );

                    });


                /* =========================================
                   CREAR PIPIS
                ========================================= */

                for (
                    let i = 0;
                    i < 25;
                    i++
                ) {

                    const pipis =
                        document.createElement("img");


                    pipis.src =
                        "pipis.gif";


                    pipis.className =
                        "pipis-rain";


                    /* POSICIÓN */

                    pipis.style.left =
                        Math.random() *
                        100 +
                        "vw";


                    /* TAMAÑO */

                    const size =
                        Math.floor(
                            Math.random() * 60
                        ) + 40;


                    pipis.style.width =
                        size +
                        "px";


                    /* VELOCIDAD */

                    const speed =
                        Math.random() * 2 +
                        2;


                    pipis.style.animationDuration =
                        speed +
                        "s";


                    /* RETRASO */

                    pipis.style.animationDelay =
                        Math.random() *
                        0.5 +
                        "s";


                    pipisRain.appendChild(
                        pipis
                    );


                    /* ELIMINAR */

                    setTimeout(
                        function () {

                            pipis.remove();

                        },
                        5500
                    );

                }

            }
        );


        /* =====================================================
           TROFEO BIG SHOT
        ====================================================== */

        achievementButton.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                event.stopPropagation();


                /* =========================================
                   CAMBIAR ESTADO
                ========================================= */

                bigShotMode =
                    !bigShotMode;


                /* =========================================
                   ACTIVAR BIG SHOT
                ========================================= */

                if (bigShotMode) {

                    document.body.classList.add(
                        "big-shot-mode"
                    );


                    /*
                     * Cambiar Spamton
                     */

                    mainSpamton.src =
                        "spamton-neo.gif";


                    /*
                     * Si había música normal,
                     * cambiar a Big Shot.
                     */

                    if (
                        currentMusic ===
                        normalMusic
                    ) {

                        stopMusic();

                        startBigShotMusic();

                    } else {

                        updateMusicButton();

                    }

                }


                /* =========================================
                   DESACTIVAR BIG SHOT
                ========================================= */

                else {

                    document.body.classList.remove(
                        "big-shot-mode"
                    );


                    /*
                     * Volver a Spamton normal
                     */

                    mainSpamton.src =
                        "spamton-idle.gif";


                    /*
                     * Si estaba sonando Big Shot,
                     * cambiar a música normal.
                     */

                    if (
                        currentMusic ===
                        bigShotMusic
                    ) {

                        stopMusic();

                        startNormalMusic();

                    } else {

                        updateMusicButton();

                    }

                }

            }
        );


        /* =====================================================
           ESTADO INICIAL
        ====================================================== */

        updateMusicButton();

    </script>

</body>

</html>
