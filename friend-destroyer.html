<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>FRIEND DESTROYER</title>

    <link
        rel="stylesheet"
        href="friend-destroyer.css"
    >

</head>

<body>


<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="warning">
            !!! WARNING !!!
        </div>

        <h1>
            FRIEND DESTROYER
        </h1>

        <p>
            DESTROY THEM ALL.
        </p>

        <p>
            PC: W A S D + Z
        </p>

        <p>
            MOBILE: JOYSTICK + FIRE
        </p>

        <div class="startStats">

            TOTAL KILLS:
            <span id="startTotalKills">0</span>

        </div>

        <button
            id="startButton"
            type="button"
        >
            [ START GAME ]
        </button>

        <br>
        <br>

        <a
            href="index.html"
            class="backButton"
        >
            [ BACK TO SPAMTON SHOP ]
        </a>

    </div>

</div>



<!-- =====================================================
     JUEGO
===================================================== -->

<div id="game">


    <!-- =================================================
         BOTÓN SALIR
    ================================================== -->

    <button
        id="exitGameButton"
        type="button"
    >
        [ EXIT ]
    </button>



    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">

        <div class="hudBox">

            HP:

            <span id="playerHP">
                450
            </span>

            / 450

        </div>


        <div class="hudBox">

            KILLS:

            <span id="killCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TOTAL:

            <span id="totalKillCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TIME:

            <span id="timer">
                00:00
            </span>

        </div>

    </div>



    <!-- =================================================
         ÁREA DEL JUEGO
    ================================================== -->

    <div id="gameArea">

        <div id="platform"></div>

        <img
            src="spamton-gun-game.gif"
            id="player"
            alt="Spamton"
        >

        <div id="friends"></div>

        <div id="pipisRain"></div>

        <div id="bullets"></div>

        <div id="triangles"></div>

    </div>



    <!-- =================================================
         CONTROLES
    ================================================== -->

    <div id="mobileControls">


        <!-- JOYSTICK -->

        <div id="joystick">

            <div id="joystickBase">

                <div id="joystickKnob"></div>

            </div>

        </div>


        <!-- DISPARO -->

        <button
            id="fireButton"
            type="button"
        >
            FIRE
        </button>

    </div>



    <!-- =================================================
         EVENTO
    ================================================== -->

    <div id="eventMessage"></div>



    <!-- =================================================
         POWER UP ACTIVO
    ================================================== -->

    <div id="powerUpDisplay">

        POWER:

        <span id="powerUpText">
            NONE
        </span>

    </div>


</div>



<!-- =====================================================
     MÚSICA
===================================================== -->

<audio
    id="gameMusic"
    src="big-shot.mp3"
    loop
    preload="auto"
></audio>


<audio
    id="friendLaugh"
    src="friend-laugh.mp3"
    preload="auto"
></audio>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const game =
    document.getElementById("game");

const gameArea =
    document.getElementById("gameArea");

const player =
    document.getElementById("player");

const friendsContainer =
    document.getElementById("friends");

const bulletsContainer =
    document.getElementById("bullets");

const trianglesContainer =
    document.getElementById("triangles");

const pipisContainer =
    document.getElementById("pipisRain");

const playerHPText =
    document.getElementById("playerHP");

const killCounterText =
    document.getElementById("killCounter");

const totalKillCounterText =
    document.getElementById("totalKillCounter");

const startTotalKillsText =
    document.getElementById("startTotalKills");

const timerText =
    document.getElementById("timer");

const eventMessage =
    document.getElementById("eventMessage");

const gameMusic =
    document.getElementById("gameMusic");

const friendLaugh =
    document.getElementById("friendLaugh");

const fireButton =
    document.getElementById("fireButton");

const joystickBase =
    document.getElementById("joystickBase");

const joystickKnob =
    document.getElementById("joystickKnob");

const powerUpText =
    document.getElementById("powerUpText");



/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MAX_HP = 450;

const PLAYER_SPEED = 0.42;

const BULLET_SPEED = 1.8;

const NORMAL_DAMAGE = 10;

const RED_DAMAGE = 15;

const GLITCH_DAMAGE = 20;

const BOSS_DAMAGE = 20;



/* =====================================================
   ESTADO
===================================================== */

let playerHP =
    MAX_HP;

let kills =
    0;

let totalKills =
    parseInt(
        localStorage.getItem(
            "friendTotalKills"
        )
    ) || 0;

let gameRunning =
    false;

let gameTime =
    0;

let timerInterval =
    null;

let spawnTimeout =
    null;

let gameLoopId =
    null;

let eventInterval =
    null;

let keys =
    {};

let bullets =
    [];

let friends =
    [];

let triangles =
    [];

let playerX =
    50;

let playerY =
    75;

let lastTime =
    0;

let shootCooldown =
    false;

let tripleShot =
    false;

let joystickActive =
    false;

let joystickX =
    0;

let joystickY =
    0;

let damageCooldown =
    false;



/* =====================================================
   POSICIÓN
===================================================== */

function resetPlayerPosition() {

    playerX = 50;

    playerY = 75;

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}



/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    playerHPText.textContent =
        playerHP;

    killCounterText.textContent =
        kills;

    totalKillCounterText.textContent =
        totalKills;

    startTotalKillsText.textContent =
        totalKills;

}



/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] =
            true;


        if (
            key === "z" &&
            gameRunning
        ) {

            shoot();

        }


        if (
            [
                "w",
                "a",
                "s",
                "d",
                "z"
            ].includes(key)
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] =
            false;

    }
);



/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);



function startGame() {

    clearGame();

    startScreen.style.display =
        "none";

    game.style.display =
        "block";

    gameRunning =
        true;

    playerHP =
        MAX_HP;

    kills =
        0;

    gameTime =
        0;

    tripleShot =
        false;

    damageCooldown =
        false;

    powerUpText.textContent =
        "NONE";

    resetPlayerPosition();

    updateHUD();


    gameMusic.volume =
        0.40;

    gameMusic.currentTime =
        0;

    gameMusic.play()
        .catch(
            function() {}
        );


    timerInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                gameTime++;

                updateTimer();

            },
            1000
        );


    scheduleFriendSpawn();


    eventInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                if (
                    Math.random() < 0.20
                ) {

                    spawnPowerUp();

                }

            },
            12000
        );


    lastTime =
        performance.now();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   SALIR
===================================================== */

exitGameButton.addEventListener(
    "click",
    exitGame
);


function exitGame() {

    gameRunning =
        false;

    clearInterval(
        timerInterval
    );

    clearInterval(
        eventInterval
    );

    clearTimeout(
        spawnTimeout
    );

    cancelAnimationFrame(
        gameLoopId
    );

    gameMusic.pause();

    clearGame();

    window.location.href =
        "index.html";

}



/* =====================================================
   LIMPIAR
===================================================== */

function clearGame() {

    clearTimeout(
        spawnTimeout
    );


    friends.forEach(
        friend => {

            if (
                friend.parentNode
            ) {

                friend.remove();

            }

        }
    );


    bullets.forEach(
        bullet => {

            if (
                bullet.parentNode
            ) {

                bullet.remove();

            }

        }
    );


    triangles.forEach(
        triangle => {

            if (
                triangle.parentNode
            ) {

                triangle.remove();

            }

        }
    );


    document
        .querySelectorAll(
            ".healingPipis, .powerUp"
        )
        .forEach(
            element => element.remove()
        );


    friends = [];

    bullets = [];

    triangles = [];

}



/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }


    const delta =
        time - lastTime;

    lastTime =
        time;


    movePlayer();

    updateBullets(delta);

    updateFriends(delta);

    updateTriangles(delta);

    checkCollisions();

    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   MOVER JUGADOR
===================================================== */

function movePlayer() {

    let dx = 0;

    let dy = 0;


    if (keys["w"]) {
        dy -= 1;
    }

    if (keys["s"]) {
        dy += 1;
    }

    if (keys["a"]) {
        dx -= 1;
    }

    if (keys["d"]) {
        dx += 1;
    }


    /*
     * JOYSTICK
     */

    dx += joystickX;

    dy += joystickY;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length > 0) {

        dx /= length;

        dy /= length;

        playerX +=
            dx *
            PLAYER_SPEED;

        playerY +=
            dy *
            PLAYER_SPEED;

    }


    playerX =
        Math.max(
            5,
            Math.min(
                95,
                playerX
            )
        );


    playerY =
        Math.max(
            8,
            Math.min(
                92,
                playerY
            )
        );


    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}



/* =====================================================
   DISPARAR
===================================================== */

function shoot() {

    if (!gameRunning) {
        return;
    }


    if (shootCooldown) {
        return;
    }


    shootCooldown =
        true;


    setTimeout(
        function() {

            shootCooldown =
                false;

        },
        120
    );


    if (tripleShot) {

        createBullet(
            playerX,
            playerY,
            -0.12
        );

        createBullet(
            playerX,
            playerY,
            0
        );

        createBullet(
            playerX,
            playerY,
            0.12
        );

    } else {

        createBullet(
            playerX,
            playerY,
            0
        );

    }

}



/* =====================================================
   CREAR BALA
===================================================== */

function createBullet(
    x,
    y,
    direction
) {

    const bullet =
        document.createElement(
            "img"
        );


    bullet.src =
        "pipis.gif";


    bullet.className =
        "bullet";


    bullet.dataset.x =
        x;

    bullet.dataset.y =
        y - 5;

    bullet.dataset.dx =
        direction;


    bullet.style.left =
        x + "%";

    bullet.style.top =
        (y - 5) + "%";


    bulletsContainer.appendChild(
        bullet
    );


    bullets.push(
        bullet
    );

}



/* =====================================================
   ACTUALIZAR BALAS
===================================================== */

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];


        let x =
            parseFloat(
                bullet.dataset.x
            );

        let y =
            parseFloat(
                bullet.dataset.y
            );

        const dx =
            parseFloat(
                bullet.dataset.dx
            );


        y -=
            BULLET_SPEED;

        x +=
            dx *
            2;


        bullet.dataset.x =
            x;

        bullet.dataset.y =
            y;


        bullet.style.left =
            x + "%";

        bullet.style.top =
            y + "%";


        if (
            y < -10 ||
            x < -10 ||
            x > 110
        ) {

            bullet.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   SPAWN FRIEND
===================================================== */

function scheduleFriendSpawn() {

    if (!gameRunning) {
        return;
    }


    const delay =
        Math.random() *
        1600 +
        700;


    spawnTimeout =
        setTimeout(
            function() {

                spawnFriend();

                scheduleFriendSpawn();

            },
            delay
        );

}



/* =====================================================
   CREAR FRIEND
===================================================== */

function spawnFriend() {

    if (!gameRunning) {
        return;
    }


    let type =
        "normal";


    if (
        kills >= 100
    ) {

        const chance =
            Math.random();

        if (
            chance < 0.20
        ) {

            type =
                "glitch";

        } else if (
            chance < 0.45
        ) {

            type =
                "red";

        }

    }


    const friend =
        document.createElement(
            "img"
        );


    friend.src =
        "friend-sprite.gif";


    friend.className =
        "friend friend-" +
        type;


    const x =
        Math.random() *
        90 +
        5;


    const y =
        Math.random() *
        75 +
        5;


    friend.style.left =
        x + "%";

    friend.style.top =
        y + "%";


    let hp =
        20;

    let damage =
        NORMAL_DAMAGE;

    let speed =
        0.035;


    if (
        type === "red"
    ) {

        hp =
            45;

        damage =
            RED_DAMAGE;

        speed =
            0.055;

    }


    if (
        type === "glitch"
    ) {

        hp =
            70;

        damage =
            GLITCH_DAMAGE;

        speed =
            0.075;

    }


    friend.dataset.hp =
        hp;

    friend.dataset.damage =
        damage;

    friend.dataset.x =
        x;

    friend.dataset.y =
        y;

    friend.dataset.type =
        type;

    friend.dataset.speed =
        speed;


    friendsContainer.appendChild(
        friend
    );


    friends.push(
        friend
    );


    /*
     * Boss
     */

    if (
        kills >= 100 &&
        !friends.some(
            f =>
                f.dataset.type ===
                "boss"
        )
    ) {

        spawnBoss();

    }

}



/* =====================================================
   BOSS
===================================================== */

function spawnBoss() {

    showEvent(
        "!!! BOSS FRIEND !!!"
    );


    const boss =
        document.createElement(
            "img"
        );


    boss.src =
        "friend-sprite.gif";


    boss.className =
        "friend boss";


    const x =
        50;

    const y =
        10;


    boss.style.left =
        x + "%";

    boss.style.top =
        y + "%";


    boss.dataset.hp =
        500;

    boss.dataset.damage =
        BOSS_DAMAGE;

    boss.dataset.x =
        x;

    boss.dataset.y =
        y;

    boss.dataset.type =
        "boss";

    boss.dataset.speed =
        0.018;


    friendsContainer.appendChild(
        boss
    );


    friends.push(
        boss
    );

}



/* =====================================================
   MOVER FRIENDS
===================================================== */

function updateFriends() {

    friends.forEach(
        function(friend) {

            if (
                !friend.parentNode
            ) {
                return;
            }


            let x =
                parseFloat(
                    friend.dataset.x
                );

            let y =
                parseFloat(
                    friend.dataset.y
                );


            const type =
                friend.dataset.type;


            const speed =
                parseFloat(
                    friend.dataset.speed
                );


            const dx =
                playerX - x;

            const dy =
                playerY - y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance > 5
            ) {

                x +=
                    (
                        dx /
                        distance
                    ) *
                    speed;

                y +=
                    (
                        dy /
                        distance
                    ) *
                    speed;

            } else {

                damagePlayer(
                    parseInt(
                        friend.dataset.damage
                    )
                );

            }


            friend.dataset.x =
                x;

            friend.dataset.y =
                y;


            friend.style.left =
                x + "%";

            friend.style.top =
                y + "%";


            /*
             * Glitch lanza pequeñas colas
             */

            if (
                type === "glitch" &&
                Math.random() < 0.025
            ) {

                spawnTail(
                    x,
                    y
                );

            }


            /*
             * Boss lanza triángulos
             */

            if (
                type === "boss" &&
                Math.random() < 0.012
            ) {

                spawnTriangle(
                    x,
                    y
                );

            }

        }
    );

}



/* =====================================================
   COLAS GLITCH
===================================================== */

function spawnTail(
    x,
    y
) {

    const tail =
        document.createElement(
            "div"
        );


    tail.className =
        "glitchTail";


    tail.style.left =
        x + "%";

    tail.style.top =
        y + "%";


    tail.dataset.x =
        x;

    tail.dataset.y =
        y;


    const angle =
        Math.random() *
        Math.PI *
        2;


    tail.dataset.dx =
        Math.cos(angle);

    tail.dataset.dy =
        Math.sin(angle);


    trianglesContainer.appendChild(
        tail
    );


    triangles.push(
        tail
    );

}



/* =====================================================
   TRIÁNGULOS / COLAS
===================================================== */

function spawnTriangle(
    x,
    y
) {

    const triangle =
        document.createElement(
            "div"
        );


    triangle.className =
        "triangle";


    triangle.style.left =
        x + "%";

    triangle.style.top =
        y + "%";


    triangle.dataset.x =
        x;

    triangle.dataset.y =
        y;


    /*
     * DIRECCIÓN FIJA
     */

    const angle =
        Math.random() *
        Math.PI *
        2;


    triangle.dataset.dx =
        Math.cos(angle);

    triangle.dataset.dy =
        Math.sin(angle);


    trianglesContainer.appendChild(
        triangle
    );


    triangles.push(
        triangle
    );

}



/* =====================================================
   ACTUALIZAR TRIÁNGULOS
===================================================== */

function updateTriangles() {

    for (
        let i = triangles.length - 1;
        i >= 0;
        i--
    ) {

        const triangle =
            triangles[i];


        if (
            !triangle.parentNode
        ) {

            triangles.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                triangle.dataset.x
            );

        let y =
            parseFloat(
                triangle.dataset.y
            );


        const dx =
            parseFloat(
                triangle.dataset.dx
            );

        const dy =
            parseFloat(
                triangle.dataset.dy
            );


        const speed =
            triangle.classList.contains(
                "glitchTail"
            )
                ? 0.20
                : 0.11;


        x +=
            dx *
            speed;

        y +=
            dy *
            speed;


        triangle.dataset.x =
            x;

        triangle.dataset.y =
            y;


        triangle.style.left =
            x + "%";

        triangle.style.top =
            y + "%";


        /*
         * Colisión
         */

        const distance =
            Math.sqrt(
                Math.pow(
                    playerX - x,
                    2
                )
                +
                Math.pow(
                    playerY - y,
                    2
                )
            );


        if (
            distance < 4
        ) {

            damagePlayer(
                triangle.classList.contains(
                    "glitchTail"
                )
                    ? 10
                    : 15
            );


            triangle.remove();

            triangles.splice(
                i,
                1
            );

            continue;

        }


        /*
         * Desaparecer fuera
         */

        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            triangle.remove();

            triangles.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   COLISIONES
===================================================== */

function checkCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        const bullet =
            bullets[b];


        for (
            let f = friends.length - 1;
            f >= 0;
            f--
        ) {

            const friend =
                friends[f];


            if (
                !friend.parentNode
            ) {
                continue;
            }


            const bulletX =
                parseFloat(
                    bullet.dataset.x
                );

            const bulletY =
                parseFloat(
                    bullet.dataset.y
                );


            const friendX =
                parseFloat(
                    friend.dataset.x
                );

            const friendY =
                parseFloat(
                    friend.dataset.y
                );


            const distance =
                Math.sqrt(
                    Math.pow(
                        bulletX -
                        friendX,
                        2
                    )
                    +
                    Math.pow(
                        bulletY -
                        friendY,
                        2
                    )
                );


            if (
                distance < 8
            ) {

                hitFriend(
                    friend,
                    bullet
                );

                break;

            }

        }

    }

}



/* =====================================================
   GOLPE FRIEND
===================================================== */

function hitFriend(
    friend,
    bullet
) {

    const index =
        bullets.indexOf(
            bullet
        );


    if (
        index !== -1
    ) {

        bullets.splice(
            index,
            1
        );

    }


    bullet.remove();


    let hp =
        parseInt(
            friend.dataset.hp
        );


    hp -=
        10;


    friend.dataset.hp =
        hp;


    friend.classList.add(
        "hit"
    );


    setTimeout(
        function() {

            friend.classList.remove(
                "hit"
            );

        },
        120
    );


    if (
        hp <= 0
    ) {

        killFriend(
            friend
        );

    }

}



/* =====================================================
   MATAR FRIEND
===================================================== */

function killFriend(
    friend
) {

    friendLaugh.currentTime =
        0;

    friendLaugh.volume =
        0.20;

    friendLaugh.play()
        .catch(
            function() {}
        );


    kills++;

    totalKills++;


    localStorage.setItem(
        "friendTotalKills",
        totalKills
    );


    updateHUD();


    const index =
        friends.indexOf(
            friend
        );


    if (
        index !== -1
    ) {

        friends.splice(
            index,
            1
        );

    }


    friend.remove();


    checkAchievements();

}



/* =====================================================
   DAÑO
===================================================== */

function damagePlayer(
    amount
) {

    if (
        !gameRunning ||
        damageCooldown
    ) {

        return;

    }


    damageCooldown =
        true;


    playerHP -=
        amount;


    playerHP =
        Math.max(
            0,
            playerHP
        );


    updateHUD();


    player.classList.remove(
        "playerHit"
    );


    void player.offsetWidth;


    player.classList.add(
        "playerHit"
    );


    setTimeout(
        function() {

            player.classList.remove(
                "playerHit"
            );

            damageCooldown =
                false;

        },
        300
    );


    if (
        playerHP <= 0
    ) {

        gameOver();

    }

}



/* =====================================================
   POWER UPS
===================================================== */

function spawnPowerUp() {

    const power =
        document.createElement(
            "img"
        );


    const isGreen =
        Math.random() < 0.5;


    if (
        isGreen
    ) {

        power.src =
            "pipis-green.gif";

        power.className =
            "powerUp greenPower";

        power.dataset.type =
            "heal";

    } else {

        power.src =
            "pipis-glitch.gif";

        power.className =
            "powerUp glitchPower";

        power.dataset.type =
            "triple";

    }


    power.style.left =
        (
            Math.random() *
            80 +
            10
        ) + "%";


    power.style.top =
        (
            Math.random() *
            65 +
            10
        ) + "%";


    pipisContainer.appendChild(
        power
    );


    const check =
        setInterval(
            function() {

                if (
                    !gameRunning ||
                    !power.parentNode
                ) {

                    clearInterval(
                        check
                    );

                    return;

                }


                const x =
                    parseFloat(
                        power.style.left
                    );

                const y =
                    parseFloat(
                        power.style.top
                    );


                const distance =
                    Math.sqrt(
                        Math.pow(
                            playerX - x,
                            2
                        )
                        +
                        Math.pow(
                            playerY - y,
                            2
                        )
                    );


                if (
                    distance < 8
                ) {

                    collectPowerUp(
                        power
                    );

                    clearInterval(
                        check
                    );

                }

            },
            50
        );


    setTimeout(
        function() {

            clearInterval(
                check
            );

            if (
                power.parentNode
            ) {

                power.remove();

            }

        },
        10000
    );

}



/* =====================================================
   RECOGER POWER UP
===================================================== */

function collectPowerUp(
    power
) {

    const type =
        power.dataset.type;


    if (
        type === "heal"
    ) {

        playerHP +=
            10;


        playerHP =
            Math.min(
                MAX_HP,
                playerHP
            );


        powerUpText.textContent =
            "+10 HP";

    }


    if (
        type === "triple"
    ) {

        tripleShot =
            true;


        powerUpText.textContent =
            "TRIPLE PIPIS";

    }


    updateHUD();


    power.remove();


    setTimeout(
        function() {

            powerUpText.textContent =
                tripleShot
                    ? "TRIPLE PIPIS"
                    : "NONE";

        },
        5000
    );

}



/* =====================================================
   LOGROS
===================================================== */

function checkAchievements() {

    /*
     * BERDLY
     */

    if (
        totalKills >= 100 &&
        localStorage.getItem(
            "friendAchievementBerdly"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievementBerdly",
            "true"
        );


        showAchievement(
            "BERDLY DESBLOQUEADO!",
            "berdly"
        );

    }


    /*
     * SUSIE
     */

    if (
        totalKills >= 1000 &&
        localStorage.getItem(
            "friendAchievementSusie"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievementSusie",
            "true"
        );


        showAchievement(
            "SUSIE DESBLOQUEADA!",
            "susie"
        );

    }


    /*
     * NOELLE
     */

    if (
        totalKills >= 10000 &&
        localStorage.getItem(
            "friendAchievementNoelle"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievementNoelle",
            "true"
        );


        showAchievement(
            "NOELLE DESBLOQUEADA!",
            "noelle"
        );

    }

}



/* =====================================================
   POPUP LOGRO
===================================================== */

function showAchievement(
    message,
    type
) {

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "achievementPopup";


    const title =
        document.createElement(
            "div"
        );


    title.textContent =
        message;


    box.appendChild(
        title
    );


    let image =
        "";


    if (
        type === "berdly"
    ) {

        image =
            "berdly.gif";

    }


    if (
        type === "susie"
    ) {

        image =
            "susie-eating-pancakes.gif";

    }


    if (
        type === "noelle"
    ) {

        image =
            "noelle.gif";

    }


    if (image) {

        const img =
            document.createElement(
                "img"
            );


        img.src =
            image;

        img.className =
            "achievementImage";


        box.appendChild(
            img
        );

    }


    document.body.appendChild(
        box
    );


    requestAnimationFrame(
        function() {

            box.classList.add(
                "show"
            );

        }
    );


    setTimeout(
        function() {

            box.classList.remove(
                "show"
            );


            setTimeout(
                function() {

                    box.remove();

                },
                500
            );

        },
        5000
    );

}



/* =====================================================
   EVENTO
===================================================== */

let eventMessageTimeout =
    null;


function showEvent(
    message
) {

    eventMessage.textContent =
        message;


    eventMessage.classList.add(
        "show"
    );


    clearTimeout(
        eventMessageTimeout
    );


    eventMessageTimeout =
        setTimeout(
            function() {

                eventMessage.classList.remove(
                    "show"
                );

            },
            2500
        );

}



/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    const minutes =
        Math.floor(
            gameTime / 60
        );


    const seconds =
        gameTime % 60;


    timerText.textContent =
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":"
        +
        String(seconds)
            .padStart(
                2,
                "0"
            );

}



/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );

    clearInterval(
        eventInterval
    );

    clearTimeout(
        spawnTimeout
    );


    cancelAnimationFrame(
        gameLoopId
    );


    gameMusic.pause();


    showEvent(
        "GAME OVER"
    );


    setTimeout(
        function() {

            game.style.display =
                "none";


            startScreen.style.display =
                "flex";


            updateHUD();

        },
        2000
    );

}



/* =====================================================
   JOYSTICK
===================================================== */

function updateJoystick(
    event
) {

    const rect =
        joystickBase.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let x =
        event.clientX -
        centerX;


    let y =
        event.clientY -
        centerY;


    const max =
        rect.width / 2 -
        20;


    const distance =
        Math.sqrt(
            x * x +
            y * y
        );


    if (
        distance > max
    ) {

        x =
            x /
            distance *
            max;

        y =
            y /
            distance *
            max;

    }


    joystickX =
        x / max;

    joystickY =
        y / max;


    joystickKnob.style.transform =
        `translate(${x}px, ${y}px)`;

}



/* =====================================================
   JOYSTICK MOUSE + TOUCH
===================================================== */

joystickBase.addEventListener(
    "pointerdown",
    function(event) {

        joystickActive =
            true;

        joystickBase.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event
        );

    }
);


joystickBase.addEventListener(
    "pointermove",
    function(event) {

        if (
            !joystickActive
        ) {
            return;
        }

        updateJoystick(
            event
        );

    }
);


function stopJoystick() {

    joystickActive =
        false;

    joystickX =
        0;

    joystickY =
        0;

    joystickKnob.style.transform =
        "translate(0, 0)";

}


joystickBase.addEventListener(
    "pointerup",
    stopJoystick
);

joystickBase.addEventListener(
    "pointercancel",
    stopJoystick
);

joystickBase.addEventListener(
    "pointerleave",
    function() {

        if (
            joystickActive
        ) {

            stopJoystick();

        }

    }
);



/* =====================================================
   BOTÓN FIRE
===================================================== */

fireButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        shoot();

    }
);



/* =====================================================
   INICIO
===================================================== */

updateHUD();

resetPlayerPosition();

</script>
