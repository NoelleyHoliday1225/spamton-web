<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>FRIEND DESTROYER</title>

    <link
        rel="stylesheet"
        href="friend-destroyer.css"
    >

</head>


<body>


<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="warning">
            !!! WARNING !!!
        </div>

        <h1>
            FRIEND DESTROYER
        </h1>

        <p>
            DESTROY THEM ALL.
        </p>

        <p>
            W A S D = MOVE
        </p>

        <p>
            MOUSE / JOYSTICK = AIM
        </p>

        <p>
            Z / FIRE BUTTON = SHOOT
        </p>

        <div class="startStats">

            TOTAL KILLS:
            <span id="startTotalKills">
                0
            </span>

        </div>

        <button
            id="startButton"
            type="button"
        >
            [ START GAME ]
        </button>

        <br>
        <br>

        <a
            href="index.html"
            class="backButton"
        >
            [ BACK TO SPAMTON SHOP ]
        </a>

    </div>

</div>



<!-- =====================================================
     JUEGO
===================================================== -->

<div id="game">


    <!-- =================================================
         SALIR
    ================================================== -->

    <button
        id="exitGameButton"
        type="button"
    >
        [ EXIT ]
    </button>



    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">

        <div class="hudBox">

            HP:

            <span id="playerHP">
                450
            </span>

            / 450

        </div>


        <div class="hudBox">

            KILLS:

            <span id="killCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TOTAL:

            <span id="totalKillCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TIME:

            <span id="timer">
                00:00
            </span>

        </div>

    </div>



    <!-- =================================================
         ÁREA DEL JUEGO
    ================================================== -->

    <div id="gameArea">

        <div id="platform"></div>

        <img
            src="spamton-gun-game.gif"
            id="player"
            alt="Spamton"
        >

        <div id="friends"></div>

        <div id="bullets"></div>

        <div id="triangles"></div>

        <div id="powerUps"></div>

    </div>



    <!-- =================================================
         JOYSTICK
    ================================================== -->

    <div id="mobileControls">

        <div
            id="joystick"
            class="joystick"
        >

            <div
                id="joystickStick"
                class="joystickStick"
            ></div>

        </div>


        <button
            id="fireButton"
            type="button"
        >
            PIPIS
        </button>

    </div>



    <!-- =================================================
         MENSAJES
    ================================================== -->

    <div id="eventMessage"></div>

</div>



<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="gameMusic"
    src="big-shot.mp3"
    loop
    preload="auto"
></audio>


<audio
    id="friendLaugh"
    src="friend-laugh.mp3"
    preload="auto"
></audio>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const game =
    document.getElementById("game");

const gameArea =
    document.getElementById("gameArea");

const player =
    document.getElementById("player");

const friendsContainer =
    document.getElementById("friends");

const bulletsContainer =
    document.getElementById("bullets");

const trianglesContainer =
    document.getElementById("triangles");

const powerUpsContainer =
    document.getElementById("powerUps");

const playerHPText =
    document.getElementById("playerHP");

const killCounterText =
    document.getElementById("killCounter");

const totalKillCounterText =
    document.getElementById("totalKillCounter");

const startTotalKillsText =
    document.getElementById("startTotalKills");

const timerText =
    document.getElementById("timer");

const eventMessage =
    document.getElementById("eventMessage");

const gameMusic =
    document.getElementById("gameMusic");

const friendLaugh =
    document.getElementById("friendLaugh");

const joystick =
    document.getElementById("joystick");

const joystickStick =
    document.getElementById("joystickStick");

const fireButton =
    document.getElementById("fireButton");



/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MAX_HP = 450;

const PLAYER_SPEED = 0.42;

const BULLET_SPEED = 1.45;

const FRIEND_DAMAGE = 10;

const RED_DAMAGE = 15;

const GLITCH_DAMAGE = 20;

const NORMAL_FRIEND_SPEED = 0.032;

const RED_FRIEND_SPEED = 0.052;

const GLITCH_FRIEND_SPEED = 0.075;

const BOSS_SPEED = 0.018;



/* =====================================================
   ESTADO
===================================================== */

let playerHP =
    MAX_HP;

let kills =
    0;

let totalKills =
    parseInt(
        localStorage.getItem(
            "friendTotalKills"
        )
    ) || 0;

let gameRunning =
    false;

let gameTime =
    0;

let timerInterval =
    null;

let spawnTimeout =
    null;

let gameLoopId =
    null;

let eventInterval =
    null;

let keys =
    {};

let bullets =
    [];

let friends =
    [];

let triangles =
    [];

let powerUps =
    [];

let bossActive =
    false;

let lastTime =
    0;

let playerX =
    50;

let playerY =
    75;

let aimX =
    0;

let aimY =
    -1;

let shooting =
    false;

let shootCooldown =
    false;

let joystickActive =
    false;



/* =====================================================
   POSICIÓN
===================================================== */

function resetPlayerPosition() {

    playerX = 50;

    playerY = 70;

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}



/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    playerHPText.textContent =
        Math.max(
            0,
            Math.floor(playerHP)
        );

    killCounterText.textContent =
        kills;

    totalKillCounterText.textContent =
        totalKills;

    startTotalKillsText.textContent =
        totalKills;

}



/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] =
            true;


        if (
            key === "z" &&
            gameRunning
        ) {

            shoot();

        }


        if (
            [
                "w",
                "a",
                "s",
                "d",
                "z"
            ].includes(key)
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] =
            false;

    }
);



/* =====================================================
   INICIAR
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);



function startGame() {

    clearGame();


    startScreen.style.display =
        "none";

    game.style.display =
        "block";


    gameRunning =
        true;

    playerHP =
        MAX_HP;

    kills =
        0;

    gameTime =
        0;

    bossActive =
        false;


    aimX =
        0;

    aimY =
        -1;


    resetPlayerPosition();

    updateHUD();


    gameMusic.volume =
        0.40;

    gameMusic.currentTime =
        0;

    gameMusic.play()
        .catch(
            function() {}
        );


    timerInterval =
        setInterval(
            function() {

                if (!gameRunning)
                    return;

                gameTime++;

                updateTimer();

            },
            1000
        );


    scheduleFriendSpawn();


    eventInterval =
        setInterval(
            function() {

                if (!gameRunning)
                    return;


                if (
                    Math.random() <
                    0.18
                ) {

                    spawnPowerUp();

                }

            },
            12000
        );


    lastTime =
        performance.now();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   SALIR
===================================================== */

exitGameButton.addEventListener(
    "click",
    exitGame
);


function exitGame() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );

    clearInterval(
        eventInterval
    );

    clearTimeout(
        spawnTimeout
    );


    gameMusic.pause();

    gameMusic.currentTime =
        0;


    clearGame();


    game.style.display =
        "none";

    startScreen.style.display =
        "flex";


    updateHUD();

}



/* =====================================================
   LIMPIAR
===================================================== */

function clearGame() {

    clearTimeout(
        spawnTimeout
    );


    friends.forEach(
        friend => {

            if (
                friend.parentNode
            )
                friend.remove();

        }
    );


    bullets.forEach(
        bullet => {

            if (
                bullet.parentNode
            )
                bullet.remove();

        }
    );


    triangles.forEach(
        triangle => {

            if (
                triangle.parentNode
            )
                triangle.remove();

        }
    );


    powerUps.forEach(
        powerUp => {

            if (
                powerUp.parentNode
            )
                powerUp.remove();

        }
    );


    friends =
        [];

    bullets =
        [];

    triangles =
        [];

    powerUps =
        [];

}



/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (!gameRunning)
        return;


    const delta =
        time - lastTime;


    lastTime =
        time;


    movePlayer();

    updateBullets();

    updateFriends();

    updateTriangles();

    checkCollisions();

    checkPowerUps();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   MOVIMIENTO
===================================================== */

function movePlayer() {

    let dx =
        0;

    let dy =
        0;


    if (keys["w"])
        dy--;

    if (keys["s"])
        dy++;

    if (keys["a"])
        dx--;

    if (keys["d"])
        dx++;


    /*
     * Joystick
     */

    if (joystickActive) {

        dx =
            joystickDX;

        dy =
            joystickDY;

    }


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length > 0) {

        dx /=
            length;

        dy /=
            length;


        playerX +=
            dx *
            PLAYER_SPEED;

        playerY +=
            dy *
            PLAYER_SPEED;

    }


    playerX =
        Math.max(
            5,
            Math.min(
                95,
                playerX
            )
        );


    playerY =
        Math.max(
            8,
            Math.min(
                90,
                playerY
            )
        );


    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}



/* =====================================================
   JOYSTICK
===================================================== */

let joystickDX =
    0;

let joystickDY =
    0;


function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;


    const radius =
        rect.width / 2;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance >
        radius
    ) {

        dx =
            dx /
            distance *
            radius;

        dy =
            dy /
            distance *
            radius;

    }


    joystickDX =
        dx /
        radius;

    joystickDY =
        dy /
        radius;


    joystickStick.style.transform =
        `translate(${dx}px, ${dy}px)`;


    /*
     * El joystick también apunta
     */

    if (
        distance >
        8
    ) {

        aimX =
            joystickDX;

        aimY =
            joystickDY;

    }

}


joystick.addEventListener(
    "pointerdown",
    function(event) {

        joystickActive =
            true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",
    function(event) {

        if (!joystickActive)
            return;

        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


function releaseJoystick() {

    joystickActive =
        false;

    joystickDX =
        0;

    joystickDY =
        0;

    joystickStick.style.transform =
        "translate(0px, 0px)";

}


joystick.addEventListener(
    "pointerup",
    releaseJoystick
);


joystick.addEventListener(
    "pointercancel",
    releaseJoystick
);



/* =====================================================
   DISPARO
===================================================== */

fireButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        shooting =
            true;

        shoot();

    }
);


fireButton.addEventListener(
    "pointerup",
    function() {

        shooting =
            false;

    }
);


fireButton.addEventListener(
    "pointercancel",
    function() {

        shooting =
            false;

    }
);



/* =====================================================
   DISPARAR PIPIS
===================================================== */

function shoot() {

    if (
        !gameRunning ||
        shootCooldown
    )
        return;


    shootCooldown =
        true;


    setTimeout(
        function() {

            shootCooldown =
                false;

        },
        120
    );


    /*
     * Si no hay dirección,
     * dispara hacia arriba.
     */

    let dx =
        aimX;

    let dy =
        aimY;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length === 0) {

        dx = 0;
        dy = -1;

    }
    else {

        dx /=
            length;

        dy /=
            length;

    }


    /*
     * Power-up triple
     */

    const angles =
        tripleShot
            ? [-0.20, 0, 0.20]
            : [0];


    angles.forEach(
        angle => {

            const cos =
                Math.cos(angle);

            const sin =
                Math.sin(angle);


            const shotX =
                dx * cos -
                dy * sin;

            const shotY =
                dx * sin +
                dy * cos;


            createBullet(
                shotX,
                shotY
            );

        }
    );

}



/* =====================================================
   TRIPLE SHOT
===================================================== */

let tripleShot =
    false;


function createBullet(
    dx,
    dy
) {

    const bullet =
        document.createElement(
            "img"
        );


    bullet.src =
        "pipis.gif";


    bullet.className =
        "bullet";


    bullet.dataset.x =
        playerX;

    bullet.dataset.y =
        playerY;


    bullet.dataset.dx =
        dx;

    bullet.dataset.dy =
        dy;


    bullet.style.left =
        playerX + "%";

    bullet.style.top =
        playerY + "%";


    bulletsContainer.appendChild(
        bullet
    );


    bullets.push(
        bullet
    );

}



/* =====================================================
   ACTUALIZAR BALAS
===================================================== */

function updateBullets() {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];


        let x =
            parseFloat(
                bullet.dataset.x
            );

        let y =
            parseFloat(
                bullet.dataset.y
            );


        const dx =
            parseFloat(
                bullet.dataset.dx
            );

        const dy =
            parseFloat(
                bullet.dataset.dy
            );


        x +=
            dx *
            BULLET_SPEED;

        y +=
            dy *
            BULLET_SPEED;


        bullet.dataset.x =
            x;

        bullet.dataset.y =
            y;


        bullet.style.left =
            x + "%";

        bullet.style.top =
            y + "%";


        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            bullet.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   SPAWN FRIEND
===================================================== */

function scheduleFriendSpawn() {

    if (!gameRunning)
        return;


    const delay =
        Math.random() *
        1400 +
        700;


    spawnTimeout =
        setTimeout(
            function() {

                if (!gameRunning)
                    return;


                spawnFriend();

                scheduleFriendSpawn();

            },
            delay
        );

}



/* =====================================================
   CREAR FRIEND DESDE EL BORDE
===================================================== */

function spawnFriend() {

    if (!gameRunning)
        return;


    let type =
        "normal";


    if (
        kills >= 100
    ) {

        const chance =
            Math.random();


        if (
            chance < 0.18
        ) {

            type =
                "glitch";

        }
        else if (
            chance < 0.45
        ) {

            type =
                "red";

        }

    }


    const friend =
        document.createElement(
            "img"
        );


    friend.src =
        "friend-sprite.gif";


    friend.className =
        "friend friend-" +
        type;


    /*
     * ENTRADA DESDE EL BORDE
     */

    const side =
        Math.floor(
            Math.random() *
            4
        );


    let x;
    let y;


    if (side === 0) {

        x =
            -8;

        y =
            Math.random() *
            80 +
            10;

    }

    else if (side === 1) {

        x =
            108;

        y =
            Math.random() *
            80 +
            10;

    }

    else if (side === 2) {

        x =
            Math.random() *
            80 +
            10;

        y =
            -8;

    }

    else {

        x =
            Math.random() *
            80 +
            10;

        y =
            108;

    }


    friend.style.left =
        x + "%";

    friend.style.top =
        y + "%";


    let hp =
        20;


    if (
        type === "red"
    )
        hp = 45;


    if (
        type === "glitch"
    )
        hp = 70;


    friend.dataset.hp =
        hp;

    friend.dataset.x =
        x;

    friend.dataset.y =
        y;

    friend.dataset.type =
        type;


    friendsContainer.appendChild(
        friend
    );


    friends.push(
        friend
    );


    /*
     * Boss
     */

    if (
        kills >= 100 &&
        !bossActive
    ) {

        spawnBoss();

    }

}



/* =====================================================
   BOSS
===================================================== */

function spawnBoss() {

    if (bossActive)
        return;


    bossActive =
        true;


    showEvent(
        "!!! BOSS FRIEND !!!"
    );


    const boss =
        document.createElement(
            "img"
        );


    boss.src =
        "friend-sprite.gif";


    boss.className =
        "friend boss";


    boss.style.left =
        "-12%";

    boss.style.top =
        "25%";


    boss.dataset.hp =
        500;

    boss.dataset.x =
        -12;

    boss.dataset.y =
        25;

    boss.dataset.type =
        "boss";


    friendsContainer.appendChild(
        boss
    );


    friends.push(
        boss
    );

}



/* =====================================================
   FRIENDS
===================================================== */

function updateFriends() {

    for (
        let i =
            friends.length - 1;

        i >= 0;

        i--
    ) {

        const friend =
            friends[i];


        if (
            !friend.parentNode
        ) {

            friends.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                friend.dataset.x
            );

        let y =
            parseFloat(
                friend.dataset.y
            );


        const type =
            friend.dataset.type;


        const dx =
            playerX -
            x;

        const dy =
            playerY -
            y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        let speed =
            NORMAL_FRIEND_SPEED;


        if (
            type === "red"
        )
            speed =
                RED_FRIEND_SPEED;


        if (
            type === "glitch"
        )
            speed =
                GLITCH_FRIEND_SPEED;


        if (
            type === "boss"
        )
            speed =
                BOSS_SPEED;


        if (
            distance > 4
        ) {

            x +=
                dx /
                distance *
                speed;

            y +=
                dy /
                distance *
                speed;

        }
        else {

            let damage =
                FRIEND_DAMAGE;


            if (
                type === "red"
            )
                damage =
                    RED_DAMAGE;


            if (
                type === "glitch"
            )
                damage =
                    GLITCH_DAMAGE;


            if (
                type === "boss"
            )
                damage =
                    10;


            damagePlayer(
                damage
            );

        }


        friend.dataset.x =
            x;

        friend.dataset.y =
            y;


        friend.style.left =
            x + "%";

        friend.style.top =
            y + "%";


        /*
         * GLITCH FRIEND
         * PEQUEÑAS COLAS
         */

        if (
            type === "glitch" &&
            Math.random() <
            0.025
        ) {

            spawnGlitchTail(
                x,
                y
            );

        }


        /*
         * BOSS
         */

        if (
            type === "boss" &&
            Math.random() <
            0.018
        ) {

            spawnTriangle(
                x,
                y
            );

        }

    }

}



/* =====================================================
   COLA GLITCH
===================================================== */

function spawnGlitchTail(
    x,
    y
) {

    const tail =
        document.createElement(
            "div"
        );


    tail.className =
        "glitchTail";


    tail.style.left =
        x + "%";

    tail.style.top =
        y + "%";


    tail.dataset.life =
        50;


    trianglesContainer.appendChild(
        tail
    );


    setTimeout(
        function() {

            if (
                tail.parentNode
            )
                tail.remove();

        },
        500
    );

}



/* =====================================================
   TRIÁNGULOS
===================================================== */

function spawnTriangle(
    x,
    y
) {

    const triangle =
        document.createElement(
            "div"
        );


    triangle.className =
        "triangle";


    triangle.style.left =
        x + "%";

    triangle.style.top =
        y + "%";


    /*
     * Dirección al momento
     * de disparar.
     *
     * Después NO cambia.
     */

    let dx =
        playerX -
        x;

    let dy =
        playerY -
        y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance === 0
    ) {

        dx = 0;
        dy = 1;

    }
    else {

        dx /=
            distance;

        dy /=
            distance;

    }


    triangle.dataset.x =
        x;

    triangle.dataset.y =
        y;

    triangle.dataset.dx =
        dx;

    triangle.dataset.dy =
        dy;


    trianglesContainer.appendChild(
        triangle
    );


    triangles.push(
        triangle
    );

}



/* =====================================================
   ACTUALIZAR TRIÁNGULOS
===================================================== */

function updateTriangles() {

    for (
        let i =
            triangles.length - 1;

        i >= 0;

        i--
    ) {

        const triangle =
            triangles[i];


        if (
            !triangle.parentNode
        ) {

            triangles.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                triangle.dataset.x
            );

        let y =
            parseFloat(
                triangle.dataset.y
            );


        const dx =
            parseFloat(
                triangle.dataset.dx
            );

        const dy =
            parseFloat(
                triangle.dataset.dy
            );


        x +=
            dx *
            0.75;

        y +=
            dy *
            0.75;


        triangle.dataset.x =
            x;

        triangle.dataset.y =
            y;


        triangle.style.left =
            x + "%";

        triangle.style.top =
            y + "%";


        /*
         * Desaparece
         */

        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            triangle.remove();

            triangles.splice(
                i,
                1
            );

            continue;

        }


        const distance =
            Math.sqrt(
                Math.pow(
                    playerX - x,
                    2
                )
                +
                Math.pow(
                    playerY - y,
                    2
                )
            );


        if (
            distance < 4
        ) {

            damagePlayer(
                15
            );


            triangle.remove();

            triangles.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   COLISIONES
===================================================== */

function checkCollisions() {

    for (
        let b =
            bullets.length - 1;

        b >= 0;

        b--
    ) {

        const bullet =
            bullets[b];


        if (
            !bullet.parentNode
        ) {

            bullets.splice(
                b,
                1
            );

            continue;

        }


        const bulletX =
            parseFloat(
                bullet.dataset.x
            );

        const bulletY =
            parseFloat(
                bullet.dataset.y
            );


        for (
            let f =
                friends.length - 1;

            f >= 0;

            f--
        ) {

            const friend =
                friends[f];


            if (
                !friend.parentNode
            ) {

                friends.splice(
                    f,
                    1
                );

                continue;

            }


            const friendX =
                parseFloat(
                    friend.dataset.x
                );

            const friendY =
                parseFloat(
                    friend.dataset.y
                );


            const distance =
                Math.sqrt(
                    Math.pow(
                        bulletX -
                        friendX,
                        2
                    )
                    +
                    Math.pow(
                        bulletY -
                        friendY,
                        2
                    )
                );


            if (
                distance <
                7
            ) {

                hitFriend(
                    friend,
                    bullet
                );

                break;

            }

        }

    }

}



/* =====================================================
   HIT FRIEND
===================================================== */

function hitFriend(
    friend,
    bullet
) {

    const index =
        bullets.indexOf(
            bullet
        );


    if (
        index !== -1
    ) {

        bullets.splice(
            index,
            1
        );

    }


    bullet.remove();


    let hp =
        parseInt(
            friend.dataset.hp
        );


    hp -=
        10;


    friend.dataset.hp =
        hp;


    friend.classList.add(
        "hit"
    );


    setTimeout(
        function() {

            friend.classList.remove(
                "hit"
            );

        },
        100
    );


    if (
        hp <= 0
    ) {

        killFriend(
            friend
        );

    }

}



/* =====================================================
   MATAR
===================================================== */

function killFriend(
    friend
) {

    friendLaugh.currentTime =
        0;

    friendLaugh.volume =
        0.20;


    friendLaugh.play()
        .catch(
            function() {}
        );


    kills++;

    totalKills++;


    localStorage.setItem(
        "friendTotalKills",
        totalKills
    );


    updateHUD();


    const index =
        friends.indexOf(
            friend
        );


    if (
        index !== -1
    ) {

        friends.splice(
            index,
            1
        );

    }


    friend.remove();


    checkAchievements();

}



/* =====================================================
   DAÑO
===================================================== */

let damageCooldown =
    false;


function damagePlayer(
    amount
) {

    if (
        !gameRunning ||
        damageCooldown
    )
        return;


    damageCooldown =
        true;


    playerHP -=
        amount;


    playerHP =
        Math.max(
            0,
            playerHP
        );


    updateHUD();


    player.classList.remove(
        "playerHit"
    );


    void player.offsetWidth;


    player.classList.add(
        "playerHit"
    );


    setTimeout(
        function() {

            player.classList.remove(
                "playerHit"
            );

        },
        250
    );


    /*
     * Cooldown 3 segundos
     */

    setTimeout(
        function() {

            damageCooldown =
                false;

        },
        3000
    );


    if (
        playerHP <= 0
    ) {

        gameOver();

    }

}



/* =====================================================
   POWER UPS
===================================================== */

function spawnPowerUp() {

    if (!gameRunning)
        return;


    const powerUp =
        document.createElement(
            "img"
        );


    /*
     * Utilizamos pipis.gif
     * pero mediante CSS se transforma.
     */

    powerUp.src =
        "pipis.gif";


    const isTriple =
        Math.random() <
        0.50;


    powerUp.className =
        isTriple
            ? "powerUp powerUpGlitch"
            : "powerUp powerUpGreen";


    powerUp.dataset.type =
        isTriple
            ? "triple"
            : "heal";


    const x =
        Math.random() *
        80 +
        10;

    const y =
        Math.random() *
        70 +
        10;


    powerUp.style.left =
        x + "%";

    powerUp.style.top =
        y + "%";


    powerUp.dataset.x =
        x;

    powerUp.dataset.y =
        y;


    powerUpsContainer.appendChild(
        powerUp
    );


    powerUps.push(
        powerUp
    );


    setTimeout(
        function() {

            const index =
                powerUps.indexOf(
                    powerUp
                );


            if (
                index !== -1
            ) {

                powerUps.splice(
                    index,
                    1
                );

            }


            if (
                powerUp.parentNode
            )
                powerUp.remove();

        },
        10000
    );

}



/* =====================================================
   POWER UP COLLISION
===================================================== */

function checkPowerUps() {

    for (
        let i =
            powerUps.length - 1;

        i >= 0;

        i--
    ) {

        const powerUp =
            powerUps[i];


        const x =
            parseFloat(
                powerUp.dataset.x
            );

        const y =
            parseFloat(
                powerUp.dataset.y
            );


        const distance =
            Math.sqrt(
                Math.pow(
                    playerX - x,
                    2
                )
                +
                Math.pow(
                    playerY - y,
                    2
                )
            );


        if (
            distance < 7
        ) {

            const type =
                powerUp.dataset.type;


            if (
                type === "heal"
            ) {

                playerHP +=
                    10;


                if (
                    playerHP >
                    MAX_HP
                ) {

                    playerHP =
                        MAX_HP;

                }


                showEvent(
                    "+10 HP !!!"
                );

            }
            else {

                tripleShot =
                    true;


                showEvent(
                    "!!! GLITCH PIPIS: TRIPLE SHOT !!!"
                );


                setTimeout(
                    function() {

                        tripleShot =
                            false;

                    },
                    10000
                );

            }


            powerUp.remove();

            powerUps.splice(
                i,
                1
            );


            updateHUD();

        }

    }

}



/* =====================================================
   LOGROS
===================================================== */

function checkAchievements() {

    if (
        totalKills >= 100 &&
        localStorage.getItem(
            "friendAchievementBerdly"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievementBerdly",
            "true"
        );


        /*
         * Compatibilidad con
         * nombres anteriores.
         */

        localStorage.setItem(
            "friendAchievement100",
            "true"
        );


        showAchievement(
            "BERDLY DESBLOQUEADO!",
            "berdly"
        );

    }


    if (
        totalKills >= 1000 &&
        localStorage.getItem(
            "friendAchievementSusie"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievementSusie",
            "true"
        );


        localStorage.setItem(
            "friendAchievement1000",
            "true"
        );


        showAchievement(
            "SUSIE DESBLOQUEADA!",
            "susie"
        );

    }


    if (
        totalKills >= 10000 &&
        localStorage.getItem(
            "friendAchievementNoelle"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievementNoelle",
            "true"
        );


        localStorage.setItem(
            "friendAchievement10000",
            "true"
        );


        showAchievement(
            "NOELLE DESBLOQUEADA!",
            "noelle"
        );

    }

}



/* =====================================================
   POPUP LOGRO
===================================================== */

function showAchievement(
    message,
    character
) {

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "achievementPopup";


    const title =
        document.createElement(
            "div"
        );


    title.textContent =
        message;


    box.appendChild(
        title
    );


    const image =
        document.createElement(
            "img"
        );


    /*
     * Usa imágenes si existen.
     * Si no existen, el texto
     * igualmente funciona.
     */

    if (
        character === "susie"
    ) {

        image.src =
            "susie-eating-pancakes.gif";

    }


    if (
        character === "berdly"
    ) {

        image.src =
            "berdly.gif";

    }


    if (
        character === "noelle"
    ) {

        image.src =
            "noelle.gif";

    }


    image.className =
        "achievementCharacter";


    image.onerror =
        function() {

            image.remove();

        };


    box.appendChild(
        image
    );


    document.body.appendChild(
        box
    );


    requestAnimationFrame(
        function() {

            box.classList.add(
                "show"
            );

        }
    );


    setTimeout(
        function() {

            box.classList.remove(
                "show"
            );


            setTimeout(
                function() {

                    box.remove();

                },
                400
            );

        },
        4500
    );

}



/* =====================================================
   EVENTO
===================================================== */

let eventTimeout =
    null;


function showEvent(
    message
) {

    eventMessage.textContent =
        message;


    eventMessage.classList.add(
        "show"
    );


    clearTimeout(
        eventTimeout
    );


    eventTimeout =
        setTimeout(
            function() {

                eventMessage.classList.remove(
                    "show"
                );

            },
            2000
        );

}



/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    const minutes =
        Math.floor(
            gameTime /
            60
        );


    const seconds =
        gameTime %
        60;


    timerText.textContent =
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":"
        +
        String(seconds)
            .padStart(
                2,
                "0"
            );

}



/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );

    clearInterval(
        eventInterval
    );

    clearTimeout(
        spawnTimeout
    );


    gameMusic.pause();


    showEvent(
        "GAME OVER"
    );


    setTimeout(
        function() {

            game.style.display =
                "none";

            startScreen.style.display =
                "flex";


            updateHUD();

        },
        2000
    );

}



/* =====================================================
   INICIALIZACIÓN
===================================================== */

updateHUD();

resetPlayerPosition();

</script>
