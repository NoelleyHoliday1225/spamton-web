<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>FRIEND DESTROYER</title>

    <link
        rel="stylesheet"
        href="friend-destroyer.css"
    >

</head>

<body>


<!-- =====================================================
     INICIO
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="warning">
            !!! WARNING !!!
        </div>

        <h1>
            FRIEND DESTROYER
        </h1>

        <p>
            DESTROY THEM ALL.
        </p>

        <p>
            PC: W A S D + Z
        </p>

        <p>
            MOBILE: JOYSTICK + ATTACK
        </p>

        <div class="startStats">

            TOTAL KILLS:
            <span id="startTotalKills">
                0
            </span>

        </div>

        <button
            id="startButton"
            type="button"
        >
            [ START GAME ]
        </button>

        <br><br>

        <a
            href="index.html"
            class="backButton"
        >
            [ BACK TO SPAMTON SHOP ]
        </a>

    </div>

</div>


<!-- =====================================================
     JUEGO
===================================================== -->

<div id="game">

    <button
        id="exitGameButton"
        type="button"
    >
        [ EXIT ]
    </button>


    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">

        <div class="hudBox">
            HP:
            <span id="playerHP">
                450
            </span>
            / 450
        </div>

        <div class="hudBox">
            KILLS:
            <span id="killCounter">
                0
            </span>
        </div>

        <div class="hudBox">
            TOTAL:
            <span id="totalKillCounter">
                0
            </span>
        </div>

        <div class="hudBox">
            TIME:
            <span id="timer">
                00:00
            </span>
        </div>

    </div>


    <!-- =================================================
         ÁREA
    ================================================== -->

    <div id="gameArea">

        <div id="platform"></div>

        <img
            src="spamton-gun-game.gif"
            id="player"
            alt="Spamton"
        >

        <div id="friends"></div>

        <div id="pipisRain"></div>

        <div id="bullets"></div>

        <div id="triangles"></div>

        <div id="powerUps"></div>

    </div>


    <!-- =================================================
         CONTROLES
    ================================================== -->

    <div id="mobileControls">

        <div id="joystick">

            <div id="joystickKnob"></div>

        </div>

        <button
            id="attackButton"
            type="button"
        >
            PIPIS
        </button>

    </div>


    <div id="eventMessage"></div>

</div>


<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="gameMusic"
    src="big-shot.mp3"
    loop
    preload="auto"
></audio>


<audio
    id="friendLaugh"
    src="friend-laugh.mp3"
    preload="auto"
></audio>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const game =
    document.getElementById("game");

const gameArea =
    document.getElementById("gameArea");

const player =
    document.getElementById("player");

const friendsContainer =
    document.getElementById("friends");

const bulletsContainer =
    document.getElementById("bullets");

const trianglesContainer =
    document.getElementById("triangles");

const powerUpsContainer =
    document.getElementById("powerUps");

const playerHPText =
    document.getElementById("playerHP");

const killCounterText =
    document.getElementById("killCounter");

const totalKillCounterText =
    document.getElementById("totalKillCounter");

const startTotalKillsText =
    document.getElementById("startTotalKills");

const timerText =
    document.getElementById("timer");

const eventMessage =
    document.getElementById("eventMessage");

const gameMusic =
    document.getElementById("gameMusic");

const friendLaugh =
    document.getElementById("friendLaugh");

const attackButton =
    document.getElementById("attackButton");

const joystick =
    document.getElementById("joystick");

const joystickKnob =
    document.getElementById("joystickKnob");


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MAX_HP = 450;

const PLAYER_SPEED = 0.38;

const BULLET_SPEED = 1.8;

const NORMAL_DAMAGE = 10;

const RED_DAMAGE = 15;

const GLITCH_DAMAGE = 20;


/* =====================================================
   ESTADO
===================================================== */

let playerHP = MAX_HP;

let kills = 0;

let totalKills =
    parseInt(
        localStorage.getItem(
            "friendTotalKills"
        )
    ) || 0;

let gameRunning = false;

let gameTime = 0;

let timerInterval = null;

let spawnTimeout = null;

let powerUpTimeout = null;

let eventTimeout = null;

let gameLoopId = null;

let lastTime = 0;

let playerX = 50;

let playerY = 75;

let aimX = 0;

let aimY = -1;

let shootCooldown = false;

let damageCooldown = false;

let bullets = [];

let friends = [];

let triangles = [];

let powerUps = [];

let bossActive = false;

let eventActive = false;

let keys = {};

let joystickActive = false;

let joystickDX = 0;

let joystickDY = 0;


/* =====================================================
   LOGROS
===================================================== */

function saveKills() {

    localStorage.setItem(
        "friendTotalKills",
        totalKills
    );

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    playerHPText.textContent =
        playerHP;

    killCounterText.textContent =
        kills;

    totalKillCounterText.textContent =
        totalKills;

    startTotalKillsText.textContent =
        totalKills;

}


function updateTimer() {

    const minutes =
        Math.floor(
            gameTime / 60
        );

    const seconds =
        gameTime % 60;

    timerText.textContent =
        String(minutes).padStart(2, "0")
        +
        ":"
        +
        String(seconds).padStart(2, "0");

}


/* =====================================================
   POSICIÓN
===================================================== */

function resetPlayerPosition() {

    playerX = 50;

    playerY = 75;

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        if (
            key === "z" &&
            gameRunning
        ) {

            shoot();

        }


        if (
            [
                "w",
                "a",
                "s",
                "d",
                "z"
            ].includes(key)
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);


function startGame() {

    clearGame();

    startScreen.style.display =
        "none";

    game.style.display =
        "block";

    gameRunning =
        true;

    playerHP =
        MAX_HP;

    kills =
        0;

    gameTime =
        0;

    bossActive =
        false;

    eventActive =
        false;

    resetPlayerPosition();

    updateHUD();

    gameMusic.volume =
        0.40;

    gameMusic.currentTime =
        0;

    gameMusic.play()
        .catch(
            function() {}
        );


    timerInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                gameTime++;

                updateTimer();

            },
            1000
        );


    scheduleFriendSpawn();

    schedulePowerUp();

    scheduleEvent();

    lastTime =
        performance.now();

    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   SALIR
===================================================== */

exitGameButton.addEventListener(
    "click",
    exitGame
);


function exitGame() {

    gameRunning =
        false;

    clearInterval(
        timerInterval
    );

    clearTimeout(
        spawnTimeout
    );

    clearTimeout(
        powerUpTimeout
    );

    clearTimeout(
        eventTimeout
    );

    gameMusic.pause();

    gameMusic.currentTime =
        0;

    clearGame();

    window.location.href =
        "index.html";

}


/* =====================================================
   LIMPIAR
===================================================== */

function clearGame() {

    clearTimeout(
        spawnTimeout
    );

    clearTimeout(
        powerUpTimeout
    );

    clearTimeout(
        eventTimeout
    );


    friends.forEach(
        friend => friend.remove()
    );

    bullets.forEach(
        bullet => bullet.remove()
    );

    triangles.forEach(
        triangle => triangle.remove()
    );

    powerUps.forEach(
        powerUp => powerUp.remove()
    );


    friends = [];

    bullets = [];

    triangles = [];

    powerUps = [];

    friendsContainer.innerHTML = "";

    bulletsContainer.innerHTML = "";

    trianglesContainer.innerHTML = "";

    powerUpsContainer.innerHTML = "";

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }

    const delta =
        time - lastTime;

    lastTime =
        time;

    movePlayer();

    updateBullets(delta);

    updateFriends(delta);

    updateTriangles(delta);

    updatePowerUps();

    checkCollisions();

    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   MOVIMIENTO
===================================================== */

function movePlayer() {

    let dx = 0;

    let dy = 0;


    if (keys["w"]) {
        dy -= 1;
    }

    if (keys["s"]) {
        dy += 1;
    }

    if (keys["a"]) {
        dx -= 1;
    }

    if (keys["d"]) {
        dx += 1;
    }


    dx += joystickDX;
    dy += joystickDY;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length > 0) {

        dx /= length;
        dy /= length;


        playerX +=
            dx *
            PLAYER_SPEED;

        playerY +=
            dy *
            PLAYER_SPEED;


        aimX = dx;
        aimY = dy;

    }


    playerX =
        Math.max(
            6,
            Math.min(
                94,
                playerX
            )
        );


    playerY =
        Math.max(
            8,
            Math.min(
                92,
                playerY
            )
        );


    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}


/* =====================================================
   DISPARAR
===================================================== */

function shoot() {

    if (!gameRunning) {
        return;
    }

    if (shootCooldown) {
        return;
    }


    shootCooldown =
        true;


    setTimeout(
        function() {

            shootCooldown =
                false;

        },
        150
    );


    const redPower =
        player.dataset.redPower === "true";


    if (redPower) {

        createBullet(
            aimX,
            aimY
        );

        createBullet(
            rotateVector(
                aimX,
                aimY,
                -0.22
            ).x,
            rotateVector(
                aimX,
                aimY,
                -0.22
            ).y
        );

        createBullet(
            rotateVector(
                aimX,
                aimY,
                0.22
            ).x,
            rotateVector(
                aimX,
                aimY,
                0.22
            ).y
        );

    }

    else {

        createBullet(
            aimX,
            aimY
        );

    }

}


function rotateVector(
    x,
    y,
    angle
) {

    const cos =
        Math.cos(angle);

    const sin =
        Math.sin(angle);

    return {

        x:
            x * cos -
            y * sin,

        y:
            x * sin +
            y * cos

    };

}


function createBullet(
    directionX,
    directionY
) {

    if (
        directionX === 0 &&
        directionY === 0
    ) {

        directionY = -1;

    }


    const bullet =
        document.createElement("img");


    bullet.src =
        "pipis.gif";


    bullet.className =
        "bullet";


    const length =
        Math.sqrt(
            directionX *
            directionX +
            directionY *
            directionY
        );


    directionX /=
        length;

    directionY /=
        length;


    bullet.dataset.x =
        playerX;

    bullet.dataset.y =
        playerY;

    bullet.dataset.dx =
        directionX;

    bullet.dataset.dy =
        directionY;


    bullet.style.left =
        playerX + "%";

    bullet.style.top =
        playerY + "%";


    bulletsContainer.appendChild(
        bullet
    );


    bullets.push(
        bullet
    );

}


/* =====================================================
   BALAS
===================================================== */

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];

        let x =
            parseFloat(
                bullet.dataset.x
            );

        let y =
            parseFloat(
                bullet.dataset.y
            );

        const dx =
            parseFloat(
                bullet.dataset.dx
            );

        const dy =
            parseFloat(
                bullet.dataset.dy
            );


        x +=
            dx *
            BULLET_SPEED;

        y +=
            dy *
            BULLET_SPEED;


        bullet.dataset.x =
            x;

        bullet.dataset.y =
            y;


        bullet.style.left =
            x + "%";

        bullet.style.top =
            y + "%";


        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            bullet.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   SPAWN FRIEND DESDE LOS BORDES
===================================================== */

function scheduleFriendSpawn() {

    if (!gameRunning) {
        return;
    }


    const delay =
        Math.max(
            500,
            Math.random() * 1200 +
            600 -
            Math.min(
                kills * 2,
                400
            )
        );


    spawnTimeout =
        setTimeout(
            function() {

                if (!gameRunning) {
                    return;
                }

                spawnFriend();

                scheduleFriendSpawn();

            },
            delay
        );

}


/* =====================================================
   CREAR FRIEND
===================================================== */

function spawnFriend() {

    const friend =
        document.createElement("img");


    let type =
        "normal";


    const roll =
        Math.random();


    if (
        kills >= 100 &&
        roll < 0.18
    ) {

        type =
            "glitch";

    }

    else if (
        kills >= 50 &&
        roll < 0.38
    ) {

        type =
            "red";

    }


    friend.src =
        "friend-sprite.gif";


    friend.className =
        "friend friend-" +
        type;


    let x;
    let y;


    const side =
        Math.floor(
            Math.random() * 4
        );


    if (side === 0) {

        x =
            -8;

        y =
            Math.random() * 90 +
            5;

    }

    else if (side === 1) {

        x =
            108;

        y =
            Math.random() * 90 +
            5;

    }

    else if (side === 2) {

        x =
            Math.random() * 90 +
            5;

        y =
            -8;

    }

    else {

        x =
            Math.random() * 90 +
            5;

        y =
            108;

    }


    friend.dataset.x =
        x;

    friend.dataset.y =
        y;

    friend.dataset.type =
        type;


    let hp =
        20;

    if (type === "red") {
        hp = 45;
    }

    if (type === "glitch") {
        hp = 70;
    }


    friend.dataset.hp =
        hp;


    friend.style.left =
        x + "%";

    friend.style.top =
        y + "%";


    friendsContainer.appendChild(
        friend
    );

    friends.push(
        friend
    );


    if (
        kills >= 100 &&
        !bossActive
    ) {

        spawnBoss();

    }

}


/* =====================================================
   BOSS
===================================================== */

function spawnBoss() {

    if (bossActive) {
        return;
    }


    bossActive =
        true;


    showEvent(
        "!!! BOSS FRIEND !!!"
    );


    const boss =
        document.createElement("img");


    boss.src =
        "friend-sprite.gif";


    boss.className =
        "friend boss";


    boss.dataset.x =
        50;

    boss.dataset.y =
        -15;

    boss.dataset.type =
        "boss";

    boss.dataset.hp =
        500;


    boss.style.left =
        "50%";

    boss.style.top =
        "-15%";


    friendsContainer.appendChild(
        boss
    );

    friends.push(
        boss
    );

}


/* =====================================================
   FRIENDS
===================================================== */

function updateFriends() {

    for (
        let i = friends.length - 1;
        i >= 0;
        i--
    ) {

        const friend =
            friends[i];


        if (!friend.parentNode) {

            friends.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                friend.dataset.x
            );

        let y =
            parseFloat(
                friend.dataset.y
            );


        const type =
            friend.dataset.type;


        const dx =
            playerX - x;

        const dy =
            playerY - y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        let speed =
            0.035;


        if (eventActive) {
            speed *= 1.65;
        }


        if (type === "red") {
            speed = 0.055;
        }


        if (type === "glitch") {
            speed = 0.075;
        }


        if (type === "boss") {
            speed = 0.020;
        }


        if (distance > 5) {

            x +=
                dx /
                distance *
                speed;

            y +=
                dy /
                distance *
                speed;

        }

        else {

            let damage =
                NORMAL_DAMAGE;


            if (type === "red") {
                damage =
                    RED_DAMAGE;
            }

            if (type === "glitch") {
                damage =
                    GLITCH_DAMAGE;
            }

            if (type === "boss") {
                damage =
                    20;
            }


            damagePlayer(
                damage
            );

        }


        friend.dataset.x =
            x;

        friend.dataset.y =
            y;


        friend.style.left =
            x + "%";

        friend.style.top =
            y + "%";


        if (
            (
                type === "glitch" ||
                type === "boss"
            ) &&
            Math.random() < 0.018
        ) {

            spawnTail(
                x,
                y
            );

        }

    }

}


/* =====================================================
   COLA GLITCH
===================================================== */

function spawnTail(
    x,
    y
) {

    const tail =
        document.createElement("div");


    tail.className =
        "glitchTail";


    tail.style.left =
        x + "%";

    tail.style.top =
        y + "%";


    const angle =
        Math.random() *
        Math.PI *
        2;


    tail.dataset.x =
        x;

    tail.dataset.y =
        y;

    tail.dataset.dx =
        Math.cos(angle);

    tail.dataset.dy =
        Math.sin(angle);


    trianglesContainer.appendChild(
        tail
    );


    triangles.push(
        tail
    );

}


/* =====================================================
   TRIANGULOS / COLAS
   YA NO PERSIGUEN AL JUGADOR
===================================================== */

function updateTriangles() {

    for (
        let i = triangles.length - 1;
        i >= 0;
        i--
    ) {

        const triangle =
            triangles[i];


        let x =
            parseFloat(
                triangle.dataset.x
            );

        let y =
            parseFloat(
                triangle.dataset.y
            );


        const dx =
            parseFloat(
                triangle.dataset.dx
            );

        const dy =
            parseFloat(
                triangle.dataset.dy
            );


        x +=
            dx *
            0.12;

        y +=
            dy *
            0.12;


        triangle.dataset.x =
            x;

        triangle.dataset.y =
            y;


        triangle.style.left =
            x + "%";

        triangle.style.top =
            y + "%";


        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            triangle.remove();

            triangles.splice(
                i,
                1
            );

            continue;

        }


        const distance =
            Math.sqrt(
                Math.pow(
                    playerX - x,
                    2
                ) +
                Math.pow(
                    playerY - y,
                    2
                )
            );


        if (
            distance < 4
        ) {

            damagePlayer(
                15
            );

            triangle.remove();

            triangles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   COLISIONES
===================================================== */

function checkCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        const bullet =
            bullets[b];


        if (!bullet.parentNode) {

            bullets.splice(
                b,
                1
            );

            continue;

        }


        const bulletX =
            parseFloat(
                bullet.dataset.x
            );

        const bulletY =
            parseFloat(
                bullet.dataset.y
            );


        for (
            let f = friends.length - 1;
            f >= 0;
            f--
        ) {

            const friend =
                friends[f];


            const friendX =
                parseFloat(
                    friend.dataset.x
                );

            const friendY =
                parseFloat(
                    friend.dataset.y
                );


            const distance =
                Math.sqrt(
                    Math.pow(
                        bulletX -
                        friendX,
                        2
                    )
                    +
                    Math.pow(
                        bulletY -
                        friendY,
                        2
                    )
                );


            if (
                distance < 8
            ) {

                hitFriend(
                    friend,
                    bullet
                );

                break;

            }

        }

    }

}


/* =====================================================
   HIT FRIEND
===================================================== */

function hitFriend(
    friend,
    bullet
) {

    const bulletIndex =
        bullets.indexOf(
            bullet
        );


    if (
        bulletIndex !== -1
    ) {

        bullets.splice(
            bulletIndex,
            1
        );

    }


    bullet.remove();


    let hp =
        parseInt(
            friend.dataset.hp
        );


    let damage =
        10;


    if (
        player.dataset.glitchPower ===
        "true"
    ) {

        damage =
            20;

    }


    hp -=
        damage;


    friend.dataset.hp =
        hp;


    friend.classList.add(
        "hit"
    );


    setTimeout(
        function () {

            friend.classList.remove(
                "hit"
            );

        },
        100
    );


    if (
        hp <= 0
    ) {

        killFriend(
            friend
        );

    }

}


/* =====================================================
   KILL
===================================================== */

function killFriend(
    friend
) {

    friendLaugh.currentTime =
        0;

    friendLaugh.volume =
        0.20;

    friendLaugh.play()
        .catch(
            function () {}
        );


    kills++;

    totalKills++;

    saveKills();

    updateHUD();


    const index =
        friends.indexOf(
            friend
        );


    if (index !== -1) {

        friends.splice(
            index,
            1
        );

    }


    friend.remove();


    checkAchievements();

}


/* =====================================================
   LOGROS
===================================================== */

function checkAchievements() {

    if (
        totalKills >= 100
    ) {

        localStorage.setItem(
            "friendAchievement100",
            "true"
        );

    }


    if (
        totalKills >= 1000
    ) {

        localStorage.setItem(
            "friendAchievement1000",
            "true"
        );

    }


    if (
        totalKills >= 10000
    ) {

        localStorage.setItem(
            "friendAchievement10000",
            "true"
        );

    }

}


/* =====================================================
   DAÑO
===================================================== */

function damagePlayer(
    amount
) {

    if (!gameRunning) {
        return;
    }


    if (damageCooldown) {
        return;
    }


    damageCooldown =
        true;


    playerHP -=
        amount;


    playerHP =
        Math.max(
            0,
            playerHP
        );


    updateHUD();


    player.classList.remove(
        "playerHit"
    );


    void player.offsetWidth;


    player.classList.add(
        "playerHit"
    );


    setTimeout(
        function () {

            player.classList.remove(
                "playerHit"
            );

        },
        3000
    );


    setTimeout(
        function () {

            damageCooldown =
                false;

        },
        3000
    );


    if (
        playerHP <= 0
    ) {

        gameOver();

    }

}


/* =====================================================
   POWER UPS
   TODOS USAN pipis.gif
===================================================== */

function schedulePowerUp() {

    if (!gameRunning) {
        return;
    }


    powerUpTimeout =
        setTimeout(
            function () {

                spawnPowerUp();

                schedulePowerUp();

            },
            Math.random() *
            9000 +
            6000
        );

}


function spawnPowerUp() {

    const powerUp =
        document.createElement("img");


    powerUp.src =
        "pipis.gif";


    const types =
        [
            "green",
            "red",
            "glitch"
        ];


    const type =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];


    powerUp.className =
        "powerUp powerUp-" +
        type;


    const x =
        Math.random() *
        80 +
        10;

    const y =
        Math.random() *
        70 +
        10;


    powerUp.style.left =
        x + "%";

    powerUp.style.top =
        y + "%";


    powerUp.dataset.x =
        x;

    powerUp.dataset.y =
        y;

    powerUp.dataset.type =
        type;


    powerUpsContainer.appendChild(
        powerUp
    );


    powerUps.push(
        powerUp
    );


    setTimeout(
        function () {

            const index =
                powerUps.indexOf(
                    powerUp
                );

            if (index !== -1) {

                powerUps.splice(
                    index,
                    1
                );

            }

            powerUp.remove();

        },
        10000
    );

}


/* =====================================================
   POWER UPS COLLISION
===================================================== */

function updatePowerUps() {

    for (
        let i = powerUps.length - 1;
        i >= 0;
        i--
    ) {

        const powerUp =
            powerUps[i];


        const x =
            parseFloat(
                powerUp.dataset.x
            );

        const y =
            parseFloat(
                powerUp.dataset.y
            );


        const distance =
            Math.sqrt(
                Math.pow(
                    playerX - x,
                    2
                ) +
                Math.pow(
                    playerY - y,
                    2
                )
            );


        if (
            distance < 7
        ) {

            activatePowerUp(
                powerUp.dataset.type
            );


            powerUp.remove();

            powerUps.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   ACTIVAR POWER UP
===================================================== */

function activatePowerUp(
    type
) {

    if (
        type === "green"
    ) {

        playerHP =
            Math.min(
                MAX_HP,
                playerHP + 10
            );

        showEvent(
            "!!! GREEN PIPIS +10 HP !!!"
        );

    }


    if (
        type === "red"
    ) {

        player.dataset.redPower =
            "true";


        showEvent(
            "!!! TRIPLE PIPIS !!!"
        );


        setTimeout(
            function () {

                player.dataset.redPower =
                    "false";

            },
            10000
        );

    }


    if (
        type === "glitch"
    ) {

        player.dataset.glitchPower =
            "true";


        showEvent(
            "!!! GLITCH PIPIS !!!"
        );


        setTimeout(
            function () {

                player.dataset.glitchPower =
                    "false";

            },
            10000
        );

    }


    updateHUD();

}


/* =====================================================
   EVENTO FRIEND RUSH
===================================================== */

function scheduleEvent() {

    if (!gameRunning) {
        return;
    }


    eventTimeout =
        setTimeout(
            function () {

                startFriendRush();

                scheduleEvent();

            },
            30000
        );

}


function startFriendRush() {

    if (eventActive) {
        return;
    }


    eventActive =
        true;


    showEvent(
        "!!! FRIEND RUSH !!!"
    );


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        setTimeout(
            function () {

                if (gameRunning) {

                    spawnFriend();

                }

            },
            i * 250
        );

    }


    setTimeout(
        function () {

            eventActive =
                false;

        },
        8000
    );

}


/* =====================================================
   EVENTO
===================================================== */

let eventMessageTimeout =
    null;


function showEvent(
    message
) {

    eventMessage.textContent =
        message;

    eventMessage.classList.add(
        "show"
    );


    clearTimeout(
        eventMessageTimeout
    );


    eventMessageTimeout =
        setTimeout(
            function () {

                eventMessage.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    if (!gameRunning) {
        return;
    }


    gameRunning =
        false;


    clearInterval(
        timerInterval
    );

    clearTimeout(
        spawnTimeout
    );

    clearTimeout(
        powerUpTimeout
    );

    clearTimeout(
        eventTimeout
    );


    gameMusic.pause();


    showEvent(
        "GAME OVER"
    );


    setTimeout(
        function () {

            game.style.display =
                "none";

            startScreen.style.display =
                "flex";

            updateHUD();

        },
        2000
    );

}


/* =====================================================
   JOYSTICK
===================================================== */

let joystickPointerId =
    null;


function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;


    const max =
        rect.width / 2 -
        18;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > max
    ) {

        dx =
            dx /
            distance *
            max;

        dy =
            dy /
            distance *
            max;

    }


    joystickDX =
        dx / max;

    joystickDY =
        dy / max;


    joystickKnob.style.transform =
        `translate(${dx}px, ${dy}px)`;

}


function releaseJoystick() {

    joystickActive =
        false;

    joystickPointerId =
        null;

    joystickDX =
        0;

    joystickDY =
        0;

    joystickKnob.style.transform =
        "translate(0,0)";

}


joystick.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        joystickActive =
            true;

        joystickPointerId =
            event.pointerId;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",
    function(event) {

        if (
            !joystickActive ||
            event.pointerId !==
            joystickPointerId
        ) {

            return;

        }

        event.preventDefault();

        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointerup",
    releaseJoystick
);


joystick.addEventListener(
    "pointercancel",
    releaseJoystick
);
