<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>FRIEND DESTROYER</title>

    <link
        rel="stylesheet"
        href="friend-destroyer.css"
    >

</head>

<body>

<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="warning">
            !!! WARNING !!!
        </div>

        <h1>
            FRIEND DESTROYER
        </h1>

        <p>
            DESTROY THEM ALL.
        </p>

        <p>
            PC: W A S D = MOVE
        </p>

        <p>
            PC: Z = SHOOT
        </p>

        <p class="mobileInfo">
            CELULAR: USA EL JOYSTICK Y EL BOTÓN PIPIS
        </p>

        <div class="startStats">

            <div>
                TOTAL KILLS:
                <span id="startTotalKills">
                    0
                </span>
            </div>

        </div>

        <button
            id="startButton"
            type="button"
        >
            [ START GAME ]
        </button>

        <br>
        <br>

        <a
            href="index.html"
            class="backButton"
        >
            [ BACK TO SPAMTON SHOP ]
        </a>

    </div>

</div>


<!-- =====================================================
     JUEGO
===================================================== -->

<div id="game">

    <!-- BOTÓN SALIR -->

    <button
        id="exitGameButton"
        type="button"
    >
        [ EXIT GAME ]
    </button>


    <!-- HUD -->

    <div id="hud">

        <div class="hudBox">

            HP:

            <span id="playerHP">
                450
            </span>

            / 450

        </div>

        <div class="hudBox">

            KILLS:

            <span id="killCounter">
                0
            </span>

        </div>

        <div class="hudBox totalKillsBox">

            TOTAL KILLS:

            <span id="totalKillCounter">
                0
            </span>

        </div>

        <div class="hudBox">

            TIME:

            <span id="timer">
                00:00
            </span>

        </div>

    </div>


    <!-- =================================================
         ÁREA DEL JUEGO
    ================================================== -->

    <div id="gameArea">

        <div id="platform"></div>

        <!-- SPAMTON -->

        <img
            src="spamton-gun-game.gif"
            id="player"
            class="gameSprite"
            alt="Spamton"
        >

        <!-- FRIENDS -->

        <div id="friends"></div>

        <!-- PIPIS -->

        <div id="pipisRain"></div>

        <!-- BALAS -->

        <div id="bullets"></div>

        <!-- TRIÁNGULOS -->

        <div id="triangles"></div>

    </div>


    <!-- =================================================
         CONTROLES PARA CELULAR
    ================================================== -->

    <div id="mobileControls">

        <div id="joystick">

            <div id="joystickKnob"></div>

        </div>

        <button
            id="shootButton"
            type="button"
        >
            PIPIS
        </button>

    </div>


    <!-- MENSAJE -->

    <div id="eventMessage"></div>

</div>


<!-- =====================================================
     MÚSICA
===================================================== -->

<audio
    id="gameMusic"
    src="big-shot.mp3"
    loop
    preload="auto"
></audio>


<!-- =====================================================
     RISA FRIEND
===================================================== -->

<audio
    id="friendLaugh"
    src="friend-laugh.mp3"
    preload="auto"
></audio>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const game =
    document.getElementById("game");

const gameArea =
    document.getElementById("gameArea");

const player =
    document.getElementById("player");

const friendsContainer =
    document.getElementById("friends");

const bulletsContainer =
    document.getElementById("bullets");

const trianglesContainer =
    document.getElementById("triangles");

const pipisContainer =
    document.getElementById("pipisRain");

const playerHPText =
    document.getElementById("playerHP");

const killCounterText =
    document.getElementById("killCounter");

const totalKillCounterText =
    document.getElementById("totalKillCounter");

const startTotalKillsText =
    document.getElementById("startTotalKills");

const timerText =
    document.getElementById("timer");

const eventMessage =
    document.getElementById("eventMessage");

const gameMusic =
    document.getElementById("gameMusic");

const friendLaugh =
    document.getElementById("friendLaugh");

const shootButton =
    document.getElementById("shootButton");

const joystick =
    document.getElementById("joystick");

const joystickKnob =
    document.getElementById("joystickKnob");


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MAX_HP = 450;

/*
 * Un poco más rápido que antes.
 */

const PLAYER_SPEED = 0.42;


/*
 * Velocidad de las Pipis.
 */

const BULLET_SPEED = 1.9;


/*
 * Los Friends hacen SOLO 10 de daño.
 */

const FRIEND_DAMAGE = 10;


/*
 * Daño de cada Pipis.
 */

const FRIEND_SHOT_DAMAGE = 10;


/*
 * Cooldown de daño:
 * 3 segundos.
 */

const DAMAGE_COOLDOWN = 3000;


/*
 * Velocidad de Friends.
 */

const NORMAL_FRIEND_SPEED = 0.035;

const RED_FRIEND_SPEED = 0.052;

const GLITCH_FRIEND_SPEED = 0.062;

const BOSS_FRIEND_SPEED = 0.010;


/* =====================================================
   ESTADO
===================================================== */

let playerHP = MAX_HP;

let kills = 0;

let totalKills =
    parseInt(
        localStorage.getItem(
            "friendTotalKills"
        )
    ) || 0;

let gameRunning = false;

let gameTime = 0;

let timerInterval = null;

let spawnTimeout = null;

let gameLoopId = null;

let eventInterval = null;

let keys = {};

let bullets = [];

let friends = [];

let bossActive = false;

let lastTime = 0;

let playerX = 50;

let playerY = 75;

let shootCooldown = false;


/*
 * Dirección de Spamton.
 */

let facingDirection = "right";


/*
 * Invulnerabilidad.
 */

let playerInvulnerable = false;

let damageCooldownTimeout = null;


/*
 * Movimiento táctil.
 */

let touchMoveX = 0;

let touchMoveY = 0;


/* =====================================================
   POSICIÓN INICIAL
===================================================== */

function resetPlayerPosition() {

    playerX = 50;

    playerY = 75;

    facingDirection = "right";

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

    updatePlayerDirection();

}


/* =====================================================
   GIRAR SPAMTON
===================================================== */

function updatePlayerDirection() {

    if (facingDirection === "left") {

        player.classList.add(
            "facing-left"
        );

        player.classList.remove(
            "facing-right"
        );

    }
    else {

        player.classList.add(
            "facing-right"
        );

        player.classList.remove(
            "facing-left"
        );

    }

}


/* =====================================================
   TOTAL KILLS
===================================================== */

function updateTotalKillsDisplay() {

    totalKillCounterText.textContent =
        totalKills;

    startTotalKillsText.textContent =
        totalKills;

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    playerHPText.textContent =
        playerHP;

    killCounterText.textContent =
        kills;

    totalKillCounterText.textContent =
        totalKills;

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        if (
            key === "z" &&
            gameRunning
        ) {

            shoot();

        }


        if (
            [
                "w",
                "a",
                "s",
                "d",
                "z",
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright"
            ].includes(key)
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = false;

    }
);


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    function() {

        startGame();

    }
);


/* =====================================================
   INICIAR
===================================================== */

function startGame() {

    clearGame();

    startScreen.style.display =
        "none";

    game.style.display =
        "block";

    gameRunning =
        true;

    playerHP =
        MAX_HP;

    kills =
        0;

    gameTime =
        0;

    bossActive =
        false;

    playerInvulnerable =
        false;

    resetPlayerPosition();

    updateHUD();

    updateTotalKillsDisplay();


    /*
     * BIG SHOT
     */

    gameMusic.volume =
        0.40;

    gameMusic.currentTime =
        0;

    gameMusic.play()
        .catch(
            function(error) {

                console.log(
                    "No se pudo iniciar Big Shot:",
                    error
                );

            }
        );


    /*
     * TIMER
     */

    timerInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                gameTime++;

                updateTimer();

            },
            1000
        );


    /*
     * FRIENDS
     */

    scheduleFriendSpawn();


    /*
     * EVENTOS
     */

    eventInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                if (
                    Math.random() < 0.15
                ) {

                    pipisRainEvent();

                }

            },
            15000
        );


    lastTime =
        performance.now();

    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   SALIR
===================================================== */

exitGameButton.addEventListener(
    "click",
    function() {

        exitGame();

    }
);


function exitGame() {

    gameRunning =
        false;

    clearInterval(
        timerInterval
    );

    clearInterval(
        eventInterval
    );

    clearTimeout(
        spawnTimeout
    );

    clearTimeout(
        damageCooldownTimeout
    );

    gameMusic.pause();

    gameMusic.currentTime =
        0;

    clearGame();

    window.location.href =
        "index.html";

}


/* =====================================================
   LIMPIAR
===================================================== */

function clearGame() {

    clearTimeout(
        spawnTimeout
    );


    friends.forEach(
        function(friend) {

            if (
                friend.parentNode
            ) {

                friend.remove();

            }

        }
    );

    friends = [];


    bullets.forEach(
        function(bullet) {

            if (
                bullet.parentNode
            ) {

                bullet.remove();

            }

        }
    );

    bullets = [];


    document
        .querySelectorAll(".triangle")
        .forEach(
            function(triangle) {

                triangle.remove();

            }
        );


    document
        .querySelectorAll(".healingPipis")
        .forEach(
            function(pipis) {

                pipis.remove();

            }
        );

}


/* =====================================================
   BUCLE PRINCIPAL
===================================================== */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }

    const delta =
        time - lastTime;

    lastTime =
        time;

    movePlayer();

    updateBullets(delta);

    updateFriends(delta);

    updateTriangles(delta);

    checkCollisions();

    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   MOVER JUGADOR
===================================================== */

function movePlayer() {

    let moveX = 0;

    let moveY = 0;


    /*
     * PC
     */

    if (keys["a"]) {

        moveX -= 1;

        facingDirection =
            "left";

    }

    if (keys["d"]) {

        moveX += 1;

        facingDirection =
            "right";

    }

    if (keys["w"]) {

        moveY -= 1;

    }

    if (keys["s"]) {

        moveY += 1;

    }


    /*
     * CELULAR
     */

    moveX += touchMoveX;

    moveY += touchMoveY;


    /*
     * Normalizar diagonal
     */

    const length =
        Math.sqrt(
            moveX * moveX +
            moveY * moveY
        );


    if (length > 0) {

        moveX /= length;

        moveY /= length;

    }


    playerX +=
        moveX *
        PLAYER_SPEED;

    playerY +=
        moveY *
        PLAYER_SPEED;


    /*
     * Límites
     */

    playerX =
        Math.max(
            5,
            Math.min(
                95,
                playerX
            )
        );

    playerY =
        Math.max(
            8,
            Math.min(
                92,
                playerY
            )
        );


    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";


    updatePlayerDirection();

}


/* =====================================================
   DISPARAR
===================================================== */

function shoot() {

    if (
        !gameRunning ||
        shootCooldown
    ) {

        return;

    }


    shootCooldown =
        true;


    setTimeout(
        function() {

            shootCooldown =
                false;

        },
        110
    );


    const bullet =
        document.createElement(
            "img"
        );


    bullet.src =
        "pipis.gif";

    bullet.className =
        "bullet";


    /*
     * Punto de origen.
     */

    let x =
        playerX;

    let y =
        playerY;


    /*
     * Dirección del disparo.
     *
     * Ahora puede disparar:
     *
     * arriba
     * abajo
     * izquierda
     * derecha
     * diagonales
     */

    let dx = 0;

    let dy = 0;


    /*
     * Usamos las teclas presionadas
     * para decidir hacia dónde dispara.
     */

    if (keys["w"]) {

        dy -= 1;

    }

    if (keys["s"]) {

        dy += 1;

    }

    if (keys["a"]) {

        dx -= 1;

    }

    if (keys["d"]) {

        dx += 1;

    }


    /*
     * Si no se está presionando
     * una dirección, dispara hacia
     * donde Spamton está mirando.
     */

    if (
        dx === 0 &&
        dy === 0
    ) {

        if (
            facingDirection === "left"
        ) {

            dx = -1;

        }
        else {

            dx = 1;

        }

    }


    /*
     * Joystick:
     * si el jugador está usando celular
     * puede disparar hacia la dirección
     * del movimiento.
     */

    if (
        dx === 0 &&
        dy === 0 &&
        (
            touchMoveX !== 0 ||
            touchMoveY !== 0
        )
    ) {

        dx =
            touchMoveX;

        dy =
            touchMoveY;

    }


    /*
     * Normalizar dirección.
     */

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length > 0) {

        dx /= length;

        dy /= length;

    }


    /*
     * Guardar dirección.
     */

    bullet.dataset.x =
        x;

    bullet.dataset.y =
        y;

    bullet.dataset.dx =
        dx;

    bullet.dataset.dy =
        dy;


    bullet.style.left =
        x + "%";

    bullet.style.top =
        y + "%";


    /*
     * Rotar visualmente la Pipis.
     */

    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;


    bullet.style.transform =
        "translate(-50%, -50%) rotate(" +
        angle +
        "deg)";


    bulletsContainer.appendChild(
        bullet
    );


    bullets.push(
        bullet
    );

}


/* =====================================================
   ACTUALIZAR BALAS
===================================================== */

function updateBullets(delta) {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];


        if (
            !bullet.parentNode
        ) {

            bullets.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                bullet.dataset.x
            );

        let y =
            parseFloat(
                bullet.dataset.y
            );


        const dx =
            parseFloat(
                bullet.dataset.dx
            );

        const dy =
            parseFloat(
                bullet.dataset.dy
            );


        x +=
            dx *
            BULLET_SPEED;

        y +=
            dy *
            BULLET_SPEED;


        bullet.dataset.x =
            x;

        bullet.dataset.y =
            y;


        bullet.style.left =
            x + "%";

        bullet.style.top =
            y + "%";


        /*
         * Fuera de pantalla
         */

        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            bullet.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   PROGRAMAR FRIEND
===================================================== */

function scheduleFriendSpawn() {

    if (!gameRunning) {
        return;
    }


    /*
     * Nunca menos de 1 segundo.
     *
     * Entre 1 y 2.5 segundos.
     */

    const delay =
        Math.random() *
        1500 +
        1000;


    spawnTimeout =
        setTimeout(
            function() {

                if (!gameRunning) {
                    return;
                }

                spawnFriend();

                scheduleFriendSpawn();

            },
            delay
        );

}


/* =====================================================
   CREAR FRIEND
===================================================== */

function spawnFriend() {

    if (!gameRunning) {
        return;
    }


    let type =
        "normal";


    if (
        kills >= 1000
    ) {

        type =
            Math.random() < 0.45
                ? "glitch"
                : "red";

    }
    else if (
        kills >= 100
    ) {

        type =
            Math.random() < 0.35
                ? "red"
                : "normal";

    }


    const friend =
        document.createElement(
            "img"
        );


    friend.src =
        "friend-sprite.gif";


    friend.className =
        "friend";


    friend.classList.add(
        "friend-" + type
    );


    /*
     * Aparecer en TODOS los lugares.
     */

    const x =
        Math.random() *
        86 +
        7;

    const y =
        Math.random() *
        78 +
        8;


    friend.style.left =
        x + "%";

    friend.style.top =
        y + "%";


    /*
     * Vida
     */

    let hp =
        20;


    if (
        type === "red"
    ) {

        hp =
            45;

    }


    if (
        type === "glitch"
    ) {

        hp =
            70;

    }


    friend.dataset.hp =
        hp;

    friend.dataset.x =
        x;

    friend.dataset.y =
        y;

    friend.dataset.type =
        type;


    friendsContainer.appendChild(
        friend
    );

    friends.push(
        friend
    );


    /*
     * Boss después de 100 kills.
     */

    if (
        totalKills >= 100 &&
        !bossActive
    ) {

        spawnBoss();

    }

}


/* =====================================================
   BOSS
===================================================== */

function spawnBoss() {

    if (bossActive) {
        return;
    }


    bossActive =
        true;


    showEvent(
        "!!! BOSS FRIEND !!!"
    );


    const boss =
        document.createElement(
            "img"
        );


    boss.src =
        "friend-sprite.gif";


    boss.className =
        "friend boss";


    boss.style.left =
        "50%";

    boss.style.top =
        "15%";


    boss.dataset.hp =
        500;

    boss.dataset.x =
        50;

    boss.dataset.y =
        15;

    boss.dataset.type =
        "boss";


    friendsContainer.appendChild(
        boss
    );


    friends.push(
        boss
    );

}


/* =====================================================
   MOVER FRIENDS
===================================================== */

function updateFriends() {

    for (
        let i = friends.length - 1;
        i >= 0;
        i--
    ) {

        const friend =
            friends[i];


        if (
            !friend.parentNode
        ) {

            friends.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                friend.dataset.x
            );

        let y =
            parseFloat(
                friend.dataset.y
            );


        const type =
            friend.dataset.type;


        const dx =
            playerX - x;

        const dy =
            playerY - y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        let speed =
            NORMAL_FRIEND_SPEED;


        if (
            type === "red"
        ) {

            speed =
                RED_FRIEND_SPEED;

        }


        if (
            type === "glitch"
        ) {

            speed =
                GLITCH_FRIEND_SPEED;

        }


        if (
            type === "boss"
        ) {

            speed =
                BOSS_FRIEND_SPEED;

        }


        if (
            distance > 5
        ) {

            x +=
                (
                    dx /
                    distance
                ) *
                speed;

            y +=
                (
                    dy /
                    distance
                ) *
                speed;

        }
        else {

            damagePlayer(
                FRIEND_DAMAGE
            );

        }


        friend.dataset.x =
            x;

        friend.dataset.y =
            y;


        friend.style.left =
            x + "%";

        friend.style.top =
            y + "%";


        /*
         * Glitch y Boss
         * disparan triángulos.
         */

        if (
            type === "boss" ||
            type === "glitch"
        ) {

            if (
                Math.random() <
                0.015
            ) {

                spawnTriangle(
                    x,
                    y
                );

            }

        }

    }

}


/* =====================================================
   TRIÁNGULO
===================================================== */

function spawnTriangle(
    x,
    y
) {

    const triangle =
        document.createElement(
            "div"
        );


    triangle.className =
        "triangle";


    triangle.style.left =
        x + "%";

    triangle.style.top =
        y + "%";


    triangle.dataset.x =
        x;

    triangle.dataset.y =
        y;


    trianglesContainer.appendChild(
        triangle
    );

}


/* =====================================================
   ACTUALIZAR TRIÁNGULOS
===================================================== */

function updateTriangles() {

    const triangleList =
        document.querySelectorAll(
            ".triangle"
        );


    triangleList.forEach(
        function(triangle) {

            let x =
                parseFloat(
                    triangle.dataset.x
                );

            let y =
                parseFloat(
                    triangle.dataset.y
                );


            const dx =
                playerX - x;

            const dy =
                playerY - y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance > 0
            ) {

                x +=
                    (
                        dx /
                        distance
                    ) *
                    0.08;

                y +=
                    (
                        dy /
                        distance
                    ) *
                    0.08;

            }


            triangle.dataset.x =
                x;

            triangle.dataset.y =
                y;


            triangle.style.left =
                x + "%";

            triangle.style.top =
                y + "%";


            if (
                distance < 5
            ) {

                damagePlayer(
                    15
                );

                triangle.remove();

            }

        }
    );

}


/* =====================================================
   COLISIONES
===================================================== */

function checkCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        const bullet =
            bullets[b];


        if (
            !bullet.parentNode
        ) {

            bullets.splice(
                b,
                1
            );

            continue;

        }


        const bulletX =
            parseFloat(
                bullet.dataset.x
            );

        const bulletY =
            parseFloat(
                bullet.dataset.y
            );


        for (
            let f = friends.length - 1;
            f >= 0;
            f--
        ) {

            const friend =
                friends[f];


            if (
                !friend.parentNode
            ) {

                friends.splice(
                    f,
                    1
                );

                continue;

            }


            const friendX =
                parseFloat(
                    friend.dataset.x
                );

            const friendY =
                parseFloat(
                    friend.dataset.y
                );


            const distance =
                Math.sqrt(
                    Math.pow(
                        bulletX -
                        friendX,
                        2
                    )
                    +
                    Math.pow(
                        bulletY -
                        friendY,
                        2
                    )
                );


            if (
                distance < 7
            ) {

                hitFriend(
                    friend,
                    bullet
                );

                break;

            }

        }

    }

}


/* =====================================================
   GOLPEAR FRIEND
===================================================== */

function hitFriend(
    friend,
    bullet
) {

    const bulletIndex =
        bullets.indexOf(
            bullet
        );


    if (
        bulletIndex !== -1
    ) {

        bullets.splice(
            bulletIndex,
            1
        );

    }


    bullet.remove();


    let hp =
        parseInt(
            friend.dataset.hp
        );


    hp -=
        FRIEND_SHOT_DAMAGE;


    friend.dataset.hp =
        hp;


    friend.classList.add(
        "hit"
    );


    setTimeout(
        function() {

            friend.classList.remove(
                "hit"
            );

        },
        100
    );


    if (
        hp <= 0
    ) {

        killFriend(
            friend
        );

    }

}


/* =====================================================
   MATAR FRIEND
===================================================== */

function killFriend(
    friend
) {

    friendLaugh.currentTime =
        0;

    friendLaugh.volume =
        0.20;


    friendLaugh.play()
        .catch(
            function() {}
        );


    kills++;

    totalKills++;


    localStorage.setItem(
        "friendTotalKills",
        totalKills
    );


    updateHUD();

    updateTotalKillsDisplay();


    const index =
        friends.indexOf(
            friend
        );


    if (
        index !== -1
    ) {

        friends.splice(
            index,
            1
        );

    }


    friend.remove();


    checkAchievements();

}


/* =====================================================
   DAÑO AL JUGADOR
===================================================== */

function damagePlayer(
    amount
) {

    if (
        !gameRunning ||
        playerInvulnerable
    ) {

        return;

    }


    /*
     * Activar invulnerabilidad
     */

    playerInvulnerable =
        true;


    /*
     * EXACTAMENTE 10 HP
     */

    playerHP -=
        FRIEND_DAMAGE;


    if (
        playerHP < 0
    ) {

        playerHP =
            0;

    }


    updateHUD();


    /*
     * Parpadeo rojo.
     */

    player.classList.remove(
        "playerDamageFlash"
    );


    void player.offsetWidth;


    player.classList.add(
        "playerDamageFlash"
    );


    /*
     * Después de 3 segundos
     * vuelve a poder recibir daño.
     */

    clearTimeout(
        damageCooldownTimeout
    );


    damageCooldownTimeout =
        setTimeout(
            function() {

                playerInvulnerable =
                    false;

                player.classList.remove(
                    "playerDamageFlash"
                );

            },
            DAMAGE_COOLDOWN
        );


    /*
     * Game Over
     */

    if (
        playerHP <= 0
    ) {

        gameOver();

    }

}


/* =====================================================
   LLUVIA DE PIPIS
===================================================== */

function pipisRainEvent() {

    if (!gameRunning) {
        return;
    }


    showEvent(
        "!!! PIPIS RAIN !!!"
    );


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const pipis =
            document.createElement(
                "img"
            );


        pipis.src =
            "pipis.gif";


        pipis.className =
            "healingPipis";


        pipis.style.left =
            Math.random() *
            100 +
            "%";


        pipis.style.animationDelay =
            Math.random() *
            1.5 +
            "s";


        pipisContainer.appendChild(
            pipis
        );


        setTimeout(
            function() {

                if (
                    pipis.parentNode
                ) {

                    pipis.remove();

                }

            },
            5000
        );

    }


    /*
     * CURACIÓN
     */

    playerHP +=
        100;


    if (
        playerHP > MAX_HP
    ) {

        playerHP =
            MAX_HP;

    }


    updateHUD();

}


/* =====================================================
   LOGROS
===================================================== */

function checkAchievements() {

    if (
        totalKills >= 100 &&
        localStorage.getItem(
            "friendAchievement100"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement100",
            "true"
        );


        showAchievement(
            "WOW! CONSEGUISTE 100 KILLS!"
        );

    }


    if (
        totalKills >= 1000 &&
        localStorage.getItem(
            "friendAchievement1000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement1000",
            "true"
        );


        showAchievement(
            "WOW! CONSEGUISTE 1000 KILLS!",
            true
        );

    }


    if (
        totalKills >= 10000 &&
        localStorage.getItem(
            "friendAchievement10000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement10000",
            "true"
        );


        showAchievement(
            "GRACIAS POR JUGAR Y PROBAR LA PAGINA DE SPAMTON, CON AMOR NOELIA"
        );

    }

}


/* =====================================================
   POPUP LOGRO
===================================================== */

function showAchievement(
    message,
    susie = false
) {

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "achievementPopup";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "achievementText";


    title.textContent =
        message;


    box.appendChild(
        title
    );


    if (
        susie
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            "susie-eating-pancakes.gif";


        image.className =
            "achievementSusie";


        box.appendChild(
            image
        );

    }


    document.body.appendChild(
        box
    );


    requestAnimationFrame(
        function() {

            box.classList.add(
                "show"
            );

        }
    );


    setTimeout(
        function() {

            box.classList.remove(
                "show"
            );


            setTimeout(
                function() {

                    box.remove();

                },
                500
            );

        },
        5000
    );

}


/* =====================================================
   EVENTO
===================================================== */

let eventMessageTimeout =
    null;


function showEvent(
    message
) {

    eventMessage.textContent =
        message;


    eventMessage.classList.add(
        "show"
    );


    clearTimeout(
        eventMessageTimeout
    );


    eventMessageTimeout =
        setTimeout(
            function() {

                eventMessage.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    const minutes =
        Math.floor(
            gameTime / 60
        );


    const seconds =
        gameTime % 60;


    timerText.textContent =
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":"
        +
        String(seconds)
            .padStart(
                2,
                "0"
            );

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );

    clearInterval(
        eventInterval
    );

    clearTimeout(
        spawnTimeout
    );

    clearTimeout(
        damageCooldownTimeout
    );


    gameMusic.pause();


    showEvent(
        "GAME OVER"
    );


    setTimeout(
        function() {

            game.style.display =
                "none";


            startScreen.style.display =
                "flex";


            startTotalKillsText.textContent =
                totalKills;


            updateTotalKillsDisplay();

        },
        2000
    );

}


/* =====================================================
   JOYSTICK CELULAR
===================================================== */

let joystickActive = false;


/*
 * Convertir posición táctil
 * en dirección.
 */

function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;


    const maxDistance =
        rect.width * 0.32;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > maxDistance
    ) {

        dx =
            (
                dx /
                distance
            ) *
            maxDistance;

        dy =
            (
                dy /
                distance
            ) *
            maxDistance;

    }


    joystickKnob.style.transform =
        "translate(" +
        dx +
        "px, " +
        dy +
        "px)";


    touchMoveX =
        dx /
        maxDistance;

    touchMoveY =
        dy /
        maxDistance;


    /*
     * Dirección de Spamton.
     */

    if (
        Math.abs(touchMoveX) >
        0.15
    ) {

        facingDirection =
            touchMoveX < 0
                ? "left"
                : "right";

        updatePlayerDirection();

    }

}


/*
 * Touch START
 */

joystick.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        joystickActive =
            true;

        const touch =
            event.touches[0];

        updateJoystick(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: false
    }
);


/*
 * Touch MOVE
 */

joystick.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

        if (!joystickActive) {
            return;
        }

        const touch =
            event.touches[0];

        updateJoystick(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: false
    }
);


/*
 * Touch END
 */

joystick.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        joystickActive =
            false;

        touchMoveX =
            0;

        touchMoveY =
            0;

        joystickKnob.style.transform =
            "translate(0, 0)";

    },
    {
        passive: false
    }
);


/* =====================================================
   BOTÓN PIPIS CELULAR
===================================================== */

shootButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        if (
            gameRunning
        ) {

            shoot();

        }

    },
    {
        passive: false
    }
);


/*
 * También permite click.
 */

shootButton.addEventListener(
    "click",
    function(event) {

        if (
            gameRunning
        ) {

            shoot();

        }

    }
);


/* =====================================================
   ESTADO INICIAL
===================================================== */

updateTotalKillsDisplay();

updateHUD();

resetPlayerPosition();

</script>
