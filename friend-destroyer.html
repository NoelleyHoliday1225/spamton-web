<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>FRIEND DESTROYER</title>

    <link
        rel="stylesheet"
        href="friend-destroyer.css"
    >

</head>


<body>


<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="warning">
            !!! WARNING !!!
        </div>

        <h1>
            FRIEND DESTROYER
        </h1>

        <p>
            DESTROY THEM ALL.
        </p>

        <p>
            W A S D = MOVE
        </p>

        <p>
            Z = SHOOT
        </p>

        <div class="startStats">

            <div>
                TOTAL KILLS:
                <span id="startTotalKills">
                    0
                </span>
            </div>

        </div>


        <button
            id="startButton"
            type="button"
        >
            [ START GAME ]
        </button>


        <br>
        <br>


        <a
            href="index.html"
            class="backButton"
        >
            [ BACK TO SPAMTON SHOP ]
        </a>

    </div>

</div>



<!-- =====================================================
     JUEGO
===================================================== -->

<div id="game">


    <!-- =================================================
         SALIR
    ================================================== -->

    <button
        id="exitGameButton"
        type="button"
    >
        [ EXIT GAME ]
    </button>



    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">

        <div class="hudBox">

            HP:

            <span id="playerHP">
                450
            </span>

            / 450

        </div>


        <div class="hudBox">

            KILLS:

            <span id="killCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TOTAL:

            <span id="totalKillCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TIME:

            <span id="timer">
                00:00
            </span>

        </div>

    </div>



    <!-- =================================================
         ÁREA DEL JUEGO
    ================================================== -->

    <div id="gameArea">

        <div id="platform"></div>


        <!-- SPAMTON -->

        <img
            src="spamton-gun-game.gif"
            id="player"
            alt="Spamton"
        >


        <!-- FRIENDS -->

        <div id="friends"></div>


        <!-- BALAS -->

        <div id="bullets"></div>


        <!-- TRIÁNGULOS -->

        <div id="triangles"></div>


        <!-- PIPIS DE CURACIÓN -->

        <div id="pipisRain"></div>

    </div>



    <!-- =================================================
         CONTROLES
    ================================================== -->

    <div id="mobileControls">

        <!-- JOYSTICK -->

        <div id="joystick">

            <div id="joystickBase">

                <div id="joystickStick"></div>

            </div>

        </div>


        <!-- ATAQUE -->

        <button
            id="attackButton"
            type="button"
        >
            PIPIS
        </button>

    </div>



    <!-- =================================================
         MENSAJE DE EVENTO
    ================================================== -->

    <div id="eventMessage"></div>


</div>



<!-- =====================================================
     MÚSICA
===================================================== -->

<audio
    id="gameMusic"
    src="big-shot.mp3"
    loop
    preload="auto"
></audio>



<!-- =====================================================
     RISA FRIEND
===================================================== -->

<audio
    id="friendLaugh"
    src="friend-laugh.mp3"
    preload="auto"
></audio>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const game =
    document.getElementById("game");

const gameArea =
    document.getElementById("gameArea");

const player =
    document.getElementById("player");

const friendsContainer =
    document.getElementById("friends");

const bulletsContainer =
    document.getElementById("bullets");

const trianglesContainer =
    document.getElementById("triangles");

const pipisContainer =
    document.getElementById("pipisRain");

const playerHPText =
    document.getElementById("playerHP");

const killCounterText =
    document.getElementById("killCounter");

const totalKillCounterText =
    document.getElementById("totalKillCounter");

const startTotalKillsText =
    document.getElementById("startTotalKills");

const timerText =
    document.getElementById("timer");

const eventMessage =
    document.getElementById("eventMessage");

const gameMusic =
    document.getElementById("gameMusic");

const friendLaugh =
    document.getElementById("friendLaugh");

const attackButton =
    document.getElementById("attackButton");

const joystickBase =
    document.getElementById("joystickBase");

const joystickStick =
    document.getElementById("joystickStick");



/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MAX_HP = 450;


/* Movimiento */

const PLAYER_SPEED = 0.42;


/* Bala */

const BULLET_SPEED = 1.15;


/* Daños */

const NORMAL_DAMAGE = 10;

const RED_DAMAGE = 15;

const GLITCH_DAMAGE = 20;

const BOSS_DAMAGE = 20;


/* Daño de bala */

const BULLET_DAMAGE = 10;



/* =====================================================
   ESTADO
===================================================== */

let playerHP = MAX_HP;

let kills = 0;

let totalKills =
    parseInt(
        localStorage.getItem(
            "friendTotalKills"
        )
    ) || 0;


let gameRunning = false;

let gameTime = 0;

let timerInterval = null;

let spawnTimeout = null;

let gameLoopId = null;

let eventInterval = null;

let keys = {};

let bullets = [];

let friends = [];

let bossActive = false;

let lastTime = 0;

let playerX = 50;

let playerY = 70;


/* Dirección de disparo */

let aimX = 0;

let aimY = -1;


/* Joystick */

let joystickActive = false;

let joystickPointerId = null;



/* =====================================================
   ACTUALIZAR TOTAL
===================================================== */

function updateTotalKillsDisplay() {

    totalKillCounterText.textContent =
        totalKills;

    startTotalKillsText.textContent =
        totalKills;

}



/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    playerHPText.textContent =
        playerHP;

    killCounterText.textContent =
        kills;

    totalKillCounterText.textContent =
        totalKills;

}



/* =====================================================
   POSICIÓN
===================================================== */

function resetPlayerPosition() {

    playerX = 50;

    playerY = 70;

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}



/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        if (
            key === "z" &&
            gameRunning
        ) {

            shoot();

        }


        if (
            [
                "w",
                "a",
                "s",
                "d",
                "z",
                "1",
                "2",
                "5"
            ].includes(key)
        ) {

            event.preventDefault();

        }


        /*
         * CÓDIGO SECRETO
         *
         * 1 2 2 5
         */

        handleSecretCode(key);

    }
);



document.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = false;

    }
);



/* =====================================================
   CÓDIGO 1225
===================================================== */

let secretCode = "";


function handleSecretCode(key) {

    if (
        ![
            "1",
            "2",
            "5"
        ].includes(key)
    ) {

        return;

    }


    secretCode += key;


    if (
        secretCode.length > 4
    ) {

        secretCode =
            secretCode.slice(-4);

    }


    if (
        secretCode === "1225"
    ) {

        localStorage.setItem(
            "friendAchievement10000",
            "true"
        );


        localStorage.setItem(
            "friendNoelleUnlocked",
            "true"
        );


        showEvent(
            "!!! NOELLE HOLIDAY UNLOCKED !!!"
        );


        secretCode = "";

    }

}



/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    function() {

        startGame();

    }
);



function startGame() {

    clearGame();


    startScreen.style.display =
        "none";

    game.style.display =
        "block";


    gameRunning =
        true;


    playerHP =
        MAX_HP;


    kills =
        0;


    gameTime =
        0;


    bossActive =
        false;


    aimX =
        0;

    aimY =
        -1;


    resetPlayerPosition();

    resetJoystick();

    updateHUD();

    updateTotalKillsDisplay();


    /*
     * Música
     */

    gameMusic.volume =
        0.40;


    gameMusic.currentTime =
        0;


    gameMusic.play()
        .catch(
            function() {}
        );


    /*
     * Timer
     */

    timerInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                gameTime++;

                updateTimer();

            },
            1000
        );


    /*
     * Friends
     */

    scheduleFriendSpawn();


    /*
     * Eventos
     */

    eventInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }


                if (
                    Math.random() < 0.15
                ) {

                    pipisRainEvent();

                }

            },
            15000
        );


    lastTime =
        performance.now();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   SALIR
===================================================== */

exitGameButton.addEventListener(
    "click",
    function() {

        exitGame();

    }
);



function exitGame() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );


    clearInterval(
        eventInterval
    );


    clearTimeout(
        spawnTimeout
    );


    cancelAnimationFrame(
        gameLoopId
    );


    gameMusic.pause();


    clearGame();


    window.location.href =
        "index.html";

}



/* =====================================================
   LIMPIAR
===================================================== */

function clearGame() {

    clearTimeout(
        spawnTimeout
    );


    friends.forEach(
        function(friend) {

            if (
                friend.parentNode
            ) {

                friend.remove();

            }

        }
    );


    friends = [];


    bullets.forEach(
        function(bullet) {

            if (
                bullet.parentNode
            ) {

                bullet.remove();

            }

        }
    );


    bullets = [];


    document
        .querySelectorAll(".triangle")
        .forEach(
            function(item) {

                item.remove();

            }
        );


    document
        .querySelectorAll(".healingPipis")
        .forEach(
            function(item) {

                item.remove();

            }
        );

}



/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }


    const delta =
        time - lastTime;


    lastTime =
        time;


    movePlayer();

    updateBullets();

    updateFriends();

    updateTriangles();

    checkCollisions();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   MOVIMIENTO PLAYER
===================================================== */

function movePlayer() {

    let moveX = 0;

    let moveY = 0;


    if (keys["w"]) {
        moveY -= 1;
    }

    if (keys["s"]) {
        moveY += 1;
    }

    if (keys["a"]) {
        moveX -= 1;
    }

    if (keys["d"]) {
        moveX += 1;
    }


    /*
     * Joystick
     */

    if (joystickActive) {

        moveX += joystickMoveX;

        moveY += joystickMoveY;

    }


    const magnitude =
        Math.sqrt(
            moveX * moveX +
            moveY * moveY
        );


    if (
        magnitude > 0
    ) {

        if (
            magnitude > 1
        ) {

            moveX /= magnitude;
            moveY /= magnitude;

        }


        playerX +=
            moveX *
            PLAYER_SPEED;


        playerY +=
            moveY *
            PLAYER_SPEED;

    }


    playerX =
        Math.max(
            5,
            Math.min(
                95,
                playerX
            )
        );


    playerY =
        Math.max(
            8,
            Math.min(
                92,
                playerY
            )
        );


    player.style.left =
        playerX + "%";


    player.style.top =
        playerY + "%";

}



/* =====================================================
   JOYSTICK
===================================================== */

let joystickMoveX = 0;

let joystickMoveY = 0;



function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystickBase.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;


    let dy =
        clientY -
        centerY;


    const maxDistance =
        rect.width * 0.35;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > maxDistance
    ) {

        dx =
            dx /
            distance *
            maxDistance;


        dy =
            dy /
            distance *
            maxDistance;

    }


    joystickStick.style.transform =
        `translate(${dx}px, ${dy}px)`;


    joystickMoveX =
        dx /
        maxDistance;


    joystickMoveY =
        dy /
        maxDistance;


    /*
     * El joystick también controla
     * hacia dónde dispara Spamton.
     */

    if (
        distance > 8
    ) {

        aimX =
            joystickMoveX;

        aimY =
            joystickMoveY;

    }

}



/* =====================================================
   JOYSTICK TOUCH
===================================================== */

joystickBase.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        joystickActive =
            true;

        joystickPointerId =
            event.pointerId;


        joystickBase.setPointerCapture(
            event.pointerId
        );


        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);



joystickBase.addEventListener(
    "pointermove",
    function(event) {

        if (
            !joystickActive
        ) {

            return;

        }


        if (
            event.pointerId !==
            joystickPointerId
        ) {

            return;

        }


        event.preventDefault();


        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);



function stopJoystick() {

    joystickActive =
        false;


    joystickPointerId =
        null;


    joystickMoveX =
        0;


    joystickMoveY =
        0;


    resetJoystick();

}



joystickBase.addEventListener(
    "pointerup",
    stopJoystick
);


joystickBase.addEventListener(
    "pointercancel",
    stopJoystick
);



function resetJoystick() {

    joystickStick.style.transform =
        "translate(0px, 0px)";

}



/* =====================================================
   ATAQUE
===================================================== */

attackButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        if (
            gameRunning
        ) {

            shoot();

        }

    }
);



/* =====================================================
   DISPARAR
===================================================== */

function shoot() {

    if (!gameRunning) {
        return;
    }


    /*
     * Si no se está usando joystick,
     * dispara hacia arriba.
     */

    let directionX =
        aimX;

    let directionY =
        aimY;


    /*
     * Evitar dirección 0,0
     */

    if (
        Math.abs(directionX) < 0.05 &&
        Math.abs(directionY) < 0.05
    ) {

        directionX = 0;
        directionY = -1;

    }


    const magnitude =
        Math.sqrt(
            directionX * directionX +
            directionY * directionY
        );


    directionX /=
        magnitude;


    directionY /=
        magnitude;


    const bullet =
        document.createElement("img");


    bullet.src =
        "pipis.gif";


    bullet.className =
        "bullet";


    bullet.dataset.x =
        playerX;


    bullet.dataset.y =
        playerY;


    bullet.dataset.dx =
        directionX;


    bullet.dataset.dy =
        directionY;


    bullet.style.left =
        playerX + "%";


    bullet.style.top =
        playerY + "%";


    bulletsContainer.appendChild(
        bullet
    );


    bullets.push(
        bullet
    );

}



/* =====================================================
   BALAS
===================================================== */

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];


        let x =
            parseFloat(
                bullet.dataset.x
            );


        let y =
            parseFloat(
                bullet.dataset.y
            );


        const dx =
            parseFloat(
                bullet.dataset.dx
            );


        const dy =
            parseFloat(
                bullet.dataset.dy
            );


        x +=
            dx *
            BULLET_SPEED;


        y +=
            dy *
            BULLET_SPEED;


        bullet.dataset.x =
            x;


        bullet.dataset.y =
            y;


        bullet.style.left =
            x + "%";


        bullet.style.top =
            y + "%";


        /*
         * Rotación del Pipis
         */

        const angle =
            Math.atan2(
                dy,
                dx
            ) *
            180 /
            Math.PI;


        bullet.style.transform =
            `translate(-50%, -50%) rotate(${angle + 90}deg)`;


        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            bullet.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   SPAWN FRIEND
===================================================== */

function scheduleFriendSpawn() {

    if (!gameRunning) {
        return;
    }


    const delay =
        Math.random() *
        1600 +
        700;


    spawnTimeout =
        setTimeout(
            function() {

                if (!gameRunning) {
                    return;
                }


                spawnFriend();


                scheduleFriendSpawn();

            },
            delay
        );

}



/* =====================================================
   CREAR FRIEND
===================================================== */

function spawnFriend() {

    if (!gameRunning) {
        return;
    }


    let type =
        "normal";


    if (
        kills >= 1000
    ) {

        const random =
            Math.random();


        if (
            random < 0.30
        ) {

            type =
                "glitch";

        }

        else if (
            random < 0.60
        ) {

            type =
                "red";

        }

    }

    else if (
        kills >= 100
    ) {

        if (
            Math.random() < 0.40
        ) {

            type =
                "red";

        }

    }


    const friend =
        document.createElement("img");


    friend.src =
        "friend-sprite.gif";


    friend.className =
        "friend";


    friend.classList.add(
        "friend-" + type
    );


    /*
     * ENTRADA DESDE LOS BORDES
     */

    const side =
        Math.floor(
            Math.random() * 4
        );


    let x;
    let y;


    if (
        side === 0
    ) {

        /*
         * Arriba
         */

        x =
            Math.random() *
            100;

        y =
            -8;

    }

    else if (
        side === 1
    ) {

        /*
         * Derecha
         */

        x =
            108;

        y =
            Math.random() *
            100;

    }

    else if (
        side === 2
    ) {

        /*
         * Abajo
         */

        x =
            Math.random() *
            100;

        y =
            108;

    }

    else {

        /*
         * Izquierda
         */

        x =
            -8;

        y =
            Math.random() *
            100;

    }


    friend.style.left =
        x + "%";


    friend.style.top =
        y + "%";


    /*
     * VIDA
     */

    let hp =
        20;


    if (
        type === "red"
    ) {

        hp =
            45;

    }


    if (
        type === "glitch"
    ) {

        hp =
            75;

    }


    friend.dataset.hp =
        hp;


    friend.dataset.x =
        x;


    friend.dataset.y =
        y;


    friend.dataset.type =
        type;


    /*
     * Pequeñas colas del glitch
     */

    friend.dataset.trailTimer =
        "0";


    friendsContainer.appendChild(
        friend
    );


    friends.push(
        friend
    );


    /*
     * BOSS
     */

    if (
        totalKills >= 100 &&
        !bossActive
    ) {

        spawnBoss();

    }

}



/* =====================================================
   BOSS
===================================================== */

function spawnBoss() {

    if (bossActive) {
        return;
    }


    bossActive =
        true;


    showEvent(
        "!!! BOSS FRIEND !!!"
    );


    const boss =
        document.createElement("img");


    boss.src =
        "friend-sprite.gif";


    boss.className =
        "friend boss";


    boss.style.left =
        "50%";


    boss.style.top =
        "-10%";


    boss.dataset.hp =
        "500";


    boss.dataset.x =
        "50";


    boss.dataset.y =
        "-10";


    boss.dataset.type =
        "boss";


    friendsContainer.appendChild(
        boss
    );


    friends.push(
        boss
    );

}



/* =====================================================
   MOVER FRIENDS
===================================================== */

function updateFriends() {

    for (
        let i = friends.length - 1;
        i >= 0;
        i--
    ) {

        const friend =
            friends[i];


        if (
            !friend.parentNode
        ) {

            friends.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                friend.dataset.x
            );


        let y =
            parseFloat(
                friend.dataset.y
            );


        const type =
            friend.dataset.type;


        const dx =
            playerX - x;


        const dy =
            playerY - y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        let speed =
            0.035;


        if (
            type === "red"
        ) {

            speed =
                0.055;

        }


        if (
            type === "glitch"
        ) {

            speed =
                0.075;

        }


        if (
            type === "boss"
        ) {

            speed =
                0.025;

        }


        /*
         * Todos persiguen al jugador
         */

        if (
            distance > 4
        ) {

            x +=
                (
                    dx /
                    distance
                ) *
                speed;


            y +=
                (
                    dy /
                    distance
                ) *
                speed;

        }


        /*
         * Daño por contacto
         */

        if (
            distance < 5
        ) {

            if (
                type === "red"
            ) {

                damagePlayer(
                    RED_DAMAGE
                );

            }

            else if (
                type === "glitch"
            ) {

                damagePlayer(
                    GLITCH_DAMAGE
                );

            }

            else if (
                type === "boss"
            ) {

                damagePlayer(
                    BOSS_DAMAGE
                );

            }

            else {

                damagePlayer(
                    NORMAL_DAMAGE
                );

            }

        }


        friend.dataset.x =
            x;


        friend.dataset.y =
            y;


        friend.style.left =
            x + "%";


        friend.style.top =
            y + "%";


        /*
         * GLITCH LANZA COLAS
         */

        if (
            type === "glitch"
        ) {

            let trailTimer =
                parseInt(
                    friend.dataset.trailTimer
                ) || 0;


            trailTimer++;


            if (
                trailTimer >= 12
            ) {

                createGlitchTrail(
                    x,
                    y
                );


                trailTimer =
                    0;

            }


            friend.dataset.trailTimer =
                trailTimer;

        }


        /*
         * BOSS LANZA TRIÁNGULOS
         */

        if (
            type === "boss"
        ) {

            if (
                Math.random() <
                0.012
            ) {

                spawnTriangle(
                    x,
                    y
                );

            }

        }

    }

}



/* =====================================================
   COLA GLITCH
===================================================== */

function createGlitchTrail(
    x,
    y
) {

    const trail =
        document.createElement("div");


    trail.className =
        "glitchTrail";


    trail.style.left =
        x + "%";


    trail.style.top =
        y + "%";


    trianglesContainer.appendChild(
        trail
    );


    setTimeout(
        function() {

            trail.remove();

        },
        350
    );

}



/* =====================================================
   TRIÁNGULO
===================================================== */

function spawnTriangle(
    x,
    y
) {

    const triangle =
        document.createElement("div");


    triangle.className =
        "triangle";


    triangle.style.left =
        x + "%";


    triangle.style.top =
        y + "%";


    /*
     * Dirección FIJA.
     *
     * Ya no persigue al jugador.
     */

    const angle =
        Math.random() *
        Math.PI *
        2;


    triangle.dataset.x =
        x;


    triangle.dataset.y =
        y;


    triangle.dataset.dx =
        Math.cos(angle);


    triangle.dataset.dy =
        Math.sin(angle);


    triangle.dataset.life =
        "0";


    trianglesContainer.appendChild(
        triangle
    );

}



/* =====================================================
   ACTUALIZAR TRIÁNGULOS
===================================================== */

function updateTriangles() {

    const list =
        document.querySelectorAll(
            ".triangle"
        );


    list.forEach(
        function(triangle) {

            let x =
                parseFloat(
                    triangle.dataset.x
                );


            let y =
                parseFloat(
                    triangle.dataset.y
                );


            const dx =
                parseFloat(
                    triangle.dataset.dx
                );


            const dy =
                parseFloat(
                    triangle.dataset.dy
                );


            x +=
                dx *
                0.13;


            y +=
                dy *
                0.13;


            triangle.dataset.x =
                x;


            triangle.dataset.y =
                y;


            triangle.style.left =
                x + "%";


            triangle.style.top =
                y + "%";


            /*
             * Vida máxima
             */

            let life =
                parseInt(
                    triangle.dataset.life
                );


            life++;


            triangle.dataset.life =
                life;


            /*
             * Desaparece después de cierto tiempo
             */

            if (
                life > 500 ||
                x < -15 ||
                x > 115 ||
                y < -15 ||
                y > 115
            ) {

                triangle.remove();

                return;

            }


            /*
             * Colisión
             */

            const distance =
                Math.sqrt(
                    Math.pow(
                        playerX - x,
                        2
                    ) +
                    Math.pow(
                        playerY - y,
                        2
                    )
                );


            if (
                distance < 4
            ) {

                damagePlayer(
                    15
                );


                triangle.remove();

            }

        }
    );

}



/* =====================================================
   COLISIONES BALAS
===================================================== */

function checkCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        const bullet =
            bullets[b];


        const bulletX =
            parseFloat(
                bullet.dataset.x
            );


        const bulletY =
            parseFloat(
                bullet.dataset.y
            );


        for (
            let f = friends.length - 1;
            f >= 0;
            f--
        ) {

            const friend =
                friends[f];


            if (
                !friend.parentNode
            ) {

                continue;

            }


            const friendX =
                parseFloat(
                    friend.dataset.x
                );


            const friendY =
                parseFloat(
                    friend.dataset.y
                );


            const distance =
                Math.sqrt(
                    Math.pow(
                        bulletX -
                        friendX,
                        2
                    ) +
                    Math.pow(
                        bulletY -
                        friendY,
                        2
                    )
                );


            if (
                distance < 7
            ) {

                hitFriend(
                    friend,
                    bullet
                );


                break;

            }

        }

    }

}



/* =====================================================
   GOLPE FRIEND
===================================================== */

function hitFriend(
    friend,
    bullet
) {

    const index =
        bullets.indexOf(
            bullet
        );


    if (
        index !== -1
    ) {

        bullets.splice(
            index,
            1
        );

    }


    bullet.remove();


    let hp =
        parseInt(
            friend.dataset.hp
        );


    hp -=
        BULLET_DAMAGE;


    friend.dataset.hp =
        hp;


    if (
        hp <= 0
    ) {

        killFriend(
            friend
        );

    }

}



/* =====================================================
   MATAR FRIEND
===================================================== */

function killFriend(
    friend
) {

    friendLaugh.currentTime =
        0;


    friendLaugh.volume =
        0.20;


    friendLaugh.play()
        .catch(
            function() {}
        );


    kills++;

    totalKills++;


    localStorage.setItem(
        "friendTotalKills",
        totalKills
    );


    updateHUD();

    updateTotalKillsDisplay();


    const index =
        friends.indexOf(
            friend
        );


    if (
        index !== -1
    ) {

        friends.splice(
            index,
            1
        );

    }


    friend.remove();


    checkAchievements();

}



/* =====================================================
   DAÑO
===================================================== */

let damageCooldown =
    false;


function damagePlayer(
    amount
) {

    if (!gameRunning) {
        return;
    }


    /*
     * Cooldown de daño
     */

    if (
        damageCooldown
    ) {

        return;

    }


    damageCooldown =
        true;


    playerHP -=
        amount;


    if (
        playerHP < 0
    ) {

        playerHP =
            0;

    }


    updateHUD();


    player.classList.remove(
        "playerHit"
    );


    void player.offsetWidth;


    player.classList.add(
        "playerHit"
    );


    setTimeout(
        function() {

            player.classList.remove(
                "playerHit"
            );

        },
        300
    );


    setTimeout(
        function() {

            damageCooldown =
                false;

        },
        3000
    );


    if (
        playerHP <= 0
    ) {

        gameOver();

    }

}



/* =====================================================
   LLUVIA PIPIS
===================================================== */

function pipisRainEvent() {

    if (!gameRunning) {
        return;
    }


    showEvent(
        "!!! PIPIS RAIN !!!"
    );


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const pipis =
            document.createElement("img");


        pipis.src =
            "pipis.gif";


        pipis.className =
            "healingPipis";


        pipis.style.left =
            Math.random() *
            100 +
            "%";


        pipis.style.animationDelay =
            Math.random() *
            1.5 +
            "s";


        pipisContainer.appendChild(
            pipis
        );


        setTimeout(
            function() {

                if (
                    pipis.parentNode
                ) {

                    pipis.remove();

                }

            },
            5000
        );

    }


    playerHP +=
        100;


    if (
        playerHP > MAX_HP
    ) {

        playerHP =
            MAX_HP;

    }


    updateHUD();

}



/* =====================================================
   LOGROS
===================================================== */

function checkAchievements() {

    /*
     * BERDLY
     */

    if (
        totalKills >= 100 &&
        localStorage.getItem(
            "friendAchievement100"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement100",
            "true"
        );


        localStorage.setItem(
            "friendBerdlyUnlocked",
            "true"
        );


        showAchievement(
            "BERDLY UNLOCKED!",
            "berdly"
        );

    }


    /*
     * SUSIE
     */

    if (
        totalKills >= 1000 &&
        localStorage.getItem(
            "friendAchievement1000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement1000",
            "true"
        );


        localStorage.setItem(
            "friendSusieUnlocked",
            "true"
        );


        showAchievement(
            "SUSIE UNLOCKED!",
            "susie"
        );

    }


    /*
     * NOELLE
     */

    if (
        totalKills >= 10000 &&
        localStorage.getItem(
            "friendAchievement10000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement10000",
            "true"
        );


        localStorage.setItem(
            "friendNoelleUnlocked",
            "true"
        );


        showAchievement(
            "NOELLE HOLIDAY UNLOCKED!",
            "noelle"
        );

    }

}



/* =====================================================
   MENSAJE LOGRO
===================================================== */

function showAchievement(
    message,
    character
) {

    const box =
        document.createElement("div");


    box.className =
        "achievementPopup";


    const text =
        document.createElement("div");


    text.textContent =
        message;


    box.appendChild(
        text
    );


    /*
     * Imágenes opcionales
     */

    let imageFile =
        null;


    if (
        character === "berdly"
    ) {

        imageFile =
            "berdly.png";

    }


    if (
        character === "susie"
    ) {

        imageFile =
            "susie-eating-pancakes.gif";

    }


    if (
        character === "noelle"
    ) {

        imageFile =
            "noelle.png";

    }


    if (
        imageFile
    ) {

        const image =
            document.createElement("img");


        image.src =
            imageFile;


        image.className =
            "achievementCharacter";


        image.onerror =
            function() {

                image.remove();

            };


        box.appendChild(
            image
        );

    }


    document.body.appendChild(
        box
    );


    setTimeout(
        function() {

            box.classList.add(
                "show"
            );

        },
        50
    );


    setTimeout(
        function() {

            box.classList.remove(
                "show"
            );


            setTimeout(
                function() {

                    box.remove();

                },
                500
            );

        },
        4000
    );

}



/* =====================================================
   EVENTOS
===================================================== */

let eventMessageTimeout =
    null;


function showEvent(
    message
) {

    eventMessage.textContent =
        message;


    eventMessage.classList.add(
        "show"
    );


    clearTimeout(
        eventMessageTimeout
    );


    eventMessageTimeout =
        setTimeout(
            function() {

                eventMessage.classList.remove(
                    "show"
                );

            },
            2500
        );

}



/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    const minutes =
        Math.floor(
            gameTime / 60
        );


    const seconds =
        gameTime % 60;


    timerText.textContent =
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":"
        +
        String(seconds)
            .padStart(
                2,
                "0"
            );

}



/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );


    clearInterval(
        eventInterval
    );


    clearTimeout(
        spawnTimeout
    );


    cancelAnimationFrame(
        gameLoopId
    );


    gameMusic.pause();


    showEvent(
        "GAME OVER"
    );


    setTimeout(
        function() {

            game.style.display =
                "none";


            startScreen.style.display =
                "flex";


            startTotalKillsText.textContent =
                totalKills;


            updateTotalKillsDisplay();

        },
        2000
    );

}



/* =====================================================
   INICIALIZACIÓN
===================================================== */

updateTotalKillsDisplay();

updateHUD();

resetPlayerPosition();

resetJoystick();


</script>
