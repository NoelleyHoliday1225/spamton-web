<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FRIEND DESTROYER</title>

    <link
        rel="stylesheet"
        href="friend-destroyer.css"
    >

</head>


<body>


<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="warning">
            !!! WARNING !!!
        </div>

        <h1>
            FRIEND DESTROYER
        </h1>

        <p>
            DESTROY THEM ALL.
        </p>

        <p>
            W A S D = MOVE
        </p>

        <p>
            Z = SHOOT
        </p>

        <div class="startStats">

            <div>
                TOTAL KILLS:
                <span id="startTotalKills">
                    0
                </span>
            </div>

        </div>


        <button
            id="startButton"
            type="button"
        >
            [ START GAME ]
        </button>


        <br>
        <br>


        <a
            href="index.html"
            class="backButton"
        >
            [ BACK TO SPAMTON SHOP ]
        </a>

    </div>

</div>



<!-- =====================================================
     JUEGO
===================================================== -->

<div id="game">


    <!-- =================================================
         BOTÓN PARA SALIR
    ================================================== -->

    <button
        id="exitGameButton"
        type="button"
    >
        [ EXIT GAME ]
    </button>



    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">


        <div class="hudBox">

            HP:

            <span id="playerHP">
                450
            </span>

            / 450

        </div>



        <div class="hudBox">

            KILLS:

            <span id="killCounter">
                0
            </span>

        </div>



        <div class="hudBox totalKillsBox">

            TOTAL KILLS:

            <span id="totalKillCounter">
                0
            </span>

        </div>



        <div class="hudBox">

            TIME:

            <span id="timer">
                00:00
            </span>

        </div>


    </div>



    <!-- =================================================
         ÁREA DEL JUEGO
    ================================================== -->

    <div id="gameArea">


        <!-- PLATAFORMA -->

        <div id="platform"></div>



        <!-- SPAMTON -->

        <img
            src="spamton-gun-game.gif"
            id="player"
            class="gameSprite"
            alt="Spamton"
        >



        <!-- FRIENDS -->

        <div id="friends"></div>



        <!-- PIPIS -->

        <div id="pipisRain"></div>



        <!-- BALAS -->

        <div id="bullets"></div>



        <!-- TRIÁNGULOS -->

        <div id="triangles"></div>


    </div>



    <!-- =================================================
         MENSAJE DE EVENTO
    ================================================== -->

    <div id="eventMessage"></div>


</div>



<!-- =====================================================
     MÚSICA
===================================================== -->

<audio
    id="gameMusic"
    src="big-shot.mp3"
    loop
    preload="auto"
></audio>



<!-- =====================================================
     RISA FRIEND
===================================================== -->

<audio
    id="friendLaugh"
    src="friend-laugh.mp3"
    preload="auto"
></audio>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const game =
    document.getElementById("game");

const gameArea =
    document.getElementById("gameArea");

const player =
    document.getElementById("player");

const friendsContainer =
    document.getElementById("friends");

const bulletsContainer =
    document.getElementById("bullets");

const trianglesContainer =
    document.getElementById("triangles");

const pipisContainer =
    document.getElementById("pipisRain");

const playerHPText =
    document.getElementById("playerHP");

const killCounterText =
    document.getElementById("killCounter");

const totalKillCounterText =
    document.getElementById("totalKillCounter");

const startTotalKillsText =
    document.getElementById("startTotalKills");

const timerText =
    document.getElementById("timer");

const eventMessage =
    document.getElementById("eventMessage");

const gameMusic =
    document.getElementById("gameMusic");

const friendLaugh =
    document.getElementById("friendLaugh");



/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MAX_HP = 450;

const PLAYER_SPEED = 0.35;

const BULLET_SPEED = 1.6;

const FRIEND_DAMAGE = 10;

const FRIEND_SHOT_DAMAGE = 10;


/* =====================================================
   ESTADO DEL JUEGO
===================================================== */

let playerHP = MAX_HP;

let kills = 0;


/*
 * TOTAL DE KILLS PERMANENTE
 */

let totalKills =
    parseInt(
        localStorage.getItem(
            "friendTotalKills"
        )
    ) || 0;


let gameRunning = false;

let gameTime = 0;

let timerInterval = null;

let spawnTimeout = null;

let gameLoopId = null;

let eventInterval = null;

let keys = {};

let bullets = [];

let friends = [];

let bossActive = false;

let lastTime = 0;

let playerX = 50;

let playerY = 75;

let shootCooldown = false;



/* =====================================================
   POSICIÓN INICIAL
===================================================== */

function resetPlayerPosition() {

    playerX = 50;

    playerY = 75;

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}



/* =====================================================
   ACTUALIZAR TOTAL EN PANTALLA
===================================================== */

function updateTotalKillsDisplay() {

    totalKillCounterText.textContent =
        totalKills;

    startTotalKillsText.textContent =
        totalKills;

}



/* =====================================================
   ACTUALIZAR HUD
===================================================== */

function updateHUD() {

    playerHPText.textContent =
        playerHP;

    killCounterText.textContent =
        kills;

    totalKillCounterText.textContent =
        totalKills;

}



/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        /*
         * Z = DISPARAR
         */

        if (
            key === "z" &&
            gameRunning
        ) {

            shoot();

        }


        /*
         * Evitar scroll con teclas
         */

        if (
            [
                "w",
                "a",
                "s",
                "d",
                "z"
            ].includes(key)
        ) {

            event.preventDefault();

        }

    }
);



document.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = false;

    }
);



/* =====================================================
   BOTÓN START
===================================================== */

startButton.addEventListener(
    "click",
    function() {

        startGame();

    }
);



/* =====================================================
   INICIAR JUEGO
===================================================== */

function startGame() {

    /*
     * Limpiar estado anterior
     */

    clearGame();


    startScreen.style.display =
        "none";


    game.style.display =
        "block";


    gameRunning =
        true;


    playerHP =
        MAX_HP;


    kills =
        0;


    gameTime =
        0;


    bossActive =
        false;


    resetPlayerPosition();


    updateHUD();

    updateTotalKillsDisplay();


    /*
     * Música
     *
     * El usuario acaba de pulsar START,
     * por lo que el navegador permite reproducirla.
     */

    gameMusic.volume =
        0.40;

    gameMusic.currentTime =
        0;

    gameMusic.play()
        .catch(
            function(error) {

                console.log(
                    "No se pudo iniciar Big Shot:",
                    error
                );

            }
        );


    /*
     * Temporizador
     */

    timerInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                gameTime++;

                updateTimer();

            },
            1000
        );


    /*
     * Friends
     */

    scheduleFriendSpawn();


    /*
     * Eventos aleatorios
     */

    eventInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }


                /*
                 * 15% de probabilidad
                 */

                if (
                    Math.random() < 0.15
                ) {

                    pipisRainEvent();

                }

            },
            15000
        );


    /*
     * Bucle
     */

    lastTime =
        performance.now();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   SALIR DEL JUEGO
===================================================== */

exitGameButton.addEventListener(
    "click",
    function() {

        exitGame();

    }
);



function exitGame() {

    gameRunning =
        false;


    /*
     * Detener temporizadores
     */

    clearInterval(
        timerInterval
    );

    clearInterval(
        eventInterval
    );

    clearTimeout(
        spawnTimeout
    );


    /*
     * Detener música
     */

    gameMusic.pause();

    gameMusic.currentTime =
        0;


    /*
     * Limpiar juego
     */

    clearGame();


    /*
     * Volver a Spamton Shop
     */

    window.location.href =
        "index.html";

}



/* =====================================================
   LIMPIAR JUEGO
===================================================== */

function clearGame() {

    clearTimeout(
        spawnTimeout
    );


    /*
     * Eliminar Friends
     */

    friends.forEach(
        function(friend) {

            if (
                friend.parentNode
            ) {

                friend.remove();

            }

        }
    );


    friends =
        [];


    /*
     * Eliminar balas
     */

    bullets.forEach(
        function(bullet) {

            if (
                bullet.parentNode
            ) {

                bullet.remove();

            }

        }
    );


    bullets =
        [];


    /*
     * Eliminar triángulos
     */

    document
        .querySelectorAll(".triangle")
        .forEach(
            function(triangle) {

                triangle.remove();

            }
        );


    /*
     * Eliminar Pipis
     */

    document
        .querySelectorAll(".healingPipis")
        .forEach(
            function(pipis) {

                pipis.remove();

            }
        );

}



/* =====================================================
   BUCLE PRINCIPAL
===================================================== */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }


    const delta =
        time - lastTime;


    lastTime =
        time;


    movePlayer();

    updateBullets(delta);

    updateFriends(delta);

    updateTriangles(delta);

    checkCollisions();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   MOVER JUGADOR
===================================================== */

function movePlayer() {

    if (keys["w"]) {

        playerY -=
            PLAYER_SPEED;

    }


    if (keys["s"]) {

        playerY +=
            PLAYER_SPEED;

    }


    if (keys["a"]) {

        playerX -=
            PLAYER_SPEED;

    }


    if (keys["d"]) {

        playerX +=
            PLAYER_SPEED;

    }


    /*
     * Límites
     */

    playerX =
        Math.max(
            5,
            Math.min(
                95,
                playerX
            )
        );


    playerY =
        Math.max(
            10,
            Math.min(
                90,
                playerY
            )
        );


    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}



/* =====================================================
   DISPARAR PIPIS
===================================================== */

function shoot() {

    if (
        shootCooldown
    ) {

        return;

    }


    shootCooldown =
        true;


    setTimeout(
        function() {

            shootCooldown =
                false;

        },
        100
    );


    const bullet =
        document.createElement(
            "img"
        );


    bullet.src =
        "pipis.gif";


    bullet.className =
        "bullet";


    const x =
        playerX;


    const y =
        playerY - 5;


    bullet.dataset.x =
        x;

    bullet.dataset.y =
        y;


    bullet.style.left =
        x + "%";

    bullet.style.top =
        y + "%";


    bulletsContainer.appendChild(
        bullet
    );


    bullets.push(
        bullet
    );

}



/* =====================================================
   ACTUALIZAR BALAS
===================================================== */

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];


        let y =
            parseFloat(
                bullet.dataset.y
            );


        y -=
            BULLET_SPEED;


        bullet.dataset.y =
            y;


        bullet.style.top =
            y + "%";


        /*
         * Fuera de pantalla
         */

        if (
            y < -10
        ) {

            bullet.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   PROGRAMAR FRIEND
===================================================== */

function scheduleFriendSpawn() {

    if (!gameRunning) {
        return;
    }


    /*
     * Entre 1 y 3 segundos
     */

    const delay =
        Math.random() *
        2000 +
        1000;


    spawnTimeout =
        setTimeout(
            function() {

                if (!gameRunning) {
                    return;
                }


                spawnFriend();

                scheduleFriendSpawn();

            },
            delay
        );

}



/* =====================================================
   CREAR FRIEND
===================================================== */

function spawnFriend() {

    if (!gameRunning) {
        return;
    }


    let type =
        "normal";


    /*
     * Los tipos dependen
     * de las kills de la partida.
     */

    if (
        kills >= 1000
    ) {

        type =
            Math.random() < 0.45
                ? "glitch"
                : "red";

    }

    else if (
        kills >= 100
    ) {

        type =
            Math.random() < 0.35
                ? "red"
                : "normal";

    }


    const friend =
        document.createElement(
            "img"
        );


    friend.src =
        "friend-sprite.gif";


    friend.className =
        "friend";


    friend.classList.add(
        "friend-" + type
    );


    /*
     * Posición
     */

    const x =
        Math.random() *
        80 +
        10;


    const y =
        Math.random() *
        65 +
        10;


    friend.style.left =
        x + "%";


    friend.style.top =
        y + "%";


    /*
     * Vida
     */

    let hp =
        20;


    if (
        type === "red"
    ) {

        hp =
            45;

    }


    if (
        type === "glitch"
    ) {

        hp =
            70;

    }


    friend.dataset.hp =
        hp;


    friend.dataset.x =
        x;


    friend.dataset.y =
        y;


    friend.dataset.type =
        type;


    friendsContainer.appendChild(
        friend
    );


    friends.push(
        friend
    );


    /*
     * Boss a las 100 kills
     */

    if (
        kills >= 100 &&
        !bossActive
    ) {

        spawnBoss();

    }

}



/* =====================================================
   CREAR BOSS
===================================================== */

function spawnBoss() {

    if (bossActive) {
        return;
    }


    bossActive =
        true;


    showEvent(
        "!!! BOSS FRIEND !!!"
    );


    const boss =
        document.createElement(
            "img"
        );


    boss.src =
        "friend-sprite.gif";


    boss.className =
        "friend boss";


    boss.style.left =
        "50%";


    boss.style.top =
        "15%";


    boss.dataset.hp =
        500;


    boss.dataset.x =
        50;


    boss.dataset.y =
        15;


    boss.dataset.type =
        "boss";


    friendsContainer.appendChild(
        boss
    );


    friends.push(
        boss
    );

}



/* =====================================================
   MOVER FRIENDS
===================================================== */

function updateFriends() {

    for (
        let i = friends.length - 1;
        i >= 0;
        i--
    ) {

        const friend =
            friends[i];


        if (
            !friend.parentNode
        ) {

            friends.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                friend.dataset.x
            );


        let y =
            parseFloat(
                friend.dataset.y
            );


        const type =
            friend.dataset.type;


        const dx =
            playerX - x;


        const dy =
            playerY - y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        let speed =
            0.025;


        if (
            type === "red"
        ) {

            speed =
                0.040;

        }


        if (
            type === "glitch"
        ) {

            speed =
                0.050;

        }


        if (
            type === "boss"
        ) {

            speed =
                0.008;

        }


        if (
            distance > 5
        ) {

            x +=
                (
                    dx /
                    distance
                ) *
                speed;


            y +=
                (
                    dy /
                    distance
                ) *
                speed;

        }

        else {

            damagePlayer(
                FRIEND_DAMAGE
            );

        }


        friend.dataset.x =
            x;


        friend.dataset.y =
            y;


        friend.style.left =
            x + "%";


        friend.style.top =
            y + "%";


        /*
         * Glitch y Boss lanzan triángulos
         */

        if (
            type === "boss" ||
            type === "glitch"
        ) {

            if (
                Math.random() <
                0.015
            ) {

                spawnTriangle(
                    x,
                    y
                );

            }

        }

    }

}



/* =====================================================
   TRIÁNGULOS
===================================================== */

function spawnTriangle(
    x,
    y
) {

    const triangle =
        document.createElement(
            "div"
        );


    triangle.className =
        "triangle";


    triangle.style.left =
        x + "%";


    triangle.style.top =
        y + "%";


    triangle.dataset.x =
        x;


    triangle.dataset.y =
        y;


    trianglesContainer.appendChild(
        triangle
    );

}



/* =====================================================
   ACTUALIZAR TRIÁNGULOS
===================================================== */

function updateTriangles() {

    const triangleList =
        document.querySelectorAll(
            ".triangle"
        );


    triangleList.forEach(
        function(triangle) {

            let x =
                parseFloat(
                    triangle.dataset.x
                );


            let y =
                parseFloat(
                    triangle.dataset.y
                );


            const dx =
                playerX - x;


            const dy =
                playerY - y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance > 0
            ) {

                x +=
                    (
                        dx /
                        distance
                    ) *
                    0.08;


                y +=
                    (
                        dy /
                        distance
                    ) *
                    0.08;

            }


            triangle.dataset.x =
                x;


            triangle.dataset.y =
                y;


            triangle.style.left =
                x + "%";


            triangle.style.top =
                y + "%";


            if (
                distance < 5
            ) {

                damagePlayer(
                    15
                );


                triangle.remove();

            }

        }
    );

}



/* =====================================================
   COLISIONES
===================================================== */

function checkCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        const bullet =
            bullets[b];


        if (
            !bullet.parentNode
        ) {

            bullets.splice(
                b,
                1
            );

            continue;

        }


        const bulletX =
            parseFloat(
                bullet.dataset.x
            );


        const bulletY =
            parseFloat(
                bullet.dataset.y
            );


        for (
            let f = friends.length - 1;
            f >= 0;
            f--
        ) {

            const friend =
                friends[f];


            if (
                !friend.parentNode
            ) {

                friends.splice(
                    f,
                    1
                );

                continue;

            }


            const friendX =
                parseFloat(
                    friend.dataset.x
                );


            const friendY =
                parseFloat(
                    friend.dataset.y
                );


            const distance =
                Math.sqrt(
                    Math.pow(
                        bulletX -
                        friendX,
                        2
                    )
                    +
                    Math.pow(
                        bulletY -
                        friendY,
                        2
                    )
                );


            if (
                distance < 7
            ) {

                hitFriend(
                    friend,
                    bullet
                );


                break;

            }

        }

    }

}



/* =====================================================
   GOLPEAR FRIEND
===================================================== */

function hitFriend(
    friend,
    bullet
) {

    /*
     * Eliminar bala
     */

    const bulletIndex =
        bullets.indexOf(
            bullet
        );


    if (
        bulletIndex !== -1
    ) {

        bullets.splice(
            bulletIndex,
            1
        );

    }


    bullet.remove();


    /*
     * Daño
     */

    let hp =
        parseInt(
            friend.dataset.hp
        );


    hp -=
        FRIEND_SHOT_DAMAGE;


    friend.dataset.hp =
        hp;


    /*
     * Efecto visual
     */

    friend.classList.add(
        "hit"
    );


    setTimeout(
        function() {

            friend.classList.remove(
                "hit"
            );

        },
        100
    );


    /*
     * Muerte
     */

    if (
        hp <= 0
    ) {

        killFriend(
            friend
        );

    }

}



/* =====================================================
   MATAR FRIEND
===================================================== */

function killFriend(
    friend
) {

    /*
     * Risa
     */

    friendLaugh.currentTime =
        0;


    friendLaugh.volume =
        0.20;


    friendLaugh.play()
        .catch(
            function() {}
        );


    /*
     * Kill de partida
     */

    kills++;


    /*
     * Kill acumulada
     */

    totalKills++;


    localStorage.setItem(
        "friendTotalKills",
        totalKills
    );


    updateHUD();


    updateTotalKillsDisplay();


    /*
     * Eliminar Friend
     */

    const index =
        friends.indexOf(
            friend
        );


    if (
        index !== -1
    ) {

        friends.splice(
            index,
            1
        );

    }


    friend.remove();


    /*
     * Logros
     */

    checkAchievements();

}



/* =====================================================
   DAÑO AL JUGADOR
===================================================== */

function damagePlayer(
    amount
) {

    if (!gameRunning) {
        return;
    }


    playerHP -=
        amount;


    if (
        playerHP < 0
    ) {

        playerHP =
            0;

    }


    updateHUD();


    player.classList.remove(
        "playerHit"
    );


    void player.offsetWidth;


    player.classList.add(
        "playerHit"
    );


    setTimeout(
        function() {

            player.classList.remove(
                "playerHit"
            );

        },
        150
    );


    if (
        playerHP <= 0
    ) {

        gameOver();

    }

}



/* =====================================================
   LLUVIA DE PIPIS
===================================================== */

function pipisRainEvent() {

    if (!gameRunning) {
        return;
    }


    showEvent(
        "!!! PIPIS RAIN !!!"
    );


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const pipis =
            document.createElement(
                "img"
            );


        pipis.src =
            "pipis.gif";


        pipis.className =
            "healingPipis";


        pipis.style.left =
            Math.random() *
            100 +
            "%";


        pipis.style.animationDelay =
            Math.random() *
            1.5 +
            "s";


        pipisContainer.appendChild(
            pipis
        );


        setTimeout(
            function() {

                if (
                    pipis.parentNode
                ) {

                    pipis.remove();

                }

            },
            5000
        );

    }


    /*
     * Curación
     */

    playerHP +=
        100;


    if (
        playerHP > MAX_HP
    ) {

        playerHP =
            MAX_HP;

    }


    updateHUD();

}



/* =====================================================
   LOGROS
===================================================== */

function checkAchievements() {


    /*
     * 100 KILLS
     */

    if (
        totalKills >= 100 &&
        localStorage.getItem(
            "friendAchievement100"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement100",
            "true"
        );


        showAchievement(
            "WOW! CONSEGUISTE 100 KILLS!"
        );

    }



    /*
     * 1000 KILLS
     */

    if (
        totalKills >= 1000 &&
        localStorage.getItem(
            "friendAchievement1000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement1000",
            "true"
        );


        showAchievement(
            "WOW! CONSEGUISTE 1000 KILLS!",
            true
        );

    }



    /*
     * 10000 KILLS
     */

    if (
        totalKills >= 10000 &&
        localStorage.getItem(
            "friendAchievement10000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement10000",
            "true"
        );


        showAchievement(
            "GRACIAS POR JUGAR Y PROBAR LA PAGINA DE SPAMTON, CON AMOR NOELIA"
        );

    }

}



/* =====================================================
   MENSAJE DE LOGRO
===================================================== */

function showAchievement(
    message,
    susie = false
) {

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "achievementPopup";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "achievementText";


    title.textContent =
        message;


    box.appendChild(
        title
    );


    /*
     * Imagen de Susie
     */

    if (
        susie
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            "susie-eating-pancakes.gif";


        image.className =
            "achievementSusie";


        box.appendChild(
            image
        );

    }


    document.body.appendChild(
        box
    );


    setTimeout(
        function() {

            box.classList.add(
                "achievementHide"
            );


            setTimeout(
                function() {

                    box.remove();

                },
                500
            );

        },
        5000
    );

}



/* =====================================================
   MENSAJE DE EVENTO
===================================================== */

let eventMessageTimeout =
    null;


function showEvent(
    message
) {

    eventMessage.textContent =
        message;


    eventMessage.classList.add(
        "show"
    );


    clearTimeout(
        eventMessageTimeout
    );


    eventMessageTimeout =
        setTimeout(
            function() {

                eventMessage.classList.remove(
                    "show"
                );

            },
            2500
        );

}



/* =====================================================
   TEMPORIZADOR
===================================================== */

function updateTimer() {

    const minutes =
        Math.floor(
            gameTime / 60
        );


    const seconds =
        gameTime % 60;


    timerText.textContent =
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":"
        +
        String(seconds)
            .padStart(
                2,
                "0"
            );

}



/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );


    clearInterval(
        eventInterval
    );


    clearTimeout(
        spawnTimeout
    );


    gameMusic.pause();


    showEvent(
        "GAME OVER"
    );


    setTimeout(
        function() {

            game.style.display =
                "none";


            startScreen.style.display =
                "flex";


            startTotalKillsText.textContent =
                totalKills;


            updateTotalKillsDisplay();


        },
        2000
    );

}



/* =====================================================
   ESTADO INICIAL
===================================================== */

updateTotalKillsDisplay();

updateHUD();

resetPlayerPosition();


</script>
