<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>FRIEND DESTROYER</title>

<link
    rel="stylesheet"
    href="friend-destroyer.css"
>

</head>


<body>


<!-- =====================================================
     PANTALLA INICIAL
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="warning">
            !!! WARNING !!!
        </div>

        <h1>
            FRIEND DESTROYER
        </h1>

        <p>
            DESTROY THEM ALL.
        </p>

        <p>
            PC: W A S D + Z
        </p>

        <p>
            MOBILE: USE BUTTONS
        </p>

        <div class="startStats">

            TOTAL KILLS:

            <span id="startTotalKills">
                0
            </span>

        </div>

        <button
            id="startButton"
            type="button"
        >
            [ START GAME ]
        </button>

        <br>
        <br>

        <a
            href="index.html"
            class="backButton"
        >
            [ BACK TO SPAMTON ]
        </a>

    </div>

</div>



<!-- =====================================================
     JUEGO
===================================================== -->

<div id="game">


    <button
        id="exitGameButton"
        type="button"
    >
        [ EXIT ]
    </button>


    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">

        <div class="hudBox">

            HP:

            <span id="playerHP">
                450
            </span>

            / 450

        </div>


        <div class="hudBox">

            KILLS:

            <span id="killCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TOTAL:

            <span id="totalKillCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TIME:

            <span id="timer">
                00:00
            </span>

        </div>

    </div>



    <!-- =================================================
         GAME AREA
    ================================================== -->

    <div id="gameArea">

        <div id="platform"></div>


        <img
            src="spamton-gun-game.gif"
            id="player"
            alt="Spamton"
        >


        <div id="friends"></div>

        <div id="bullets"></div>

        <div id="triangles"></div>

        <div id="tails"></div>

        <div id="pipisRain"></div>

    </div>



    <!-- =================================================
         CONTROLES
         Funcionan en PC Y MOBILE
    ================================================== -->

    <div id="mobileControls">

        <div id="movementControls">

            <button
                class="controlButton"
                id="moveUp"
                type="button"
            >
                ▲
            </button>


            <div class="middleControls">

                <button
                    class="controlButton"
                    id="moveLeft"
                    type="button"
                >
                    ◀
                </button>


                <button
                    class="controlButton"
                    id="moveDown"
                    type="button"
                >
                    ▼
                </button>


                <button
                    class="controlButton"
                    id="moveRight"
                    type="button"
                >
                    ▶
                </button>

            </div>

        </div>


        <button
            id="fireButton"
            type="button"
        >
            PIPIS
        </button>

    </div>



    <div id="eventMessage"></div>

</div>



<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="gameMusic"
    src="big-shot.mp3"
    loop
    preload="auto"
></audio>


<audio
    id="friendLaugh"
    src="friend-laugh.mp3"
    preload="auto"
></audio>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const game =
    document.getElementById("game");

const gameArea =
    document.getElementById("gameArea");

const player =
    document.getElementById("player");

const friendsContainer =
    document.getElementById("friends");

const bulletsContainer =
    document.getElementById("bullets");

const trianglesContainer =
    document.getElementById("triangles");

const tailsContainer =
    document.getElementById("tails");

const pipisContainer =
    document.getElementById("pipisRain");

const playerHPText =
    document.getElementById("playerHP");

const killCounterText =
    document.getElementById("killCounter");

const totalKillCounterText =
    document.getElementById("totalKillCounter");

const startTotalKillsText =
    document.getElementById("startTotalKills");

const timerText =
    document.getElementById("timer");

const eventMessage =
    document.getElementById("eventMessage");

const gameMusic =
    document.getElementById("gameMusic");

const friendLaugh =
    document.getElementById("friendLaugh");



/* =====================================================
   CONTROLES
===================================================== */

const moveUp =
    document.getElementById("moveUp");

const moveDown =
    document.getElementById("moveDown");

const moveLeft =
    document.getElementById("moveLeft");

const moveRight =
    document.getElementById("moveRight");

const fireButton =
    document.getElementById("fireButton");



/* =====================================================
   CONFIGURACION
===================================================== */

const MAX_HP =
    450;


const PLAYER_SPEED =
    0.38;


const BULLET_SPEED =
    1.45;


const NORMAL_DAMAGE =
    10;


const RED_DAMAGE =
    15;


const GLITCH_DAMAGE =
    20;


const PLAYER_HIT_COOLDOWN =
    3000;



/* =====================================================
   ESTADO
===================================================== */

let playerHP =
    MAX_HP;

let kills =
    0;

let totalKills =
    parseInt(
        localStorage.getItem(
            "friendTotalKills"
        )
    ) || 0;

let gameRunning =
    false;

let gameTime =
    0;

let timerInterval =
    null;

let spawnTimeout =
    null;

let gameLoopId =
    null;

let keys =
    {};

let bullets =
    [];

let friends =
    [];

let lastTime =
    0;

let playerX =
    50;

let playerY =
    70;

let playerFacing =
    1;

let shootCooldown =
    false;

let damageCooldown =
    false;

let bossActive =
    false;



/* =====================================================
   POSICION
===================================================== */

function resetPlayerPosition() {

    playerX =
        50;

    playerY =
        70;

    playerFacing =
        1;

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

    player.style.transform =
        "translate(-50%, -50%) scaleX(1)";

}



/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    playerHPText.textContent =
        playerHP;

    killCounterText.textContent =
        kills;

    totalKillCounterText.textContent =
        totalKills;

    startTotalKillsText.textContent =
        totalKills;

}



/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] =
            true;


        if (
            key === "z" &&
            gameRunning
        ) {

            shoot();

        }


        if (
            [
                "w",
                "a",
                "s",
                "d",
                "z"
            ].includes(key)
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] =
            false;

    }
);



/* =====================================================
   CONTROLES PC + MOBILE
===================================================== */

function setControl(
    key,
    button
) {

    button.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            keys[key] =
                true;

        }
    );


    button.addEventListener(
        "pointerup",
        function(event) {

            event.preventDefault();

            keys[key] =
                false;

        }
    );


    button.addEventListener(
        "pointercancel",
        function() {

            keys[key] =
                false;

        }
    );


    button.addEventListener(
        "pointerleave",
        function() {

            keys[key] =
                false;

        }
    );

}


setControl(
    "w",
    moveUp
);

setControl(
    "s",
    moveDown
);

setControl(
    "a",
    moveLeft
);

setControl(
    "d",
    moveRight
);


fireButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        shoot();

    }
);



/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);



function startGame() {

    clearGame();


    startScreen.style.display =
        "none";


    game.style.display =
        "block";


    gameRunning =
        true;


    playerHP =
        MAX_HP;

    kills =
        0;

    gameTime =
        0;

    bossActive =
        false;

    damageCooldown =
        false;

    resetPlayerPosition();

    updateHUD();


    gameMusic.volume =
        0.40;

    gameMusic.currentTime =
        0;

    gameMusic.play()
        .catch(
            function() {}
        );


    timerInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                gameTime++;

                updateTimer();

            },
            1000
        );


    scheduleFriendSpawn();


    lastTime =
        performance.now();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   SALIR
===================================================== */

exitGameButton.addEventListener(
    "click",
    exitGame
);


function exitGame() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );

    clearTimeout(
        spawnTimeout
    );


    gameMusic.pause();


    clearGame();


    window.location.href =
        "index.html";

}



/* =====================================================
   LIMPIAR
===================================================== */

function clearGame() {

    clearTimeout(
        spawnTimeout
    );


    friends.forEach(
        function(friend) {

            friend.remove();

        }
    );


    friends =
        [];


    bullets.forEach(
        function(bullet) {

            bullet.remove();

        }
    );


    bullets =
        [];


    document
        .querySelectorAll(
            ".triangle, .glitchTail"
        )
        .forEach(
            function(element) {

                element.remove();

            }
        );

}



/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }


    const delta =
        time - lastTime;


    lastTime =
        time;


    movePlayer();

    updateBullets(delta);

    updateFriends(delta);

    updateTriangles(delta);

    updateTails(delta);

    checkCollisions();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   MOVER SPAMTON
===================================================== */

function movePlayer() {

    let movingLeft =
        false;

    let movingRight =
        false;


    if (keys["w"]) {

        playerY -=
            PLAYER_SPEED;

    }


    if (keys["s"]) {

        playerY +=
            PLAYER_SPEED;

    }


    if (keys["a"]) {

        playerX -=
            PLAYER_SPEED;

        movingLeft =
            true;

    }


    if (keys["d"]) {

        playerX +=
            PLAYER_SPEED;

        movingRight =
            true;

    }


    if (movingLeft) {

        playerFacing =
            -1;

    }


    if (movingRight) {

        playerFacing =
            1;

    }


    playerX =
        Math.max(
            6,
            Math.min(
                94,
                playerX
            )
        );


    playerY =
        Math.max(
            8,
            Math.min(
                92,
                playerY
            )
        );


    player.style.left =
        playerX + "%";


    player.style.top =
        playerY + "%";


    player.style.transform =
        "translate(-50%, -50%) scaleX(" +
        playerFacing +
        ")";

}



/* =====================================================
   DISPARAR
   8 DIRECCIONES
===================================================== */

function shoot() {

    if (
        !gameRunning ||
        shootCooldown
    ) {

        return;

    }


    shootCooldown =
        true;


    setTimeout(
        function() {

            shootCooldown =
                false;

        },
        120
    );


    let dx =
        0;

    let dy =
        0;


    if (keys["w"]) {
        dy = -1;
    }

    if (keys["s"]) {
        dy = 1;
    }

    if (keys["a"]) {
        dx = -1;
    }

    if (keys["d"]) {
        dx = 1;
    }


    /*
     * Si no está moviéndose,
     * dispara hacia donde mira.
     */

    if (
        dx === 0 &&
        dy === 0
    ) {

        dx =
            playerFacing;

        dy =
            0;

    }


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    dx /=
        length;

    dy /=
        length;


    const bullet =
        document.createElement(
            "img"
        );


    bullet.src =
        "pipis.gif";


    bullet.className =
        "bullet";


    bullet.dataset.x =
        playerX;

    bullet.dataset.y =
        playerY;

    bullet.dataset.dx =
        dx;

    bullet.dataset.dy =
        dy;


    bullet.style.left =
        playerX + "%";

    bullet.style.top =
        playerY + "%";


    bulletsContainer.appendChild(
        bullet
    );


    bullets.push(
        bullet
    );

}



/* =====================================================
   ACTUALIZAR BALAS
===================================================== */

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];


        let x =
            parseFloat(
                bullet.dataset.x
            );


        let y =
            parseFloat(
                bullet.dataset.y
            );


        const dx =
            parseFloat(
                bullet.dataset.dx
            );


        const dy =
            parseFloat(
                bullet.dataset.dy
            );


        x +=
            dx *
            BULLET_SPEED;


        y +=
            dy *
            BULLET_SPEED;


        bullet.dataset.x =
            x;

        bullet.dataset.y =
            y;


        bullet.style.left =
            x + "%";

        bullet.style.top =
            y + "%";


        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            bullet.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   SPAWN FRIEND
===================================================== */

function scheduleFriendSpawn() {

    if (!gameRunning) {
        return;
    }


    const delay =
        Math.random() *
        1200 +
        700;


    spawnTimeout =
        setTimeout(
            function() {

                spawnFriend();

                scheduleFriendSpawn();

            },
            delay
        );

}



/* =====================================================
   CREAR FRIEND
===================================================== */

function spawnFriend() {

    if (!gameRunning) {
        return;
    }


    let type =
        "normal";


    if (
        kills >= 100
    ) {

        const chance =
            Math.random();


        if (
            chance < 0.15
        ) {

            type =
                "glitch";

        }

        else if (
            chance < 0.40
        ) {

            type =
                "red";

        }

    }


    const friend =
        document.createElement(
            "img"
        );


    friend.src =
        "friend-sprite.gif";


    friend.className =
        "friend";


    friend.classList.add(
        "friend-" + type
    );


    /*
     * Spawn desde diferentes lados
     */

    let x;
    let y;


    const side =
        Math.floor(
            Math.random() * 4
        );


    if (side === 0) {

        x =
            Math.random() * 100;

        y =
            -5;

    }

    else if (side === 1) {

        x =
            105;

        y =
            Math.random() * 100;

    }

    else if (side === 2) {

        x =
            Math.random() * 100;

        y =
            105;

    }

    else {

        x =
            -5;

        y =
            Math.random() * 100;

    }


    friend.style.left =
        x + "%";


    friend.style.top =
        y + "%";


    let hp =
        20;


    if (
        type === "red"
    ) {

        hp =
            40;

    }


    if (
        type === "glitch"
    ) {

        hp =
            70;

    }


    friend.dataset.hp =
        hp;

    friend.dataset.x =
        x;

    friend.dataset.y =
        y;

    friend.dataset.type =
        type;


    friendsContainer.appendChild(
        friend
    );


    friends.push(
        friend
    );


    if (
        kills >= 100 &&
        !bossActive
    ) {

        spawnBoss();

    }

}



/* =====================================================
   BOSS
===================================================== */

function spawnBoss() {

    bossActive =
        true;


    showEvent(
        "!!! BOSS FRIEND !!!"
    );


    const boss =
        document.createElement(
            "img"
        );


    boss.src =
        "friend-sprite.gif";


    boss.className =
        "friend boss";


    boss.style.left =
        "50%";

    boss.style.top =
        "10%";


    boss.dataset.hp =
        "500";

    boss.dataset.x =
        "50";

    boss.dataset.y =
        "10";

    boss.dataset.type =
        "boss";


    friendsContainer.appendChild(
        boss
    );


    friends.push(
        boss
    );

}



/* =====================================================
   MOVER FRIENDS
===================================================== */

function updateFriends() {

    for (
        let i = friends.length - 1;
        i >= 0;
        i--
    ) {

        const friend =
            friends[i];


        if (
            !friend.parentNode
        ) {

            friends.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                friend.dataset.x
            );


        let y =
            parseFloat(
                friend.dataset.y
            );


        const type =
            friend.dataset.type;


        const dx =
            playerX -
            x;


        const dy =
            playerY -
            y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        let speed =
            0.035;


        if (
            type === "red"
        ) {

            speed =
                0.055;

        }


        if (
            type === "glitch"
        ) {

            speed =
                0.080;

        }


        if (
            type === "boss"
        ) {

            speed =
                0.015;

        }


        if (
            distance > 5
        ) {

            x +=
                dx /
                distance *
                speed;


            y +=
                dy /
                distance *
                speed;

        }

        else {

            let damage =
                NORMAL_DAMAGE;


            if (
                type === "red"
            ) {

                damage =
                    RED_DAMAGE;

            }


            if (
                type === "glitch"
            ) {

                damage =
                    GLITCH_DAMAGE;

            }


            if (
                type === "boss"
            ) {

                damage =
                    15;

            }


            damagePlayer(
                damage
            );

        }


        friend.dataset.x =
            x;

        friend.dataset.y =
            y;


        friend.style.left =
            x + "%";

        friend.style.top =
            y + "%";


        /*
         * Glitch lanza colas
         */

        if (
            type === "glitch" &&
            Math.random() < 0.025
        ) {

            spawnGlitchTail(
                x,
                y
            );

        }


        /*
         * Boss lanza triangulos
         */

        if (
            type === "boss" &&
            Math.random() < 0.018
        ) {

            spawnTriangle(
                x,
                y
            );

        }

    }

}



/* =====================================================
   GLITCH TAIL
===================================================== */

function spawnGlitchTail(
    x,
    y
) {

    const tail =
        document.createElement(
            "div"
        );


    tail.className =
        "glitchTail";


    tail.style.left =
        x + "%";


    tail.style.top =
        y + "%";


    tail.dataset.x =
        x;

    tail.dataset.y =
        y;


    tail.dataset.life =
        0;


    const angle =
        Math.random() *
        Math.PI *
        2;


    tail.dataset.dx =
        Math.cos(angle);

    tail.dataset.dy =
        Math.sin(angle);


    tailsContainer.appendChild(
        tail
    );

}



/* =====================================================
   MOVER COLAS
===================================================== */

function updateTails() {

    const tails =
        document.querySelectorAll(
            ".glitchTail"
        );


    tails.forEach(
        function(tail) {

            let x =
                parseFloat(
                    tail.dataset.x
                );


            let y =
                parseFloat(
                    tail.dataset.y
                );


            const dx =
                parseFloat(
                    tail.dataset.dx
                );


            const dy =
                parseFloat(
                    tail.dataset.dy
                );


            x +=
                dx *
                0.20;


            y +=
                dy *
                0.20;


            tail.dataset.x =
                x;

            tail.dataset.y =
                y;


            tail.style.left =
                x + "%";

            tail.style.top =
                y + "%";


            let life =
                parseInt(
                    tail.dataset.life
                );


            life++;


            tail.dataset.life =
                life;


            if (
                life > 40
            ) {

                tail.remove();

            }

        }
    );

}



/* =====================================================
   TRIANGULOS DEL BOSS
   NO PERSIGUEN
===================================================== */

function spawnTriangle(
    x,
    y
) {

    const triangle =
        document.createElement(
            "div"
        );


    triangle.className =
        "triangle";


    triangle.style.left =
        x + "%";

    triangle.style.top =
        y + "%";


    const angle =
        Math.random() *
        Math.PI *
        2;


    triangle.dataset.x =
        x;

    triangle.dataset.y =
        y;

    triangle.dataset.dx =
        Math.cos(angle);

    triangle.dataset.dy =
        Math.sin(angle);

    triangle.dataset.life =
        0;


    trianglesContainer.appendChild(
        triangle
    );

}



/* =====================================================
   ACTUALIZAR TRIANGULOS
===================================================== */

function updateTriangles() {

    const triangleList =
        document.querySelectorAll(
            ".triangle"
        );


    triangleList.forEach(
        function(triangle) {

            let x =
                parseFloat(
                    triangle.dataset.x
                );


            let y =
                parseFloat(
                    triangle.dataset.y
                );


            const dx =
                parseFloat(
                    triangle.dataset.dx
                );


            const dy =
                parseFloat(
                    triangle.dataset.dy
                );


            x +=
                dx *
                0.22;


            y +=
                dy *
                0.22;


            triangle.dataset.x =
                x;

            triangle.dataset.y =
                y;


            triangle.style.left =
                x + "%";

            triangle.style.top =
                y + "%";


            let life =
                parseInt(
                    triangle.dataset.life
                );


            life++;


            triangle.dataset.life =
                life;


            /*
             * Desaparece después
             * de cierto tiempo.
             */

            if (
                life > 100 ||
                x < -15 ||
                x > 115 ||
                y < -15 ||
                y > 115
            ) {

                triangle.remove();

                return;

            }


            /*
             * Colisión con jugador
             */

            const distance =
                Math.sqrt(
                    Math.pow(
                        playerX - x,
                        2
                    )
                    +
                    Math.pow(
                        playerY - y,
                        2
                    )
                );


            if (
                distance < 5
            ) {

                damagePlayer(
                    15
                );


                triangle.remove();

            }

        }
    );

}



/* =====================================================
   COLISIONES
===================================================== */

function checkCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        const bullet =
            bullets[b];


        if (
            !bullet.parentNode
        ) {

            bullets.splice(
                b,
                1
            );

            continue;

        }


        const bulletX =
            parseFloat(
                bullet.dataset.x
            );


        const bulletY =
            parseFloat(
                bullet.dataset.y
            );


        for (
            let f = friends.length - 1;
            f >= 0;
            f--
        ) {

            const friend =
                friends[f];


            if (
                !friend.parentNode
            ) {

                friends.splice(
                    f,
                    1
                );

                continue;

            }


            const friendX =
                parseFloat(
                    friend.dataset.x
                );


            const friendY =
                parseFloat(
                    friend.dataset.y
                );


            const distance =
                Math.sqrt(
                    Math.pow(
                        bulletX -
                        friendX,
                        2
                    )
                    +
                    Math.pow(
                        bulletY -
                        friendY,
                        2
                    )
                );


            if (
                distance < 8
            ) {

                hitFriend(
                    friend,
                    bullet
                );

                break;

            }

        }

    }

}



/* =====================================================
   GOLPEAR FRIEND
===================================================== */

function hitFriend(
    friend,
    bullet
) {

    const index =
        bullets.indexOf(
            bullet
        );


    if (
        index !== -1
    ) {

        bullets.splice(
            index,
            1
        );

    }


    bullet.remove();


    let hp =
        parseInt(
            friend.dataset.hp
        );


    hp -=
        20;


    friend.dataset.hp =
        hp;


    friend.classList.add(
        "hit"
    );


    setTimeout(
        function() {

            friend.classList.remove(
                "hit"
            );

        },
        100
    );


    if (
        hp <= 0
    ) {

        killFriend(
            friend
        );

    }

}



/* =====================================================
   KILL
===================================================== */

function killFriend(
    friend
) {

    friendLaugh.currentTime =
        0;


    friendLaugh.volume =
        0.20;


    friendLaugh.play()
        .catch(
            function() {}
        );


    kills++;

    totalKills++;


    localStorage.setItem(
        "friendTotalKills",
        totalKills
    );


    updateHUD();


    const index =
        friends.indexOf(
            friend
        );


    if (
        index !== -1
    ) {

        friends.splice(
            index,
            1
        );

    }


    friend.remove();


    checkAchievements();

}



/* =====================================================
   DAÑO AL JUGADOR
   3 SEGUNDOS DE COOLDOWN
===================================================== */

function damagePlayer(
    amount
) {

    if (
        !gameRunning ||
        damageCooldown
    ) {

        return;

    }


    damageCooldown =
        true;


    playerHP -=
        amount;


    if (
        playerHP < 0
    ) {

        playerHP =
            0;

    }


    updateHUD();


    player.classList.add(
        "playerDamage"
    );


    setTimeout(
        function() {

            player.classList.remove(
                "playerDamage"
            );

        },
        500
    );


    setTimeout(
        function() {

            damageCooldown =
                false;

        },
        PLAYER_HIT_COOLDOWN
    );


    if (
        playerHP <= 0
    ) {

        gameOver();

    }

}



/* =====================================================
   LOGROS
===================================================== */

function checkAchievements() {

    /*
     * BERDLY
     */

    if (
        totalKills >= 100 &&
        localStorage.getItem(
            "friendAchievement100"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement100",
            "true"
        );


        showAchievement(
            "BERDLY DESBLOQUEADO!",
            "100 KILLS"
        );

    }


    /*
     * SUSIE
     */

    if (
        totalKills >= 1000 &&
        localStorage.getItem(
            "friendAchievement1000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement1000",
            "true"
        );


        showAchievement(
            "SUSIE DESBLOQUEADA!",
            "1,000 KILLS"
        );

    }


    /*
     * NOELLE
     */

    if (
        totalKills >= 10000 &&
        localStorage.getItem(
            "friendAchievement10000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement10000",
            "true"
        );


        showAchievement(
            "NOELLE DESBLOQUEADA!",
            "10,000 KILLS"
        );

    }


    /*
     * BIG SHOT
     */

    if (
        totalKills >= 100
    ) {

        localStorage.setItem(
            "spamtonBigShotAchievement",
            "true"
        );

    }

}



/* =====================================================
   POPUP LOGRO
===================================================== */

function showAchievement(
    title,
    killsText
) {

    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "achievementPopup";


    popup.innerHTML =
        "<div>" +
        title +
        "</div>" +
        "<small>" +
        killsText +
        "</small>";


    document.body.appendChild(
        popup
    );


    setTimeout(
        function() {

            popup.classList.add(
                "show"
            );

        },
        20
    );


    setTimeout(
        function() {

            popup.classList.remove(
                "show"
            );


            setTimeout(
                function() {

                    popup.remove();

                },
                400
            );

        },
        4000
    );

}



/* =====================================================
   EVENTO
===================================================== */

let eventTimeout =
    null;


function showEvent(
    message
) {

    eventMessage.textContent =
        message;


    eventMessage.classList.add(
        "show"
    );


    clearTimeout(
        eventTimeout
    );


    eventTimeout =
        setTimeout(
            function() {

                eventMessage.classList.remove(
                    "show"
                );

            },
            2500
        );

}



/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    const minutes =
        Math.floor(
            gameTime / 60
        );


    const seconds =
        gameTime % 60;


    timerText.textContent =
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":"
        +
        String(seconds)
            .padStart(
                2,
                "0"
            );

}



/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );


    clearTimeout(
        spawnTimeout
    );


    gameMusic.pause();


    showEvent(
        "GAME OVER"
    );


    setTimeout(
        function() {

            game.style.display =
                "none";


            startScreen.style.display =
                "flex";


            updateHUD();

        },
        2000
    );

}



/* =====================================================
   INICIALIZAR
===================================================== */

updateHUD();

resetPlayerPosition();

</script>
