<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>FRIEND DESTROYER</title>

    <link
        rel="stylesheet"
        href="friend-destroyer.css"
    >

</head>


<body>


<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <div class="warning">
            !!! WARNING !!!
        </div>

        <h1>
            FRIEND DESTROYER
        </h1>

        <p>
            DESTROY THEM ALL.
        </p>

        <p>
            W A S D = MOVE
        </p>

        <p>
            Z = SHOOT
        </p>

        <p>
            MOBILE:
            JOYSTICK + SHOOT
        </p>


        <div class="startStats">

            <div>
                TOTAL KILLS:
                <span id="startTotalKills">
                    0
                </span>
            </div>

        </div>


        <button
            id="startButton"
            type="button"
        >
            [ START GAME ]
        </button>


        <br>
        <br>


        <a
            href="index.html"
            class="backButton"
        >
            [ BACK TO SPAMTON SHOP ]
        </a>

    </div>

</div>



<!-- =====================================================
     JUEGO
===================================================== -->

<div id="game">


    <!-- =================================================
         SALIR
    ================================================== -->

    <button
        id="exitGameButton"
        type="button"
    >
        [ EXIT GAME ]
    </button>



    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">

        <div class="hudBox">

            HP:

            <span id="playerHP">
                450
            </span>

            / 450

        </div>


        <div class="hudBox">

            KILLS:

            <span id="killCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TOTAL:

            <span id="totalKillCounter">
                0
            </span>

        </div>


        <div class="hudBox">

            TIME:

            <span id="timer">
                00:00
            </span>

        </div>

    </div>



    <!-- =================================================
         ÁREA DEL JUEGO
    ================================================== -->

    <div id="gameArea">


        <div id="platform"></div>


        <!-- =================================================
             SPAMTON
        ================================================== -->

        <img
            src="spamton-gun-game.gif"
            id="player"
            alt="Spamton"
        >


        <!-- =================================================
             FRIENDS
        ================================================== -->

        <div id="friends"></div>


        <!-- =================================================
             PIPIS
        ================================================== -->

        <div id="pipisRain"></div>


        <!-- =================================================
             BALAS
        ================================================== -->

        <div id="bullets"></div>


        <!-- =================================================
             TRIÁNGULOS
        ================================================== -->

        <div id="triangles"></div>


        <!-- =================================================
             POWER UPS
        ================================================== -->

        <div id="powerUps"></div>



        <!-- =================================================
             JOYSTICK
        ================================================== -->

        <div id="mobileControls">

            <div id="joystick">

                <div id="joystickKnob"></div>

            </div>


            <button
                id="mobileShoot"
                type="button"
            >
                Z
            </button>

        </div>


        <!-- =================================================
             BOTÓN DISPARAR PC / MOBILE
        ================================================== -->

        <button
            id="shootButton"
            type="button"
        >
            [ SHOOT ]
        </button>


    </div>



    <!-- =================================================
         MENSAJE EVENTO
    ================================================== -->

    <div id="eventMessage"></div>


</div>



<!-- =====================================================
     MÚSICA
===================================================== -->

<audio
    id="gameMusic"
    src="big-shot.mp3"
    loop
    preload="auto"
></audio>



<!-- =====================================================
     RISA FRIEND
===================================================== -->

<audio
    id="friendLaugh"
    src="friend-laugh.mp3"
    preload="auto"
></audio>



<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const exitGameButton =
    document.getElementById("exitGameButton");

const game =
    document.getElementById("game");

const gameArea =
    document.getElementById("gameArea");

const player =
    document.getElementById("player");

const friendsContainer =
    document.getElementById("friends");

const bulletsContainer =
    document.getElementById("bullets");

const trianglesContainer =
    document.getElementById("triangles");

const pipisContainer =
    document.getElementById("pipisRain");

const powerUpsContainer =
    document.getElementById("powerUps");

const playerHPText =
    document.getElementById("playerHP");

const killCounterText =
    document.getElementById("killCounter");

const totalKillCounterText =
    document.getElementById("totalKillCounter");

const startTotalKillsText =
    document.getElementById("startTotalKills");

const timerText =
    document.getElementById("timer");

const eventMessage =
    document.getElementById("eventMessage");

const gameMusic =
    document.getElementById("gameMusic");

const friendLaugh =
    document.getElementById("friendLaugh");

const shootButton =
    document.getElementById("shootButton");

const mobileShoot =
    document.getElementById("mobileShoot");

const joystick =
    document.getElementById("joystick");

const joystickKnob =
    document.getElementById("joystickKnob");



/* =====================================================
   CONFIGURACIÓN
===================================================== */

const MAX_HP = 450;

const PLAYER_SPEED = 0.42;

const BULLET_SPEED = 1.35;

const NORMAL_FRIEND_DAMAGE = 10;

const RED_FRIEND_DAMAGE = 15;

const GLITCH_FRIEND_DAMAGE = 20;

const FRIEND_SHOT_DAMAGE = 10;

const PLAYER_DAMAGE_COOLDOWN = 3000;

const POWERUP_LIFETIME = 9000;



/* =====================================================
   ESTADO
===================================================== */

let playerHP =
    MAX_HP;

let kills =
    0;


let totalKills =
    parseInt(
        localStorage.getItem(
            "friendTotalKills"
        )
    ) || 0;


let gameRunning =
    false;


let gameTime =
    0;


let timerInterval =
    null;


let spawnTimeout =
    null;


let gameLoopId =
    null;


let eventInterval =
    null;


let keys = {};


let bullets = [];


let friends = [];


let triangles = [];


let powerUps = [];


let bossActive =
    false;


let lastTime =
    0;


let playerX =
    50;


let playerY =
    75;


let aimX =
    50;


let aimY =
    0;


let shootCooldown =
    false;


let playerDamageCooldown =
    false;


let tripleShotActive =
    false;


let tripleShotTimeout =
    null;


let joystickActive =
    false;


let joystickX =
    0;


let joystickY =
    0;



/* =====================================================
   POSICIÓN INICIAL
===================================================== */

function resetPlayerPosition() {

    playerX = 50;

    playerY = 75;

    aimX = 50;

    aimY = 0;

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

}



/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    playerHPText.textContent =
        playerHP;

    killCounterText.textContent =
        kills;

    totalKillCounterText.textContent =
        totalKills;

    startTotalKillsText.textContent =
        totalKills;

}



/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] =
            true;


        if (
            key === "z" &&
            gameRunning
        ) {

            shoot();

        }


        if (
            [
                "w",
                "a",
                "s",
                "d",
                "z"
            ].includes(key)
        ) {

            event.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] =
            false;

    }
);



/* =====================================================
   MOUSE PARA APUNTAR
===================================================== */

gameArea.addEventListener(
    "mousemove",
    function(event) {

        if (!gameRunning) {
            return;
        }


        const rect =
            gameArea.getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        aimX =
            (mouseX / rect.width) *
            100;


        aimY =
            (mouseY / rect.height) *
            100;

    }
);



/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);



function startGame() {

    clearGame();


    startScreen.style.display =
        "none";


    game.style.display =
        "block";


    gameRunning =
        true;


    playerHP =
        MAX_HP;


    kills =
        0;


    gameTime =
        0;


    bossActive =
        false;


    tripleShotActive =
        false;


    playerDamageCooldown =
        false;


    resetPlayerPosition();


    updateHUD();


    gameMusic.volume =
        0.40;


    gameMusic.currentTime =
        0;


    gameMusic.play()
        .catch(
            function() {}
        );


    timerInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }

                gameTime++;

                updateTimer();

            },
            1000
        );


    scheduleFriendSpawn();


    eventInterval =
        setInterval(
            function() {

                if (!gameRunning) {
                    return;
                }


                if (
                    Math.random() <
                    0.15
                ) {

                    pipisRainEvent();

                }

            },
            15000
        );


    lastTime =
        performance.now();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   SALIR
===================================================== */

exitGameButton.addEventListener(
    "click",
    exitGame
);


function exitGame() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );


    clearInterval(
        eventInterval
    );


    clearTimeout(
        spawnTimeout
    );


    gameMusic.pause();


    gameMusic.currentTime =
        0;


    clearGame();


    window.location.href =
        "index.html";

}



/* =====================================================
   LIMPIAR
===================================================== */

function clearGame() {

    clearTimeout(
        spawnTimeout
    );


    friends.forEach(
        function(friend) {

            if (
                friend.parentNode
            ) {

                friend.remove();

            }

        }
    );


    friends =
        [];


    bullets.forEach(
        function(bullet) {

            if (
                bullet.parentNode
            ) {

                bullet.remove();

            }

        }
    );


    bullets =
        [];


    triangles.forEach(
        function(triangle) {

            if (
                triangle.parentNode
            ) {

                triangle.remove();

            }

        }
    );


    triangles =
        [];


    powerUps.forEach(
        function(powerUp) {

            if (
                powerUp.parentNode
            ) {

                powerUp.remove();

            }

        }
    );


    powerUps =
        [];


    document
        .querySelectorAll(
            ".healingPipis"
        )
        .forEach(
            function(pipis) {

                pipis.remove();

            }
        );

}



/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }


    const delta =
        time - lastTime;


    lastTime =
        time;


    movePlayer();

    updateBullets();

    updateFriends();

    updateTriangles();

    updatePowerUps();

    checkCollisions();


    gameLoopId =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   MOVER SPAMTON
===================================================== */

function movePlayer() {

    let moveX =
        0;

    let moveY =
        0;


    if (keys["w"]) {
        moveY -= 1;
    }


    if (keys["s"]) {
        moveY += 1;
    }


    if (keys["a"]) {
        moveX -= 1;
    }


    if (keys["d"]) {
        moveX += 1;
    }


    /*
     * JOYSTICK
     */

    moveX +=
        joystickX;

    moveY +=
        joystickY;


    const length =
        Math.sqrt(
            moveX * moveX +
            moveY * moveY
        );


    if (length > 0) {

        moveX /=
            length;

        moveY /=
            length;


        playerX +=
            moveX *
            PLAYER_SPEED;


        playerY +=
            moveY *
            PLAYER_SPEED;

    }


    playerX =
        Math.max(
            6,
            Math.min(
                94,
                playerX
            )
        );


    playerY =
        Math.max(
            8,
            Math.min(
                92,
                playerY
            )
        );


    player.style.left =
        playerX + "%";


    player.style.top =
        playerY + "%";

}



/* =====================================================
   DISPARAR
===================================================== */

function shoot() {

    if (!gameRunning) {
        return;
    }


    if (shootCooldown) {
        return;
    }


    shootCooldown =
        true;


    setTimeout(
        function() {

            shootCooldown =
                false;

        },
        110
    );


    /*
     * DIRECCIÓN
     */

    let dx =
        aimX - playerX;


    let dy =
        aimY - playerY;


    let distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
     * Si todavía no se apuntó,
     * dispara hacia arriba.
     */

    if (
        distance < 1
    ) {

        dx = 0;

        dy = -1;

        distance = 1;

    }


    dx /=
        distance;

    dy /=
        distance;


    /*
     * DISPARO TRIPLE
     */

    if (
        tripleShotActive
    ) {

        createBullet(
            dx,
            dy,
            -0.18
        );


        createBullet(
            dx,
            dy,
            0
        );


        createBullet(
            dx,
            dy,
            0.18
        );

    }

    else {

        createBullet(
            dx,
            dy,
            0
        );

    }

}



/* =====================================================
   CREAR BALA
===================================================== */

function createBullet(
    dx,
    dy,
    spread
) {

    const bullet =
        document.createElement(
            "img"
        );


    bullet.src =
        "pipis.gif";


    bullet.className =
        "bullet";


    if (
        tripleShotActive
    ) {

        bullet.classList.add(
            "tripleBullet"
        );

    }


    let finalDX =
        dx;


    let finalDY =
        dy;


    /*
     * Rotación de dirección
     */

    if (
        spread !== 0
    ) {

        const angle =
            Math.atan2(
                dy,
                dx
            );


        const newAngle =
            angle + spread;


        finalDX =
            Math.cos(
                newAngle
            );


        finalDY =
            Math.sin(
                newAngle
            );

    }


    bullet.dataset.x =
        playerX;

    bullet.dataset.y =
        playerY;


    bullet.dataset.dx =
        finalDX;

    bullet.dataset.dy =
        finalDY;


    bullet.style.left =
        playerX + "%";


    bullet.style.top =
        playerY + "%";


    bulletsContainer.appendChild(
        bullet
    );


    bullets.push(
        bullet
    );

}



/* =====================================================
   ACTUALIZAR BALAS
===================================================== */

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet =
            bullets[i];


        if (
            !bullet.parentNode
        ) {

            bullets.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                bullet.dataset.x
            );


        let y =
            parseFloat(
                bullet.dataset.y
            );


        const dx =
            parseFloat(
                bullet.dataset.dx
            );


        const dy =
            parseFloat(
                bullet.dataset.dy
            );


        x +=
            dx *
            BULLET_SPEED;


        y +=
            dy *
            BULLET_SPEED;


        bullet.dataset.x =
            x;

        bullet.dataset.y =
            y;


        bullet.style.left =
            x + "%";

        bullet.style.top =
            y + "%";


        /*
         * Rotar Pipis según dirección
         */

        const angle =
            Math.atan2(
                dy,
                dx
            ) *
            180 /
            Math.PI;


        bullet.style.transform =
            "translate(-50%, -50%) rotate(" +
            angle +
            "deg)";


        /*
         * Fuera del cuadro
         */

        if (
            x < -10 ||
            x > 110 ||
            y < -10 ||
            y > 110
        ) {

            bullet.remove();

            bullets.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   SPAWN DESDE LOS BORDES
===================================================== */

function scheduleFriendSpawn() {

    if (!gameRunning) {
        return;
    }


    const delay =
        Math.random() *
        1600 +
        700;


    spawnTimeout =
        setTimeout(
            function() {

                if (!gameRunning) {
                    return;
                }


                spawnFriend();


                scheduleFriendSpawn();

            },
            delay
        );

}



/* =====================================================
   CREAR FRIEND
===================================================== */

function spawnFriend() {

    if (!gameRunning) {
        return;
    }


    let type =
        "normal";


    if (
        kills >= 1000
    ) {

        const random =
            Math.random();


        if (
            random < 0.25
        ) {

            type =
                "glitch";

        }

        else if (
            random < 0.60
        ) {

            type =
                "red";

        }

    }

    else if (
        kills >= 100
    ) {

        if (
            Math.random() < 0.40
        ) {

            type =
                "red";

        }

    }


    const friend =
        document.createElement(
            "img"
        );


    friend.src =
        "friend-sprite.gif";


    friend.className =
        "friend";


    friend.classList.add(
        "friend-" +
        type
    );


    /*
     * ENTRADA DESDE LOS BORDES
     */

    let x;

    let y;

    let targetX =
        Math.random() *
        80 +
        10;

    let targetY =
        Math.random() *
        70 +
        10;


    const side =
        Math.floor(
            Math.random() * 4
        );


    if (
        side === 0
    ) {

        /*
         * IZQUIERDA
         */

        x = -8;

        y = targetY;

    }

    else if (
        side === 1
    ) {

        /*
         * DERECHA
         */

        x = 108;

        y = targetY;

    }

    else if (
        side === 2
    ) {

        /*
         * ARRIBA
         */

        x = targetX;

        y = -8;

    }

    else {

        /*
         * ABAJO
         */

        x = targetX;

        y = 108;

    }


    friend.style.left =
        x + "%";


    friend.style.top =
        y + "%";


    /*
     * VIDA
     */

    let hp =
        20;


    if (
        type === "red"
    ) {

        hp =
            45;

    }


    if (
        type === "glitch"
    ) {

        hp =
            80;

    }


    friend.dataset.hp =
        hp;


    friend.dataset.x =
        x;


    friend.dataset.y =
        y;


    friend.dataset.targetX =
        targetX;


    friend.dataset.targetY =
        targetY;


    friend.dataset.type =
        type;


    friend.dataset.entering =
        "true";


    friendsContainer.appendChild(
        friend
    );


    friends.push(
        friend
    );


    /*
     * BOSS
     */

    if (
        kills >= 100 &&
        !bossActive
    ) {

        spawnBoss();

    }

}



/* =====================================================
   BOSS
===================================================== */

function spawnBoss() {

    if (bossActive) {
        return;
    }


    bossActive =
        true;


    showEvent(
        "!!! BOSS FRIEND !!!"
    );


    const boss =
        document.createElement(
            "img"
        );


    boss.src =
        "friend-sprite.gif";


    boss.className =
        "friend boss";


    boss.style.left =
        "50%";


    boss.style.top =
        "-15%";


    boss.dataset.hp =
        500;


    boss.dataset.x =
        50;


    boss.dataset.y =
        -15;


    boss.dataset.type =
        "boss";


    boss.dataset.dx =
        0;


    boss.dataset.dy =
        0;


    boss.dataset.entering =
        "true";


    friendsContainer.appendChild(
        boss
    );


    friends.push(
        boss
    );

}



/* =====================================================
   MOVER FRIENDS
===================================================== */

function updateFriends() {

    for (
        let i = friends.length - 1;
        i >= 0;
        i--
    ) {

        const friend =
            friends[i];


        if (
            !friend.parentNode
        ) {

            friends.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                friend.dataset.x
            );


        let y =
            parseFloat(
                friend.dataset.y
            );


        const type =
            friend.dataset.type;


        /*
         * ENTRADA
         */

        if (
            friend.dataset.entering ===
            "true"
        ) {

            const targetX =
                parseFloat(
                    friend.dataset.targetX
                );


            const targetY =
                parseFloat(
                    friend.dataset.targetY
                );


            const dx =
                targetX - x;


            const dy =
                targetY - y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            let entrySpeed =
                0.16;


            if (
                type === "red"
            ) {

                entrySpeed =
                    0.20;

            }


            if (
                type === "glitch"
            ) {

                entrySpeed =
                    0.25;

            }


            if (
                type === "boss"
            ) {

                entrySpeed =
                    0.07;

            }


            if (
                distance > 2
            ) {

                x +=
                    (
                        dx /
                        distance
                    ) *
                    entrySpeed;


                y +=
                    (
                        dy /
                        distance
                    ) *
                    entrySpeed;

            }

            else {

                friend.dataset.entering =
                    "false";

            }

        }

        else {

            /*
             * BOSS
             */

            if (
                type === "boss"
            ) {

                const dx =
                    playerX - x;


                const dy =
                    playerY - y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (
                    distance > 7
                ) {

                    x +=
                        (
                            dx /
                            distance
                        ) *
                        0.018;


                    y +=
                        (
                            dy /
                            distance
                        ) *
                        0.018;

                }

            }

            else {

                /*
                 * FRIEND NORMAL / RED / GLITCH
                 */

                const dx =
                    playerX - x;


                const dy =
                    playerY - y;


                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                let speed =
                    0.032;


                if (
                    type === "red"
                ) {

                    speed =
                        0.050;

                }


                if (
                    type === "glitch"
                ) {

                    speed =
                        0.070;

                }


                if (
                    distance > 5
                ) {

                    x +=
                        (
                            dx /
                            distance
                        ) *
                        speed;


                    y +=
                        (
                            dy /
                            distance
                        ) *
                        speed;

                }

                else {

                    let damage =
                        NORMAL_FRIEND_DAMAGE;


                    if (
                        type === "red"
                    ) {

                        damage =
                            RED_FRIEND_DAMAGE;

                    }


                    if (
                        type === "glitch"
                    ) {

                        damage =
                            GLITCH_FRIEND_DAMAGE;

                    }


                    damagePlayer(
                        damage
                    );

                }

            }

        }


        /*
         * TRIÁNGULOS DEL BOSS
         */

        if (
            type === "boss"
        ) {

            if (
                Math.random() <
                0.012
            ) {

                spawnTriangle(
                    x,
                    y
                );

            }

        }


        /*
         * COLAS DEL GLITCH
         */

        if (
            type === "glitch"
        ) {

            if (
                Math.random() <
                0.025
            ) {

                spawnGlitchTail(
                    x,
                    y
                );

            }

        }


        friend.dataset.x =
            x;


        friend.dataset.y =
            y;


        friend.style.left =
            x + "%";


        friend.style.top =
            y + "%";

    }

}



/* =====================================================
   TRIÁNGULO
   AHORA VIAJA RECTO
===================================================== */

function spawnTriangle(
    x,
    y
) {

    const triangle =
        document.createElement(
            "div"
        );


    triangle.className =
        "triangle";


    triangle.style.left =
        x + "%";


    triangle.style.top =
        y + "%";


    /*
     * Dirección aleatoria
     */

    const angle =
        Math.random() *
        Math.PI *
        2;


    const dx =
        Math.cos(angle);


    const dy =
        Math.sin(angle);


    triangle.dataset.x =
        x;


    triangle.dataset.y =
        y;


    triangle.dataset.dx =
        dx;


    triangle.dataset.dy =
        dy;


    triangle.style.transform =
        "translate(-50%, -50%) rotate(" +
        (
            angle *
            180 /
            Math.PI
        ) +
        "deg)";


    trianglesContainer.appendChild(
        triangle
    );


    triangles.push(
        triangle
    );

}



/* =====================================================
   ACTUALIZAR TRIÁNGULOS
===================================================== */

function updateTriangles() {

    for (
        let i = triangles.length - 1;
        i >= 0;
        i--
    ) {

        const triangle =
            triangles[i];


        if (
            !triangle.parentNode
        ) {

            triangles.splice(
                i,
                1
            );

            continue;

        }


        let x =
            parseFloat(
                triangle.dataset.x
            );


        let y =
            parseFloat(
                triangle.dataset.y
            );


        const dx =
            parseFloat(
                triangle.dataset.dx
            );


        const dy =
            parseFloat(
                triangle.dataset.dy
            );


        /*
         * SIN TRACKING
         */

        x +=
            dx *
            0.20;


        y +=
            dy *
            0.20;


        triangle.dataset.x =
            x;


        triangle.dataset.y =
            y;


        triangle.style.left =
            x + "%";


        triangle.style.top =
            y + "%";


        /*
         * Colisión
         */

        const distance =
            Math.sqrt(
                Math.pow(
                    playerX - x,
                    2
                )
                +
                Math.pow(
                    playerY - y,
                    2
                )
            );


        if (
            distance < 5
        ) {

            damagePlayer(
                15
            );


            triangle.remove();


            triangles.splice(
                i,
                1
            );


            continue;

        }


        /*
         * Fuera del cuadro
         */

        if (
            x < -15 ||
            x > 115 ||
            y < -15 ||
            y > 115
        ) {

            triangle.remove();


            triangles.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   COLA GLITCH
===================================================== */

function spawnGlitchTail(
    x,
    y
) {

    const tail =
        document.createElement(
            "div"
        );


    tail.className =
        "glitchTail";


    tail.style.left =
        x + "%";


    tail.style.top =
        y + "%";


    tail.dataset.life =
        30;


    trianglesContainer.appendChild(
        tail
    );


    setTimeout(
        function() {

            if (
                tail.parentNode
            ) {

                tail.remove();

            }

        },
        700
    );

}



/* =====================================================
   COLISIONES
===================================================== */

function checkCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        const bullet =
            bullets[b];


        if (
            !bullet.parentNode
        ) {

            bullets.splice(
                b,
                1
            );

            continue;

        }


        const bulletX =
            parseFloat(
                bullet.dataset.x
            );


        const bulletY =
            parseFloat(
                bullet.dataset.y
            );


        for (
            let f = friends.length - 1;
            f >= 0;
            f--
        ) {

            const friend =
                friends[f];


            if (
                !friend.parentNode
            ) {

                friends.splice(
                    f,
                    1
                );

                continue;

            }


            const friendX =
                parseFloat(
                    friend.dataset.x
                );


            const friendY =
                parseFloat(
                    friend.dataset.y
                );


            const distance =
                Math.sqrt(
                    Math.pow(
                        bulletX -
                        friendX,
                        2
                    )
                    +
                    Math.pow(
                        bulletY -
                        friendY,
                        2
                    )
                );


            if (
                distance < 8
            ) {

                hitFriend(
                    friend,
                    bullet
                );


                break;

            }

        }

    }


    /*
     * POWER UPS
     */

    for (
        let i = powerUps.length - 1;
        i >= 0;
        i--
    ) {

        const powerUp =
            powerUps[i];


        const x =
            parseFloat(
                powerUp.dataset.x
            );


        const y =
            parseFloat(
                powerUp.dataset.y
            );


        const distance =
            Math.sqrt(
                Math.pow(
                    playerX - x,
                    2
                )
                +
                Math.pow(
                    playerY - y,
                    2
                )
            );


        if (
            distance < 7
        ) {

            collectPowerUp(
                powerUp
            );


            powerUps.splice(
                i,
                1
            );

        }

    }

}



/* =====================================================
   GOLPEAR FRIEND
===================================================== */

function hitFriend(
    friend,
    bullet
) {

    const bulletIndex =
        bullets.indexOf(
            bullet
        );


    if (
        bulletIndex !== -1
    ) {

        bullets.splice(
            bulletIndex,
            1
        );

    }


    bullet.remove();


    let hp =
        parseInt(
            friend.dataset.hp
        );


    hp -=
        FRIEND_SHOT_DAMAGE;


    friend.dataset.hp =
        hp;


    friend.classList.add(
        "hit"
    );


    setTimeout(
        function() {

            friend.classList.remove(
                "hit"
            );

        },
        100
    );


    if (
        hp <= 0
    ) {

        killFriend(
            friend
        );

    }

}



/* =====================================================
   MATAR FRIEND
===================================================== */

function killFriend(
    friend
) {

    friendLaugh.currentTime =
        0;


    friendLaugh.volume =
        0.20;


    friendLaugh.play()
        .catch(
            function() {}
        );


    kills++;


    totalKills++;


    localStorage.setItem(
        "friendTotalKills",
        totalKills
    );


    updateHUD();


    const index =
        friends.indexOf(
            friend
        );


    if (
        index !== -1
    ) {

        friends.splice(
            index,
            1
        );

    }


    const x =
        parseFloat(
            friend.dataset.x
        );


    const y =
        parseFloat(
            friend.dataset.y
        );


    friend.remove();


    /*
     * POWER UP
     *
     * 8% de probabilidad
     */

    if (
        Math.random() < 0.08
    ) {

        spawnPowerUp(
            x,
            y
        );

    }


    checkAchievements();

}



/* =====================================================
   POWER UP
===================================================== */

function spawnPowerUp(
    x,
    y
) {

    const powerUp =
        document.createElement(
            "img"
        );


    powerUp.src =
        "pipis.gif";


    powerUp.className =
        "powerUp";


    const type =
        Math.random() < 0.50
            ? "green"
            : "glitch";


    powerUp.classList.add(
        "power-" +
        type
    );


    powerUp.dataset.type =
        type;


    powerUp.dataset.x =
        x;


    powerUp.dataset.y =
        y;


    powerUp.style.left =
        x + "%";


    powerUp.style.top =
        y + "%";


    powerUpsContainer.appendChild(
        powerUp
    );


    powerUps.push(
        powerUp
    );


    setTimeout(
        function() {

            const index =
                powerUps.indexOf(
                    powerUp
                );


            if (
                index !== -1
            ) {

                powerUps.splice(
                    index,
                    1
                );

            }


            if (
                powerUp.parentNode
            ) {

                powerUp.remove();

            }

        },
        POWERUP_LIFETIME
    );

}



/* =====================================================
   RECOGER POWER UP
===================================================== */

function collectPowerUp(
    powerUp
) {

    const type =
        powerUp.dataset.type;


    if (
        type === "green"
    ) {

        playerHP +=
            10;


        if (
            playerHP > MAX_HP
        ) {

            playerHP =
                MAX_HP;

        }


        showEvent(
            "💚 +10 HP"
        );

    }


    if (
        type === "glitch"
    ) {

        tripleShotActive =
            true;


        clearTimeout(
            tripleShotTimeout
        );


        showEvent(
            "!!! GLITCH PIPIS !!!"
        );


        tripleShotTimeout =
            setTimeout(
                function() {

                    tripleShotActive =
                        false;


                    showEvent(
                        "TRIPLE SHOT OFF"
                    );

                },
                10000
            );

    }


    updateHUD();


    powerUp.remove();

}



/* =====================================================
   DAÑO AL JUGADOR
===================================================== */

function damagePlayer(
    amount
) {

    if (!gameRunning) {
        return;
    }


    /*
     * COOLDOWN DE 3 SEGUNDOS
     */

    if (
        playerDamageCooldown
    ) {

        return;

    }


    playerDamageCooldown =
        true;


    playerHP -=
        amount;


    if (
        playerHP < 0
    ) {

        playerHP =
            0;

    }


    updateHUD();


    player.classList.remove(
        "playerHit"
    );


    void player.offsetWidth;


    player.classList.add(
        "playerHit"
    );


    setTimeout(
        function() {

            player.classList.remove(
                "playerHit"
            );

        },
        400
    );


    setTimeout(
        function() {

            playerDamageCooldown =
                false;

        },
        PLAYER_DAMAGE_COOLDOWN
    );


    if (
        playerHP <= 0
    ) {

        gameOver();

    }

}



/* =====================================================
   LLUVIA DE PIPIS
===================================================== */

function pipisRainEvent() {

    if (!gameRunning) {
        return;
    }


    showEvent(
        "!!! PIPIS RAIN !!!"
    );


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const pipis =
            document.createElement(
                "img"
            );


        pipis.src =
            "pipis.gif";


        pipis.className =
            "healingPipis";


        pipis.style.left =
            Math.random() *
            100 +
            "%";


        pipis.style.animationDelay =
            Math.random() *
            1.5 +
            "s";


        pipisContainer.appendChild(
            pipis
        );


        setTimeout(
            function() {

                if (
                    pipis.parentNode
                ) {

                    pipis.remove();

                }

            },
            5000
        );

    }


    playerHP +=
        100;


    if (
        playerHP > MAX_HP
    ) {

        playerHP =
            MAX_HP;

    }


    updateHUD();

}



/* =====================================================
   LOGROS
===================================================== */

function checkAchievements() {

    /*
     * BERDLY - 100
     */

    if (
        totalKills >= 100 &&
        localStorage.getItem(
            "friendAchievement100"
        ) !== "true"
    ) {

        );


        showAchievement(
            "BERDLY UNLOCKED!",
            "berdly.gif"
        );

    }


    /*
     * SUSIE - 1000
     */

    if (
        totalKills >= 1000 &&
        localStorage.getItem(
            "friendAchievement1000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement1000",
            "true"
        );


        showAchievement(
            "SUSIE UNLOCKED!",
            "susie-eating-pancakes.gif"
        );

    }


    /*
     * NOELLE - 10000
     */

    if (
        totalKills >= 10000 &&
        localStorage.getItem(
            "friendAchievement10000"
        ) !== "true"
    ) {

        localStorage.setItem(
            "friendAchievement10000",
            "true"
        );


        showAchievement(
            "NOELLE UNLOCKED!",
            "noelle.gif"
        );

    }

}



/* =====================================================
   POPUP LOGRO
===================================================== */

function showAchievement(
    message,
    imageSrc
) {

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "achievementPopup";


    const title =
        document.createElement(
            "div"
        );


    title.textContent =
        message;


    box.appendChild(
        title
    );


    if (
        imageSrc
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            imageSrc;


        image.className =
            "achievementCharacter";


        image.onerror =
            function() {

                image.style.display =
                    "none";

            };


        box.appendChild(
            image
        );

    }

        box
    );


    setTimeout(
        function() {

            box.classList.add(

            );

    );


    setTimeout(
        function() {

            box.classList.remove(
                "show"
            );


            setTimeout(
                function() {

                    box.remove();

                },
                500
            );

        },
        4500
    );

}



/* =====================================================
   EVENTO
===================================================== */

let eventMessageTimeout =
    null;


function showEvent(
    message
) {

    eventMessage.textContent =
        message;


    eventMessage.classList.add(
        "show"
    );


    clearTimeout(
        eventMessageTimeout
    );


    eventMessageTimeout =
        setTimeout(
            function() {

                eventMessage.classList.remove(
                    "show"
                );

            },
            2200
        );

}



/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    const minutes =
        Math.floor(
            gameTime / 60
        );


    const seconds =
        gameTime % 60;


    timerText.textContent =
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":"
        +
        String(seconds)
            .padStart(
                2,
                "0"
            );

}



/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning =
        false;


    clearInterval(
        timerInterval
    );


    clearInterval(
        eventInterval
    );


    clearTimeout(
        spawnTimeout
    );


    gameMusic.pause();


    showEvent(
        "GAME OVER"
    );


    setTimeout(
        function() {

            game.style.display =
                "none";


            startScreen.style.display =
                "flex";


            updateHUD();


        },
        2000
    );

}



/* =====================================================
   JOYSTICK
===================================================== */

let joystickPointerId =
    null;


function updateJoystick(
    clientX,
    clientY
) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        clientX -
        centerX;


    let dy =
        clientY -
        centerY;


    const maxDistance =
        rect.width *
        0.32;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > maxDistance
    ) {

        dx =
            (
                dx /
                distance
            ) *
            maxDistance;


        dy =
            (
                dy /
                distance
            ) *
            maxDistance;

    }


    joystickKnob.style.transform =
        "translate(" +
        dx +
        "px, " +
        dy +
        "px)";


    joystickX =
        dx /
        maxDistance;


    joystickY =
        dy /
        maxDistance;

}



function resetJoystick() {

    joystickPointerId =
        null;


    joystickX =
        0;


    joystickY =
        0;


    joystickKnob.style.transform =
        "translate(0, 0)";

}



joystick.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();


        joystickPointerId =
            event.pointerId;


        joystick.setPointerCapture(
            event.pointerId
        );


        joystickActive =
            true;


        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",
    function(event) {

        if (
            !joystickActive
        ) {

            return;

        }


        updateJoystick(
            event.clientX,
            event.clientY
        );

    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);



/* =====================================================
   BOTÓN DISPARO
   PC + MOBILE
===================================================== */

shootButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        shoot();

    }
);


mobileShoot.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        shoot();

    }
);



/* =====================================================
   ORIENTACIÓN DEL APUNTADO EN MOBILE
===================================================== */

gameArea.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target ===
            mobileShoot ||
            event.target ===
            joystick ||
            joystick.contains(
                event.target
            )
        ) {

            return;

        }


        const rect =
            gameArea.getBoundingClientRect();


        aimX =
            (
                (
                    event.clientX -
                    rect.left
                )
                /
                rect.width
            )
            *
            100;


        aimY =
            (
                (
                    event.clientY -
                    rect.top
                )
                /
                rect.height
            )
            *
            100;

    }
);



/* =====================================================
   ESTADO INICIAL
===================================================== */

updateHUD();

resetPlayerPosition();

</script>
