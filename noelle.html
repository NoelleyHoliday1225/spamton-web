<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOELLE HOLIDAY</title>

    <link
        rel="stylesheet"
        href="noelle.css"
    >

</head>

<body>


<!-- =====================================================
     NIEVE
===================================================== -->

<div id="snow"></div>


<!-- =====================================================
     FILTRO OSCURO
===================================================== -->

<div id="darkOverlay"></div>


<!-- =====================================================
     CONTENIDO
===================================================== -->

<main id="noelleMenu">

    <div id="noelleWarning">
        // SYSTEM ACCESS //
    </div>


    <h1>
        PROCEED
    </h1>


    <div id="noelleLine">
        NOELLE HOLIDAY
    </div>


    <!-- =================================================
         GIF PRINCIPAL
    ================================================== -->

    <img
        src="noelle.gif"
        id="noelleMain"
        alt="Noelle"
    >


    <!-- =================================================
         GALERIA
    ================================================== -->

    <div id="noelleGallery">

        <div class="noelleFrame">

            <img
                src="noelle-1.gif"
                alt="Noelle 1"
            >

        </div>


        <div class="noelleFrame">

            <img
                src="noelle-2.gif"
                alt="Noelle 2"
            >

        </div>


        <div class="noelleFrame">

            <img
                src="noelle-3.gif"
                alt="Noelle 3"
            >

        </div>

    </div>


    <!-- =================================================
         NIEVE
    ================================================== -->

    <button
        id="snowButton"
        type="button"
    >
        [ SNOW ]
    </button>


    <a
        href="index.html"
        id="backButton"
    >
        [ RETURN ]
    </a>

</main>


<script>

/* =====================================================
   BLOQUEO SECRETO
===================================================== */

const noelleUnlocked =
    localStorage.getItem(
        "noelleSecretUnlocked"
    );


if (
    noelleUnlocked !== "true"
) {

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   NIEVE
===================================================== */

const snowContainer =
    document.getElementById(
        "snow"
    );


function createSnow(
    amount = 70
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const snow =
            document.createElement(
                "div"
            );


        snow.className =
            "snowflake";


        snow.style.left =
            Math.random() * 100 +
            "vw";


        snow.style.animationDuration =
            Math.random() * 5 +
            5 +
            "s";


        snow.style.animationDelay =
            Math.random() * 5 +
            "s";


        snow.style.width =
            Math.random() * 5 +
            3 +
            "px";


        snow.style.height =
            snow.style.width;


        snowContainer.appendChild(
            snow
        );

    }

}


createSnow();


/* =====================================================
   BOTÓN NIEVE
===================================================== */

const snowButton =
    document.getElementById(
        "snowButton"
    );


snowButton.addEventListener(
    "click",
    function() {

        createSnow(40);

    }
);

</script>

</body>

</html>
