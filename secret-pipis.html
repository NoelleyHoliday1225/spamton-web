<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>???</title>

    <link
        rel="stylesheet"
        href="secret-pipis.css"
    >

</head>


<body>


    <!-- =====================================================
         BOTÓN VOLVER
    ====================================================== -->

    <a
        href="index.html"
        id="backButton"
    >
        [ BACK ]
    </a>


    <!-- =====================================================
         TÍTULO
    ====================================================== -->

    <h1>
        FIND THE SECRET PIPIS
    </h1>


    <p id="instructions">
        ONE OF THEM IS DIFFERENT...
    </p>


    <p id="counter">
        1000 PIPIS
    </p>


    <!-- =====================================================
         GRID
    ====================================================== -->

    <div id="pipisGrid"></div>


    <!-- =====================================================
         MENSAJE DE LOGRO
    ====================================================== -->

    <div
        id="achievementPopup"
        aria-hidden="true"
    >

        <div class="achievementIcon">
            🏆
        </div>

        <div class="achievementHeader">
            ACHIEVEMENT UNLOCKED
        </div>

        <div class="achievementName">
            BIG SHOT!
        </div>

        <div class="achievementDescription">
            YOU FOUND THE SECRET PIPIS.
        </div>

    </div>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   ELEMENTOS
                ================================================= */

                const grid =
                    document.getElementById(
                        "pipisGrid"
                    );

                const popup =
                    document.getElementById(
                        "achievementPopup"
                    );


                /* =================================================
                   COMPROBAR SI YA CONSIGUIÓ EL LOGRO
                ================================================= */

                const alreadyUnlocked =
                    localStorage.getItem(
                        "spamtonBigShotAchievement"
                    ) === "true";


                /*
                   Si ya consiguió el logro,
                   NO permitimos volver a entrar
                   a la sala.
                */

                if (alreadyUnlocked) {

                    showCompletedRoom();

                    return;

                }


                /* =================================================
                   CANTIDAD
                ================================================= */

                const TOTAL_PIPIS = 1000;


                /*
                   Elegimos un Pipis secreto.
                */

                const secretIndex =
                    Math.floor(
                        Math.random() *
                        TOTAL_PIPIS
                    );


                /* =================================================
                   CREAR LOS 1000 PIPIS
                ================================================= */

                for (
                    let i = 0;
                    i < TOTAL_PIPIS;
                    i++
                ) {


                    const pipis =
                        document.createElement(
                            "img"
                        );


                    pipis.src =
                        "pipis.gif";


                    pipis.alt =
                        "Pipis";


                    pipis.className =
                        "grid-pipis";


                    /*
                       EL PIPIS SECRETO
                    */

                    if (
                        i === secretIndex
                    ) {


                        pipis.classList.add(
                            "secret-pipis"
                        );


                        pipis.setAttribute(
                            "aria-label",
                            "???"
                        );


                        pipis.addEventListener(
                            "click",
                            function () {

                                unlockAchievement(
                                    pipis
                                );

                            }
                        );

                    }


                    grid.appendChild(
                        pipis
                    );

                }


                /* =================================================
                   DESBLOQUEAR LOGRO
                ================================================= */

                function unlockAchievement(
                    secretPipis
                ) {


                    /*
                       Guardar permanentemente
                    */

                    localStorage.setItem(
                        "spamtonBigShotAchievement",
                        "true"
                    );


                    /*
                       Evitar múltiples clics
                    */

                    secretPipis.style.pointerEvents =
                        "none";


                    /*
                       Animación
                    */

                    secretPipis.classList.add(
                        "secret-found"
                    );


                    /*
                       Mostrar logro
                    */

                    popup.classList.add(
                        "show"
                    );


                    popup.setAttribute(
                        "aria-hidden",
                        "false"
                    );


                    /*
                       Después del logro,
                       ya no se puede volver
                       a usar esta sala.
                    */

                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        3500
                    );

                }


                /* =================================================
                   SALA YA COMPLETADA
                ================================================= */

                function showCompletedRoom() {


                    document.body.innerHTML = "";


                    const message =
                        document.createElement(
                            "div"
                        );


                    message.id =
                        "alreadyCompleted";


                    message.innerHTML = `

                        <div class="completedIcon">
                            🏆
                        </div>

                        <h1>
                            BIG SHOT!
                        </h1>

                        <p>
                            YOU ALREADY FOUND
                            THE SECRET PIPIS.
                        </p>

                        <p>
                            THIS ROOM IS NOW CLOSED.
                        </p>

                        <a href="index.html">
                            [ RETURN TO SHOP ]
                        </a>

                    `;


                    document.body.appendChild(
                        message
                    );

                }


            }
        );

    </script>


</body>

</html>
